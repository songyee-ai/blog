<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">배포한 챗봇이 부르는 곳 — 서버가 아니라 내 컴퓨터</text>
  <text x="24" y="50" font-size="12" fill="#57606a">점선 상자 안은 모두 사용자 한 사람의 컴퓨터다.</text>

  <g font-size="12">
    <rect x="24" y="96" width="200" height="132" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="40" y="120" font-size="14" font-weight="700" fill="#1f2328">GitHub Pages</text>
    <text x="40" y="142" fill="#57606a">YOUR_ID.github.io</text>
    <text x="40" y="168" fill="#1f2328">HTML · JS · 청크 JSON</text>
    <text x="40" y="188" fill="#1f2328">파일만 건넨다</text>
    <text x="40" y="214" fill="#cf222e" font-weight="700">답을 만들지 않는다</text>

    <line x1="224" y1="162" x2="282" y2="162" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="230" y="152" fill="#57606a">파일</text>

    <rect x="268" y="70" width="468" height="270" rx="12" fill="none" stroke="#8c959f" stroke-dasharray="6 4"/>
    <text x="284" y="92" font-size="13" font-weight="700" fill="#57606a">사용자 컴퓨터</text>

    <rect x="288" y="108" width="196" height="120" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="304" y="132" font-size="14" font-weight="700" fill="#0969da">브라우저</text>
    <text x="304" y="154" fill="#1f2328">페이지가 여기서 돈다</text>
    <text x="304" y="174" fill="#1f2328">임베딩 · 검색도 여기서</text>
    <text x="304" y="194" fill="#57606a">출처: github.io</text>

    <rect x="524" y="108" width="196" height="120" rx="10" fill="#fff8c5" stroke="#9a6700"/>
    <text x="540" y="132" font-size="14" font-weight="700" fill="#9a6700">Ollama</text>
    <text x="540" y="154" fill="#1f2328">localhost:11434</text>
    <text x="540" y="174" fill="#1f2328">qwen3.5:2b가 답한다</text>

    <line x1="484" y1="158" x2="522" y2="158" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="522" y1="186" x2="486" y2="186" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="288" y="248" width="432" height="76" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="304" y="272" font-size="14" font-weight="700" fill="#1a7f37">CORS — 브라우저가 묻고, Ollama가 허락한다</text>
    <text x="304" y="294" fill="#1f2328">"github.io에서 온 페이지가 너를 불러도 돼?"</text>
    <text x="304" y="314" fill="#57606a">OLLAMA_ORIGINS="https://YOUR_ID.github.io" 설정 → Ollama 재시작</text>
  </g>
</svg>
