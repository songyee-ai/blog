<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="제로샷은 예시 없이 문제만 주고, 퓨샷은 예시 두세 개를 문제와 함께 보여 준다. 두 경우 모두 모델 속 숫자는 바뀌지 않는다. 반면 학습은 내 자료 여러 개로 모델 속 숫자를 직접 고친다">
  <!-- 제로샷 -->
  <rect x="20" y="20" width="230" height="300" rx="12" fill="#ddf4ff" fill-opacity="0.6" stroke="#0969da" stroke-width="1.5"/>
  <text x="135" y="50" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">제로샷</text>
  <text x="135" y="72" font-size="13" fill="#57606a" text-anchor="middle">예시 0개</text>
  <rect x="40" y="92" width="190" height="150" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
  <text x="56" y="120" font-size="13" fill="#57606a">주는 것</text>
  <text x="56" y="148" font-size="14" fill="#1f2328">문제: "이 문장 영어로"</text>
  <text x="56" y="222" font-size="13" fill="#57606a">(예시 없음)</text>
  <text x="135" y="276" font-size="13" fill="#1f2328" text-anchor="middle">미리 배운 것만으로</text>
  <text x="135" y="298" font-size="13" fill="#1f2328" text-anchor="middle">바로 답한다</text>

  <!-- 퓨샷 -->
  <rect x="265" y="20" width="230" height="300" rx="12" fill="#ddf4ff" fill-opacity="0.6" stroke="#0969da" stroke-width="1.5"/>
  <text x="380" y="50" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">퓨샷</text>
  <text x="380" y="72" font-size="13" fill="#57606a" text-anchor="middle">예시 몇 개</text>
  <rect x="285" y="92" width="190" height="150" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
  <text x="301" y="120" font-size="13" fill="#57606a">주는 것</text>
  <text x="301" y="146" font-size="13" fill="#1f2328">예시: 사과 → apple</text>
  <text x="301" y="168" font-size="13" fill="#1f2328">예시: 나무 → tree</text>
  <text x="301" y="190" font-size="13" fill="#1f2328">예시: 하늘 → sky</text>
  <text x="301" y="222" font-size="14" fill="#1f2328">문제: 바다 → ?</text>
  <text x="380" y="276" font-size="13" fill="#1f2328" text-anchor="middle">보여 준 예시의 꼴을</text>
  <text x="380" y="298" font-size="13" fill="#1f2328" text-anchor="middle">보고 따라 답한다</text>

  <!-- 학습 -->
  <rect x="510" y="20" width="230" height="300" rx="12" fill="#fff1e5" fill-opacity="0.6" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="625" y="50" font-size="16" font-weight="700" fill="#bc4c00" text-anchor="middle">학습시키기</text>
  <text x="625" y="72" font-size="13" fill="#57606a" text-anchor="middle">내 자료 여러 개</text>
  <rect x="530" y="92" width="190" height="150" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
  <text x="546" y="120" font-size="13" fill="#57606a">하는 일</text>
  <text x="546" y="148" font-size="13" fill="#1f2328">문제와 답을 넣어 보고</text>
  <text x="546" y="170" font-size="13" fill="#1f2328">틀린 만큼 모델 속</text>
  <text x="546" y="192" font-size="13" fill="#1f2328">숫자를 고친다</text>
  <text x="546" y="222" font-size="13" fill="#57606a">(여러 번 되풀이)</text>
  <text x="625" y="276" font-size="13" fill="#1f2328" text-anchor="middle">그 일에 맞게</text>
  <text x="625" y="298" font-size="13" fill="#1f2328" text-anchor="middle">모델이 바뀐다</text>

  <!-- 아래 줄 -->
  <text x="20" y="352" font-size="14" font-weight="700" fill="#1f2328">모델 속 숫자(가중치)가 바뀌나?</text>
  <rect x="20" y="364" width="475" height="30" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.2"/>
  <text x="257" y="384" font-size="14" font-weight="700" fill="#1a7f37" text-anchor="middle">안 바뀐다 — 보여 준 것은 이번 답에만 쓰인다</text>
  <rect x="510" y="364" width="230" height="30" rx="6" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2"/>
  <text x="625" y="384" font-size="14" font-weight="700" fill="#bc4c00" text-anchor="middle">바뀐다</text>
</svg>
