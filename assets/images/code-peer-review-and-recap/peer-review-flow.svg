<svg viewBox="0 0 760 268" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">코드 피어 리뷰 한 바퀴</text>
  <text x="24" y="50" font-size="12" fill="#57606a">파랑은 리뷰어가 하는 일, 초록은 코더(원본자)가 하는 일이다.</text>

  <rect x="24" y="70" width="110" height="92" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <circle cx="42" cy="88" r="10" fill="#0969da"/>
  <text x="42" y="92" font-size="10.5" font-weight="700" fill="#ddf4ff" text-anchor="middle">1</text>
  <text x="58" y="92" font-size="11.5" font-weight="700" fill="#1f2328">포크</text>
  <text x="36" y="118" font-size="10.5" fill="#57606a">상대 저장소를</text>
  <text x="36" y="134" font-size="10.5" fill="#57606a">내 계정으로</text>

  <path d="M138 116 l7 6 l-7 6" fill="none" stroke="#57606a" stroke-width="1.5"/>

  <rect x="144" y="70" width="110" height="92" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <circle cx="162" cy="88" r="10" fill="#0969da"/>
  <text x="162" y="92" font-size="10.5" font-weight="700" fill="#ddf4ff" text-anchor="middle">2</text>
  <text x="178" y="92" font-size="11.5" font-weight="700" fill="#1f2328">클론</text>
  <text x="156" y="118" font-size="10.5" fill="#57606a">내 컴퓨터로</text>
  <text x="156" y="134" font-size="10.5" fill="#57606a">내려받기</text>

  <path d="M258 116 l7 6 l-7 6" fill="none" stroke="#57606a" stroke-width="1.5"/>

  <rect x="264" y="70" width="110" height="92" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <circle cx="282" cy="88" r="10" fill="#0969da"/>
  <text x="282" y="92" font-size="10.5" font-weight="700" fill="#ddf4ff" text-anchor="middle">3</text>
  <text x="298" y="92" font-size="11.5" font-weight="700" fill="#1f2328">리뷰 파일</text>
  <text x="276" y="118" font-size="10.5" fill="#57606a">그 폴더에</text>
  <text x="276" y="134" font-size="10.5" fill="#57606a">Review.md 복사</text>

  <path d="M378 116 l7 6 l-7 6" fill="none" stroke="#57606a" stroke-width="1.5"/>

  <rect x="384" y="70" width="110" height="92" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <circle cx="402" cy="88" r="10" fill="#0969da"/>
  <text x="402" y="92" font-size="10.5" font-weight="700" fill="#ddf4ff" text-anchor="middle">4</text>
  <text x="418" y="92" font-size="11.5" font-weight="700" fill="#1f2328">작성</text>
  <text x="396" y="118" font-size="10.5" fill="#57606a">항목 확인 ·</text>
  <text x="396" y="134" font-size="10.5" fill="#57606a">근거 · 설명</text>

  <path d="M498 116 l7 6 l-7 6" fill="none" stroke="#57606a" stroke-width="1.5"/>

  <rect x="504" y="70" width="110" height="92" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <circle cx="522" cy="88" r="10" fill="#0969da"/>
  <text x="522" y="92" font-size="10.5" font-weight="700" fill="#ddf4ff" text-anchor="middle">5</text>
  <text x="538" y="92" font-size="11.5" font-weight="700" fill="#1f2328">PR</text>
  <text x="516" y="118" font-size="10.5" fill="#57606a">Review.md만</text>
  <text x="516" y="134" font-size="10.5" fill="#57606a">커밋 · 푸시</text>

  <path d="M618 116 l7 6 l-7 6" fill="none" stroke="#1a7f37" stroke-width="1.5"/>

  <rect x="624" y="70" width="112" height="92" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <circle cx="642" cy="88" r="10" fill="#1a7f37"/>
  <text x="642" y="92" font-size="10.5" font-weight="700" fill="#dafbe1" text-anchor="middle">6</text>
  <text x="658" y="92" font-size="11.5" font-weight="700" fill="#1f2328">머지</text>
  <text x="636" y="118" font-size="10.5" fill="#57606a">다른 파일이</text>
  <text x="636" y="134" font-size="10.5" fill="#57606a">안 바뀌었는지</text>
  <text x="636" y="150" font-size="10.5" fill="#57606a">확인한 뒤</text>

  <rect x="24" y="182" width="712" height="42" rx="8" fill="#fff8c5" stroke="#bc4c00"/>
  <text x="380" y="208" font-size="12.5" font-weight="700" fill="#bc4c00" text-anchor="middle">저장소에 실제로 더해지는 것은 Review.md 한 파일뿐이다</text>

  <text x="24" y="250" font-size="12" fill="#57606a">코드를 고쳐 주는 자리가 아니라, 읽고 판단한 근거를 남기는 자리다.</text>
</svg>
