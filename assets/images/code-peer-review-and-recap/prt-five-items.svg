<svg viewBox="0 0 760 392" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">리뷰 다섯 항목 — 각각 무엇을 묻는가</text>
  <text x="24" y="50" font-size="12" fill="#57606a">체크만 하는 것이 아니라, 왜 그렇게 봤는지를 근거와 함께 적는다.</text>

  <text x="60" y="84" font-size="11" font-weight="700" fill="#57606a">항목</text>
  <text x="220" y="84" font-size="11" font-weight="700" fill="#57606a">묻는 것</text>
  <text x="530" y="84" font-size="11" font-weight="700" fill="#57606a">근거로 붙이는 것</text>
  <line x1="24" y1="94" x2="736" y2="94" stroke="#d0d7de"/>

  <circle cx="38" cy="120" r="11" fill="#0969da"/>
  <text x="38" y="124.5" font-size="11" font-weight="700" fill="#ddf4ff" text-anchor="middle">1</text>
  <text x="60" y="118" font-size="12" font-weight="700" fill="#1f2328">완성</text>
  <text x="60" y="134" font-size="10.5" fill="#57606a">돌아가는가</text>
  <text x="220" y="125" font-size="11.5" fill="#1f2328">요구한 기능이 실제로 작동하는가</text>
  <text x="530" y="125" font-size="11.5" fill="#57606a">실행 결과 · 핵심 코드</text>
  <line x1="24" y1="148" x2="736" y2="148" stroke="#d0d7de" stroke-opacity="0.6"/>

  <circle cx="38" cy="174" r="11" fill="#0969da"/>
  <text x="38" y="178.5" font-size="11" font-weight="700" fill="#ddf4ff" text-anchor="middle">2</text>
  <text x="60" y="172" font-size="12" font-weight="700" fill="#1f2328">설명</text>
  <text x="60" y="188" font-size="10.5" fill="#57606a">읽히는가</text>
  <text x="220" y="179" font-size="11.5" fill="#1f2328">어려운 부분이 설명만 보고 이해되는가</text>
  <text x="530" y="179" font-size="11.5" fill="#57606a">주석 · 문서</text>
  <line x1="24" y1="202" x2="736" y2="202" stroke="#d0d7de" stroke-opacity="0.6"/>

  <circle cx="38" cy="228" r="11" fill="#0969da"/>
  <text x="38" y="232.5" font-size="11" font-weight="700" fill="#ddf4ff" text-anchor="middle">3</text>
  <text x="60" y="226" font-size="12" font-weight="700" fill="#1f2328">기록</text>
  <text x="60" y="242" font-size="10.5" fill="#57606a">파고들었나</text>
  <text x="220" y="233" font-size="11.5" fill="#1f2328">문제를 푼 과정이나 추가 실험이 남았는가</text>
  <text x="530" y="233" font-size="11.5" fill="#57606a">커밋 로그 · 실측값</text>
  <line x1="24" y1="256" x2="736" y2="256" stroke="#d0d7de" stroke-opacity="0.6"/>

  <circle cx="38" cy="282" r="11" fill="#bc4c00"/>
  <text x="38" y="286.5" font-size="11" font-weight="700" fill="#fff8c5" text-anchor="middle">4</text>
  <text x="60" y="280" font-size="12" font-weight="700" fill="#1f2328">회고</text>
  <text x="60" y="296" font-size="10.5" fill="#bc4c00">둘 다 빈 칸</text>
  <text x="220" y="287" font-size="11.5" fill="#1f2328">만든 사람이 무엇을 배우고 아쉬웠는가</text>
  <text x="530" y="287" font-size="11.5" fill="#57606a">회고 글</text>
  <line x1="24" y1="310" x2="736" y2="310" stroke="#d0d7de" stroke-opacity="0.6"/>

  <circle cx="38" cy="336" r="11" fill="#0969da"/>
  <text x="38" y="340.5" font-size="11" font-weight="700" fill="#ddf4ff" text-anchor="middle">5</text>
  <text x="60" y="334" font-size="12" font-weight="700" fill="#1f2328">구조</text>
  <text x="60" y="350" font-size="10.5" fill="#57606a">깔끔한가</text>
  <text x="220" y="341" font-size="11.5" fill="#1f2328">중복을 줄이고 경계를 나눴는가</text>
  <text x="530" y="341" font-size="11.5" fill="#57606a">폴더 구조 · 검사 통과</text>
  <line x1="24" y1="364" x2="736" y2="364" stroke="#d0d7de"/>

  <text x="24" y="386" font-size="11.5" fill="#bc4c00">4번은 코드가 아니라 사람의 기록을 묻는 자리라, 문서가 아무리 많아도 대신하지 못한다.</text>
</svg>
