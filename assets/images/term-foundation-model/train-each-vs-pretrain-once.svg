<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="왼쪽 예전 방식은 일이 하나 생길 때마다 내 자료를 새로 모으고 처음부터 학습시켜 모델을 하나씩 만든다. 오른쪽 기반 모델은 남의 자료를 아주 많이 한 번 미리 배워 두고, 내 일에는 자료를 보여 주기만 하는 그대로 쓰기나 내 자료로 조금만 더 가르치는 이어 학습시키기로 쓴다">
  <defs>
    <marker id="fm-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>

  <!-- 왼쪽: 예전 방식 -->
  <rect x="20" y="20" width="330" height="380" rx="12" fill="#fff1e5" fill-opacity="0.55" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="40" y="50" font-size="16" font-weight="700" fill="#bc4c00">예전 방식 — 일마다 처음부터</text>

  <rect x="40" y="70" width="290" height="70" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2"/>
  <text x="56" y="98" font-size="14" font-weight="700" fill="#1f2328">일 1. 손바닥 / 주먹</text>
  <text x="56" y="122" font-size="13" fill="#57606a">내 사진 찍기 → 학습 → 모델 A</text>

  <rect x="40" y="156" width="290" height="70" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2"/>
  <text x="56" y="184" font-size="14" font-weight="700" fill="#1f2328">일 2. 컵 / 병</text>
  <text x="56" y="208" font-size="13" fill="#57606a">새로 찍기 → 다시 학습 → 모델 B</text>

  <rect x="40" y="242" width="290" height="70" rx="8" fill="#ffffff" stroke="#bc4c00" stroke-width="1.2"/>
  <text x="56" y="270" font-size="14" font-weight="700" fill="#1f2328">일 3. …</text>
  <text x="56" y="294" font-size="13" fill="#57606a">또 처음부터</text>

  <text x="40" y="344" font-size="13" fill="#1f2328">· 내 자료가 없으면 시작도 못 한다</text>
  <text x="40" y="368" font-size="13" fill="#1f2328">· 자료가 적으면 결과가 흔들린다</text>
  <text x="40" y="392" font-size="13" fill="#1f2328">· 일이 바뀌면 모은 것을 버린다</text>

  <!-- 오른쪽: 기반 모델 -->
  <rect x="370" y="20" width="370" height="380" rx="12" fill="#dafbe1" fill-opacity="0.55" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="390" y="50" font-size="16" font-weight="700" fill="#1a7f37">기반 모델 — 한 번 넓게, 여러 번 쓰기</text>

  <rect x="390" y="70" width="330" height="62" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
  <text x="555" y="96" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">남의 자료, 아주 많이</text>
  <text x="555" y="118" font-size="13" fill="#57606a" text-anchor="middle">전력·교통·환율 숫자열, 가짜 표, 세포 1억 개…</text>

  <line x1="555" y1="134" x2="555" y2="160" stroke="#57606a" stroke-width="2" marker-end="url(#fm-ar)"/>
  <text x="566" y="152" font-size="12" fill="#57606a">미리 배우기 (누군가 한 번)</text>

  <rect x="430" y="164" width="250" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.8"/>
  <text x="555" y="196" font-size="15" font-weight="700" fill="#0969da" text-anchor="middle">미리 배워 둔 기반 모델</text>

  <line x1="500" y1="218" x2="470" y2="252" stroke="#57606a" stroke-width="2" marker-end="url(#fm-ar)"/>
  <line x1="610" y1="218" x2="640" y2="252" stroke="#57606a" stroke-width="2" marker-end="url(#fm-ar)"/>

  <rect x="390" y="256" width="160" height="128" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/>
  <text x="470" y="282" font-size="14" font-weight="700" fill="#0969da" text-anchor="middle">그대로 쓰기</text>
  <text x="470" y="308" font-size="13" fill="#1f2328" text-anchor="middle">내 자료를</text>
  <text x="470" y="328" font-size="13" fill="#1f2328" text-anchor="middle">보여 주기만</text>
  <text x="470" y="356" font-size="12" fill="#57606a" text-anchor="middle">Chronos · TabICL</text>
  <text x="470" y="374" font-size="12" fill="#57606a" text-anchor="middle">Geneformer</text>

  <rect x="560" y="256" width="160" height="128" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/>
  <text x="640" y="282" font-size="14" font-weight="700" fill="#0969da" text-anchor="middle">이어 학습시키기</text>
  <text x="640" y="308" font-size="13" fill="#1f2328" text-anchor="middle">내 분야 자료로</text>
  <text x="640" y="328" font-size="13" fill="#1f2328" text-anchor="middle">조금만 더</text>
  <text x="640" y="356" font-size="12" fill="#57606a" text-anchor="middle">cellpose</text>
  <text x="640" y="374" font-size="12" fill="#57606a" text-anchor="middle">(세포 사진용으로)</text>
</svg>
