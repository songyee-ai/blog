<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="28 곱하기 28 손글씨 이미지가 784개 숫자로 펴지고 열 개의 점수가 된 다음 소프트맥스를 거쳐 94퍼센트 확신으로 바뀌고 확신 게이트로 이어진다">
  <defs>
    <marker id="mn-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>

  <text x="30" y="30" font-size="15" font-weight="700" fill="#1f2328">그림 한 장이 "확신의 정도"가 되기까지</text>

  <rect x="30" y="52" width="150" height="148" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="105" y="76" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">손글씨 한 장</text>
  <rect x="68" y="88" width="74" height="74" rx="3" fill="#ffffff" stroke="#57606a" stroke-width="1.3"/>
  <path d="M82 104 L128 104 L104 150" fill="none" stroke="#1f2328" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="105" y="182" font-size="10.5" fill="#57606a" text-anchor="middle">28 × 28 행렬</text>

  <line x1="184" y1="126" x2="218" y2="126" stroke="#57606a" stroke-width="1.5" marker-end="url(#mn-ar)"/>
  <text x="201" y="118" font-size="9" fill="#57606a" text-anchor="middle">Flatten</text>

  <rect x="220" y="52" width="170" height="148" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="305" y="76" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">한 줄로 편다</text>
  <rect x="240" y="96" width="130" height="18" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <rect x="240" y="120" width="130" height="18" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="305" y="160" font-size="10.5" fill="#57606a" text-anchor="middle">숫자 784개 벡터</text>
  <text x="305" y="180" font-size="10" fill="#57606a" text-anchor="middle">값은 그대로, 모양만 바뀐다</text>

  <line x1="394" y1="126" x2="428" y2="126" stroke="#57606a" stroke-width="1.5" marker-end="url(#mn-ar)"/>
  <text x="411" y="118" font-size="9" fill="#57606a" text-anchor="middle">모델</text>

  <rect x="430" y="52" width="190" height="148" rx="8" fill="#fff8c5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="525" y="76" font-size="11.5" font-weight="700" fill="#bc4c00" text-anchor="middle">로짓 10개</text>
  <text x="450" y="102" font-size="11" fill="#1f2328">0　<tspan font-family="monospace">-1.2</tspan></text>
  <text x="450" y="126" font-size="11" font-weight="700" fill="#1f2328">7　<tspan font-family="monospace">8.9</tspan></text>
  <text x="450" y="150" font-size="11" fill="#1f2328">9　<tspan font-family="monospace">2.1</tspan></text>
  <text x="525" y="180" font-size="10" fill="#57606a" text-anchor="middle">왜 10개? 정답이 0~9니까</text>

  <line x1="624" y1="126" x2="658" y2="126" stroke="#57606a" stroke-width="1.5" marker-end="url(#mn-ar)"/>
  <text x="641" y="118" font-size="9" fill="#57606a" text-anchor="middle">softmax</text>

  <rect x="660" y="52" width="210" height="148" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="765" y="76" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">확신의 정도</text>
  <text x="680" y="102" font-size="11" fill="#1f2328">0　　0.2%</text>
  <text x="680" y="126" font-size="11" font-weight="700" fill="#1a7f37">7　　94.1%</text>
  <text x="680" y="150" font-size="11" fill="#1f2328">9　　5.4%</text>
  <text x="765" y="180" font-size="10" fill="#57606a" text-anchor="middle">합계 100%</text>

  <line x1="30" y1="226" x2="870" y2="226" stroke="#d0d7de" stroke-width="1"/>
  <text x="30" y="252" font-size="12.5" font-weight="700" fill="#1f2328">그리고 이게 게이트로 이어진다</text>

  <rect x="30" y="266" width="410" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="48" y="288" font-size="11" fill="#1f2328"><tspan font-family="monospace">8.9</tspan> 는 그냥 숫자다</text>
  <text x="48" y="310" font-size="10.5" fill="#57606a">크다는 것 말고는 말할 수 있는 게 없다</text>

  <rect x="465" y="266" width="405" height="56" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <text x="483" y="288" font-size="11" fill="#1f2328"><tspan font-weight="700">94%</tspan> 는 판단의 근거가 된다</text>
  <text x="483" y="310" font-size="10.5" fill="#8250df" font-family="monospace">if probs.max() &lt; 0.7:  사람에게 확인</text>
</svg>
