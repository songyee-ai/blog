<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="모델은 말, 하네스는 마구이며 둘을 합쳐야 짐을 나르는 마차, 즉 에이전트가 된다">
  <defs>
    <marker id="hh-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="30" y="30" font-size="15" font-weight="700" fill="#1f2328">하네스 = 힘을 붙들어 방향을 잡는 장비</text>

  <!-- 말 = 모델 -->
  <rect x="30" y="54" width="230" height="130" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="145" y="84" font-size="13" font-weight="700" fill="#0969da" text-anchor="middle">말</text>
  <text x="145" y="108" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">모델</text>
  <text x="145" y="132" font-size="10.5" fill="#57606a" text-anchor="middle">힘은 세지만</text>
  <text x="145" y="150" font-size="10.5" fill="#57606a" text-anchor="middle">들판을 뛰어다닐 뿐이다</text>
  <text x="145" y="170" font-size="10" fill="#57606a" text-anchor="middle">글자를 이어 내놓는 일만 한다</text>

  <text x="288" y="128" font-size="26" font-weight="700" fill="#57606a" text-anchor="middle">+</text>

  <!-- 마구 = 하네스 -->
  <rect x="316" y="54" width="230" height="130" rx="10" fill="#fff8c5" stroke="#bc4c00" stroke-width="2"/>
  <text x="431" y="84" font-size="13" font-weight="700" fill="#bc4c00" text-anchor="middle">마구(馬具)</text>
  <text x="431" y="108" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">하네스</text>
  <text x="431" y="132" font-size="10.5" fill="#57606a" text-anchor="middle">굴레 · 고삐 · 안장 · 연결끈</text>
  <text x="431" y="152" font-size="10" fill="#57606a" text-anchor="middle">루프 · 도구 연결 · 에러 처리</text>
  <text x="431" y="170" font-size="10" fill="#57606a" text-anchor="middle">컨텍스트 관리 · 안전장치</text>

  <text x="574" y="128" font-size="26" font-weight="700" fill="#57606a" text-anchor="middle">=</text>

  <!-- 마차 = 에이전트 -->
  <rect x="602" y="54" width="268" height="130" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="736" y="84" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle">짐을 나르는 마차</text>
  <text x="736" y="108" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">AI 에이전트</text>
  <text x="736" y="134" font-size="10.5" fill="#57606a" text-anchor="middle">파일을 열고, 명령을 실행하고,</text>
  <text x="736" y="152" font-size="10.5" fill="#57606a" text-anchor="middle">결과를 보고 다시 판단한다</text>
  <text x="736" y="172" font-size="10" fill="#57606a" text-anchor="middle">목적지까지 실제로 간다</text>

  <!-- 아래: 왜 중요한가 -->
  <line x1="30" y1="212" x2="870" y2="212" stroke="#d0d7de" stroke-width="1"/>

  <text x="30" y="244" font-size="12.5" font-weight="700" fill="#1f2328">그래서 이런 일이 생긴다</text>

  <rect x="30" y="256" width="405" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="48" y="280" font-size="11.5" font-weight="700" fill="#1f2328">좋은 말 + 엉망인 마구</text>
  <text x="48" y="302" font-size="10.5" fill="#57606a">마차가 제대로 굴러가지 않는다</text>

  <rect x="465" y="256" width="405" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="483" y="280" font-size="11.5" font-weight="700" fill="#1f2328">평범한 말 + 훌륭한 마구</text>
  <text x="483" y="302" font-size="10.5" fill="#57606a">꽤 많은 짐을 나른다</text>

  <line x1="435" y1="287" x2="465" y2="287" stroke="#57606a" stroke-width="1.5" marker-end="url(#hh-ar)"/>
</svg>
