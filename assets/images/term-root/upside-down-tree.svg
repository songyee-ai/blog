<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="폴더 구조는 거꾸로 뒤집힌 나무 모양이고 어느 파일에서 위로 올라가도 결국 루트에 닿으며, 루트에는 무엇의 루트인지가 늘 따라붙는다">
  <defs>
    <marker id="rt-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  </defs>

  <text x="30" y="30" font-size="15" font-weight="700" fill="#1f2328">폴더 구조는 거꾸로 세운 나무다</text>

  <!-- 트리 -->
  <rect x="255" y="52" width="130" height="36" rx="6" fill="#fff8c5" stroke="#bc4c00" stroke-width="2"/>
  <text x="320" y="76" font-size="13" font-weight="700" fill="#bc4c00" text-anchor="middle">루트 (뿌리)</text>

  <g stroke="#d0d7de" stroke-width="1.5" fill="none">
    <path d="M320 88 L320 106 L160 106 L160 124"/>
    <path d="M320 88 L320 124"/>
    <path d="M320 88 L320 106 L470 106 L470 124"/>
    <path d="M160 124 L160 160 L160 178"/>
    <path d="M160 178 L160 214 L160 232"/>
    <path d="M470 124 L470 160 L470 178"/>
  </g>

  <rect x="105" y="124" width="110" height="32" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="145" font-size="11" fill="#1f2328" text-anchor="middle">Users</text>
  <rect x="265" y="124" width="110" height="32" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="320" y="145" font-size="11" fill="#1f2328" text-anchor="middle">Windows</text>
  <rect x="415" y="124" width="110" height="32" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="470" y="145" font-size="11" fill="#1f2328" text-anchor="middle">Program Files</text>

  <rect x="105" y="178" width="110" height="32" rx="5" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="160" y="199" font-size="11" fill="#1f2328" text-anchor="middle">내이름 (홈 ~)</text>
  <rect x="415" y="178" width="110" height="32" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="470" y="199" font-size="11" fill="#1f2328" text-anchor="middle">nodejs</text>

  <rect x="105" y="232" width="110" height="32" rx="5" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="253" font-size="11" fill="#1f2328" text-anchor="middle">blog</text>

  <!-- 위로 올라가는 화살표 -->
  <path d="M96 248 L60 248 L60 70 L249 70" fill="none" stroke="#bc4c00" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#rt-up)"/>
  <text x="66" y="164" font-size="10.5" fill="#bc4c00" transform="rotate(-90 66 164)" text-anchor="middle">계속 위로 올라가면</text>

  <!-- 오른쪽 설명 -->
  <rect x="560" y="52" width="310" height="212" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="580" y="78" font-size="12.5" font-weight="700" fill="#1f2328">루트에는 늘 "무엇의"가 붙는다</text>

  <rect x="580" y="94" width="270" height="46" rx="6" fill="#ffffff" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="596" y="114" font-size="11" font-weight="700" fill="#bc4c00">파일 시스템의 루트</text>
  <text x="596" y="132" font-size="10.5" fill="#57606a"><tspan font-family="monospace">C:\</tspan>   또는   <tspan font-family="monospace">/</tspan></text>

  <rect x="580" y="148" width="270" height="46" rx="6" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="596" y="168" font-size="11" font-weight="700" fill="#8250df">프로젝트의 루트</text>
  <text x="596" y="186" font-size="10.5" fill="#57606a"><tspan font-family="monospace">blog/</tspan> — README·설정이 놓이는 자리</text>

  <rect x="580" y="202" width="270" height="46" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="596" y="222" font-size="11" font-weight="700" fill="#0969da">그 도구에게 허락한 루트</text>
  <text x="596" y="240" font-size="10.5" fill="#57606a"><tspan font-family="monospace">~/docs</tspan> — 여기 밖으론 못 나간다</text>

  <!-- 하단 -->
  <line x1="30" y1="288" x2="870" y2="288" stroke="#d0d7de" stroke-width="1"/>
  <text x="30" y="314" font-size="11" fill="#1f2328"><tspan font-weight="700">홈(~)은 루트가 아니다.</tspan> 컴퓨터를 켜면 여기서 시작하니 꼭대기처럼 느껴질 뿐, 실제로는 루트 한참 아래다.</text>
  <text x="30" y="340" font-size="11" fill="#1f2328"><tspan font-weight="700">"루트에 두세요"를 들으면</tspan> 무엇의 루트인지 먼저 확인한다. 대개 C:\ 가 아니라 프로젝트 폴더 맨 위를 말한다.</text>
</svg>
