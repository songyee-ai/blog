<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">컨텍스트는 책상이다 — 넓이보다 배치</text>
  <text x="24" y="50" font-size="12" fill="#57606a">한 번에 펼칠 수 있는 자료의 양은 정해져 있고, 어디에 두느냐에 따라 눈에 띄는 정도가 다르다.</text>

  <!-- 왼쪽: 네 칸 -->
  <rect x="24" y="68" width="380" height="222" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="92" font-size="12.5" font-weight="700" fill="#1f2328">책상을 네 칸으로 나눈다</text>

  <rect x="40" y="106" width="170" height="78" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="54" y="130" font-size="12" font-weight="700" fill="#0969da">① 역할 · 목표</text>
  <text x="54" y="150" font-size="10.5" fill="#57606a">무엇을 하는 일인가</text>
  <text x="54" y="166" font-size="10.5" fill="#57606a">"환불 문의 검토 보조"</text>

  <rect x="218" y="106" width="170" height="78" rx="8" fill="#ffe3e3" stroke="#cf222e"/>
  <text x="232" y="130" font-size="12" font-weight="700" fill="#cf222e">② 판단 기준</text>
  <text x="232" y="150" font-size="10.5" fill="#57606a">무엇을 먼저 따지나</text>
  <text x="232" y="166" font-size="10.5" fill="#cf222e">← 가장 자주 비워 둔다</text>

  <rect x="40" y="194" width="170" height="78" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="54" y="218" font-size="12" font-weight="700" fill="#9a6700">③ 근거 자료</text>
  <text x="54" y="238" font-size="10.5" fill="#57606a">무엇을 보고 답하나</text>
  <text x="54" y="254" font-size="10.5" fill="#57606a">[자료 A] [자료 B] 번호 붙이기</text>

  <rect x="218" y="194" width="170" height="78" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="232" y="218" font-size="12" font-weight="700" fill="#1a7f37">④ 출력 형식</text>
  <text x="232" y="238" font-size="10.5" fill="#57606a">어떻게 내놓나</text>
  <text x="232" y="254" font-size="10.5" fill="#57606a">결론마다 근거 번호</text>

  <!-- 오른쪽: U자 -->
  <rect x="420" y="68" width="316" height="222" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="436" y="92" font-size="12.5" font-weight="700" fill="#1f2328">중간에 둔 건 잘 놓친다</text>

  <line x1="456" y1="110" x2="456" y2="246" stroke="#57606a" stroke-width="1.5"/>
  <line x1="456" y1="246" x2="716" y2="246" stroke="#57606a" stroke-width="1.5"/>
  <text x="448" y="122" font-size="10.5" fill="#57606a" text-anchor="end">찾아 씀</text>

  <path d="M470 124 C520 214 560 226 586 226 C612 226 652 214 702 124" fill="none" stroke="#0969da" stroke-width="2.5"/>
  <circle cx="470" cy="124" r="5" fill="#1a7f37"/>
  <circle cx="586" cy="226" r="5" fill="#cf222e"/>
  <circle cx="702" cy="124" r="5" fill="#1a7f37"/>

  <text x="470" y="264" font-size="10.5" fill="#1a7f37" text-anchor="middle">맨 앞</text>
  <text x="586" y="264" font-size="10.5" fill="#cf222e" text-anchor="middle">중간</text>
  <text x="702" y="264" font-size="10.5" fill="#1a7f37" text-anchor="middle">맨 뒤</text>
  <text x="586" y="282" font-size="10.5" fill="#57606a" text-anchor="middle">중요한 정보의 위치</text>

  <text x="24" y="316" font-size="11.5" fill="#1f2328">처방은 셋 — <tspan font-weight="700">기준은 앞에, 자료엔 번호를, 답에는 근거 위치를.</tspan> 긴 책상은 자료를 많이 올리게 해 줄 뿐, 정리해 주지는 않는다.</text>
</svg>
