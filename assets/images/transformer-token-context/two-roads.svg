<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">두 길이 한 곳에서 만났다</text>
  <text x="24" y="50" font-size="12" fill="#57606a">이미지와 언어가 각자 벽에 부딪히다, 같은 열쇠(어텐션)로 트랜스포머에서 합류했다.</text>

  <!-- 이미지 길 -->
  <rect x="24" y="68" width="520" height="118" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="92" font-size="12.5" font-weight="700" fill="#0969da">이미지의 길 — 깊이의 벽</text>

  <rect x="40" y="106" width="108" height="64" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="94" y="130" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">CNN</text>
  <text x="94" y="147" font-size="10.5" fill="#57606a" text-anchor="middle">1998 · 수표 손글씨</text>
  <text x="94" y="161" font-size="10.5" fill="#57606a" text-anchor="middle">작은 돋보기로 훑기</text>

  <rect x="166" y="106" width="108" height="64" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="220" y="130" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">AlexNet</text>
  <text x="220" y="147" font-size="10.5" fill="#57606a" text-anchor="middle">2012 · 부활의 신호</text>
  <text x="220" y="161" font-size="10.5" fill="#57606a" text-anchor="middle">ReLU · 드롭아웃 · GPU</text>

  <rect x="292" y="106" width="108" height="64" rx="8" fill="#ffe3e3" stroke="#cf222e"/>
  <text x="346" y="130" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="middle">깊이의 벽</text>
  <text x="346" y="147" font-size="10.5" fill="#57606a" text-anchor="middle">더 쌓았더니</text>
  <text x="346" y="161" font-size="10.5" fill="#57606a" text-anchor="middle">오히려 못 배움</text>

  <rect x="418" y="106" width="108" height="64" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="472" y="130" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">ResNet</text>
  <text x="472" y="147" font-size="10.5" fill="#57606a" text-anchor="middle">2015 · 지름길</text>
  <text x="472" y="161" font-size="10.5" fill="#57606a" text-anchor="middle">152층 · 사람보다 정확</text>

  <!-- 언어 길 -->
  <rect x="24" y="200" width="520" height="118" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="224" font-size="12.5" font-weight="700" fill="#9a6700">언어의 길 — 순서의 벽</text>

  <rect x="40" y="238" width="108" height="64" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="94" y="262" font-size="11.5" font-weight="700" fill="#9a6700" text-anchor="middle">word2vec</text>
  <text x="94" y="279" font-size="10.5" fill="#57606a" text-anchor="middle">2013 · 단어를 숫자로</text>
  <text x="94" y="293" font-size="10.5" fill="#57606a" text-anchor="middle">이웃이 뜻을 만든다</text>

  <rect x="166" y="238" width="108" height="64" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="220" y="262" font-size="11.5" font-weight="700" fill="#9a6700" text-anchor="middle">RNN · LSTM</text>
  <text x="220" y="279" font-size="10.5" fill="#57606a" text-anchor="middle">한 단어씩 읽기</text>
  <text x="220" y="293" font-size="10.5" fill="#57606a" text-anchor="middle">앞 단어를 잊는다</text>

  <rect x="292" y="238" width="108" height="64" rx="8" fill="#ffe3e3" stroke="#cf222e"/>
  <text x="346" y="262" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="middle">병목</text>
  <text x="346" y="279" font-size="10.5" fill="#57606a" text-anchor="middle">긴 문장을</text>
  <text x="346" y="293" font-size="10.5" fill="#57606a" text-anchor="middle">벡터 하나에 욱여넣기</text>

  <rect x="418" y="238" width="108" height="64" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="472" y="262" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">어텐션</text>
  <text x="472" y="279" font-size="10.5" fill="#57606a" text-anchor="middle">원문 전체를</text>
  <text x="472" y="293" font-size="10.5" fill="#57606a" text-anchor="middle">매번 다시 돌아보기</text>

  <!-- 화살표 (상자 사이) -->
  <g stroke="#57606a" stroke-width="1.5" fill="#57606a">
    <line x1="150" y1="138" x2="160" y2="138"/><polygon points="165,138 157,134 157,142" stroke="none"/>
    <line x1="276" y1="138" x2="286" y2="138"/><polygon points="291,138 283,134 283,142" stroke="none"/>
    <line x1="402" y1="138" x2="412" y2="138"/><polygon points="417,138 409,134 409,142" stroke="none"/>
    <line x1="150" y1="270" x2="160" y2="270"/><polygon points="165,270 157,266 157,274" stroke="none"/>
    <line x1="276" y1="270" x2="286" y2="270"/><polygon points="291,270 283,266 283,274" stroke="none"/>
    <line x1="402" y1="270" x2="412" y2="270"/><polygon points="417,270 409,266 409,274" stroke="none"/>
  </g>

  <!-- 합류 -->
  <path d="M526 138 C560 138 560 190 580 190" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <path d="M526 270 C560 270 560 214 580 214" fill="none" stroke="#1a7f37" stroke-width="2"/>

  <rect x="582" y="150" width="154" height="104" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="659" y="178" font-size="13.5" font-weight="700" fill="#1a7f37" text-anchor="middle">트랜스포머</text>
  <text x="659" y="196" font-size="10.5" fill="#57606a" text-anchor="middle">2017 · 어텐션만으로</text>
  <text x="659" y="216" font-size="10.5" fill="#1f2328" text-anchor="middle">모든 조각이 서로를</text>
  <text x="659" y="231" font-size="10.5" fill="#1f2328" text-anchor="middle">한꺼번에 본다</text>

  <text x="659" y="282" font-size="10.5" fill="#57606a" text-anchor="middle">→ BERT · GPT · ViT</text>
  <text x="659" y="298" font-size="10.5" fill="#57606a" text-anchor="middle">Whisper · 로봇 · 단백질</text>

  <text x="24" y="344" font-size="11.5" fill="#1f2328">두 벽의 뿌리는 같았다 — <tspan font-weight="700">신호가 긴 사슬을 지나며 흐려지는 문제.</tspan> 처방도 닮았다: 신호가 곧장 흐르는 길을 터 준다.</text>
</svg>
