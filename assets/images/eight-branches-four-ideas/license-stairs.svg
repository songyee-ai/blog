<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">"공개됐다"와 "오늘 쓸 수 있다" 사이의 네 계단</text>
  <text x="24" y="50" font-size="12" fill="#57606a">저장소 첫 화면의 배지는 맨 아래 계단 하나만 말해 준다. 넷은 각각 다른 곳에, 다른 날 바뀔 수 있다.</text>

  <g font-size="12">
    <rect x="24" y="250" width="712" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="40" y="274" font-weight="700" fill="#1a7f37">① 코드 저장소</text>
    <text x="40" y="294" fill="#1f2328">초록 배지(MIT·BSD·아파치 2.0). 보통 소프트웨어는 여기서 끝나지만, AI 도구는 여기가 시작이다</text>

    <rect x="84" y="186" width="652" height="56" rx="8" fill="#ddf4ff" stroke="#0969da"/>
    <text x="100" y="210" font-weight="700" fill="#0969da">② 가중치가 올라간 곳</text>
    <text x="100" y="230" fill="#1f2328">조건이 따로다. 가입·토큰·실명 신청이 걸리면 오늘은 못 쓴다 (예: TabPFN)</text>

    <rect x="144" y="122" width="592" height="56" rx="8" fill="#fff8c5" stroke="#9a6700"/>
    <text x="160" y="146" font-weight="700" fill="#9a6700">③ 바탕이 된 모델</text>
    <text x="160" y="166" fill="#1f2328">남의 모델 위에 올렸으면 그 약관이 따라온다 (예: 태그는 MIT인 OpenVLA)</text>

    <rect x="204" y="58" width="532" height="56" rx="8" fill="#fbefff" stroke="#8250df"/>
    <text x="220" y="82" font-weight="700" fill="#8250df">④ 학습 자료</text>
    <text x="220" y="102" fill="#1f2328">비상업 자료로 배운 가중치는? 답이 없으면 그 사실을 그대로 법무에 (예: cellpose)</text>
  </g>
</svg>
