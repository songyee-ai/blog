<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="HTTPS에서 공개키, 개인키, 세션키가 각각 하는 일" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="k-left" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
    <marker id="k-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
    <marker id="k-both" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <!-- 양쪽 주체 -->
  <rect x="30" y="30" width="230" height="56" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="145" y="63" font-size="13" font-weight="700" fill="#0969da" text-anchor="middle">내 브라우저</text>

  <rect x="640" y="30" width="230" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="755" y="63" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle">서버</text>

  <line x1="145" y1="86" x2="145" y2="330" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="755" y1="86" x2="755" y2="330" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ① 공개키 전달 -->
  <line x1="740" y1="122" x2="160" y2="122" stroke="#8250df" stroke-width="2" marker-end="url(#k-left)"/>
  <text x="450" y="113" font-size="12" font-weight="700" fill="#8250df" text-anchor="middle">① 공개키를 건넨다 (인증서에 담겨서)</text>
  <text x="450" y="140" font-size="10.5" fill="#57606a" text-anchor="middle">누가 봐도 상관없는 열쇠라 그냥 보낸다</text>

  <!-- ② 세션키를 잠가 보냄 -->
  <line x1="160" y1="188" x2="740" y2="188" stroke="#bc4c00" stroke-width="2" marker-end="url(#k-right)"/>
  <text x="450" y="179" font-size="12" font-weight="700" fill="#bc4c00" text-anchor="middle">② 세션키를 만들어, 공개키로 잠가서 보낸다</text>
  <text x="450" y="206" font-size="10.5" fill="#57606a" text-anchor="middle">공개키는 잠글 수만 있고 열 수는 없다 — 중간에서 가로채도 못 연다</text>

  <!-- ③ 개인키로 연다 -->
  <rect x="600" y="228" width="270" height="52" rx="8" fill="#fff8c5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="735" y="250" font-size="12" font-weight="700" fill="#bc4c00" text-anchor="middle">③ 개인키로 연다</text>
  <text x="735" y="269" font-size="10.5" fill="#57606a" text-anchor="middle">서버만 가진 열쇠. 밖으로 나가지 않는다</text>

  <!-- ④ 세션키로 대화 -->
  <line x1="160" y1="320" x2="740" y2="320" stroke="#1a7f37" stroke-width="2.5" marker-start="url(#k-both)" marker-end="url(#k-both)"/>
  <text x="450" y="311" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">④ 이제부터 오가는 내용은 세션키로 잠근다</text>
  <text x="450" y="340" font-size="10.5" fill="#57606a" text-anchor="middle">①~③보다 훨씬 빠른 방식. 이번 접속에만 쓰고 버린다</text>

  <line x1="30" y1="366" x2="870" y2="366" stroke="#d0d7de"/>

  <!-- 열쇠 세 개 정리 -->
  <rect x="30" y="386" width="266" height="92" rx="8" fill="none" stroke="#8250df" stroke-width="1.5"/>
  <text x="163" y="410" font-size="12.5" font-weight="700" fill="#8250df" text-anchor="middle">공개키</text>
  <text x="163" y="432" font-size="10.5" fill="#57606a" text-anchor="middle">누구나 가질 수 있다</text>
  <text x="163" y="450" font-size="10.5" fill="#1f2328" text-anchor="middle">자물쇠를 <tspan font-weight="700">채우는</tspan> 쪽</text>
  <text x="163" y="468" font-size="10" fill="#57606a" text-anchor="middle">우편함 투입구</text>

  <rect x="317" y="386" width="266" height="92" rx="8" fill="none" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="450" y="410" font-size="12.5" font-weight="700" fill="#bc4c00" text-anchor="middle">개인키</text>
  <text x="450" y="432" font-size="10.5" fill="#57606a" text-anchor="middle">서버만 가진다</text>
  <text x="450" y="450" font-size="10.5" fill="#1f2328" text-anchor="middle">그 자물쇠를 <tspan font-weight="700">여는</tspan> 쪽</text>
  <text x="450" y="468" font-size="10" fill="#57606a" text-anchor="middle">우편함 열쇠</text>

  <rect x="604" y="386" width="266" height="92" rx="8" fill="none" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="737" y="410" font-size="12.5" font-weight="700" fill="#1a7f37" text-anchor="middle">세션키</text>
  <text x="737" y="432" font-size="10.5" fill="#57606a" text-anchor="middle">양쪽이 함께 갖는다</text>
  <text x="737" y="450" font-size="10.5" fill="#1f2328" text-anchor="middle">실제 대화를 <tspan font-weight="700">주고받는</tspan> 쪽</text>
  <text x="737" y="468" font-size="10" fill="#57606a" text-anchor="middle">오늘만 쓰는 임시 열쇠</text>
</svg>
