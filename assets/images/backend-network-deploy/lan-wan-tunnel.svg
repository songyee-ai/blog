<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="공유기 때문에 밖에서 내 컴퓨터로 못 들어오는 구조와, 터널이 방향을 뒤집어 연결하는 방식" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="n-block" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
    <marker id="n-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <!-- 상단 -->
  <text x="30" y="34" font-size="15" font-weight="700" fill="#cf222e">왜 친구는 내 localhost를 못 여는가</text>

  <rect x="30" y="52" width="330" height="180" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="46" y="75" font-size="12.5" font-weight="700" fill="#0969da">우리 집 = 내부망 (LAN)</text>

  <rect x="52" y="90" width="286" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="195" y="114" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">내 노트북</text>
  <text x="195" y="134" font-size="10.5" font-family="Consolas,monospace" fill="#57606a" text-anchor="middle">192.168.0.5 : 3000</text>
  <text x="195" y="152" font-size="10" fill="#57606a" text-anchor="middle">집 안에서만 통하는 주소</text>

  <text x="195" y="188" font-size="10.5" fill="#57606a" text-anchor="middle">localhost = "지금 이 컴퓨터"라는 뜻이라,</text>
  <text x="195" y="206" font-size="10.5" fill="#57606a" text-anchor="middle">친구가 열면 <tspan font-weight="700">친구 자기 컴퓨터</tspan>를 찾는다</text>

  <!-- 공유기 -->
  <rect x="392" y="112" width="116" height="72" rx="8" fill="#fff8c5" stroke="#bc4c00" stroke-width="2"/>
  <text x="450" y="140" font-size="12" font-weight="700" fill="#bc4c00" text-anchor="middle">공유기</text>
  <text x="450" y="160" font-size="10" fill="#57606a" text-anchor="middle">NAT</text>
  <text x="450" y="176" font-size="10" fill="#57606a" text-anchor="middle">문지기</text>

  <!-- 바깥 -->
  <rect x="540" y="52" width="330" height="180" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="556" y="75" font-size="12.5" font-weight="700" fill="#57606a">바깥 인터넷 = 외부망 (WAN)</text>

  <rect x="562" y="90" width="286" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="122" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">친구</text>
  <text x="705" y="144" font-size="10.5" fill="#57606a" text-anchor="middle">밖에서 볼 때 우리 집은</text>
  <text x="705" y="160" font-size="10.5" fill="#57606a" text-anchor="middle">공유기 하나로만 보인다</text>

  <!-- 화살표: 안→밖 허용 -->
  <line x1="344" y1="126" x2="386" y2="126" stroke="#1a7f37" stroke-width="2" marker-end="url(#n-ok)"/>
  <line x1="514" y1="126" x2="556" y2="126" stroke="#1a7f37" stroke-width="2" marker-end="url(#n-ok)"/>
  <text x="450" y="104" font-size="10" font-weight="700" fill="#1a7f37" text-anchor="middle">안에서 밖으로: 통과</text>

  <!-- 화살표: 밖→안 차단 -->
  <line x1="556" y1="212" x2="514" y2="212" stroke="#cf222e" stroke-width="2" marker-end="url(#n-block)"/>
  <line x1="386" y1="212" x2="360" y2="212" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="450" y="228" font-size="10.5" font-weight="700" fill="#cf222e" text-anchor="middle">밖에서 안으로: 막힘</text>
  <text x="373" y="205" font-size="18" font-weight="700" fill="#cf222e" text-anchor="middle">✕</text>

  <line x1="30" y1="256" x2="870" y2="256" stroke="#d0d7de"/>

  <!-- 하단: 터널 -->
  <text x="30" y="292" font-size="15" font-weight="700" fill="#1a7f37">터널 — 방향을 뒤집는다</text>
  <text x="30" y="313" font-size="11.5" fill="#57606a">밖에서 들어오게 문을 여는 대신, 내 컴퓨터가 <tspan font-weight="700">먼저 바깥으로</tspan> 연결을 맺는다.</text>

  <rect x="30" y="330" width="240" height="86" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="150" y="360" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">내 노트북</text>
  <text x="150" y="382" font-size="10.5" fill="#57606a" text-anchor="middle">서버가 여기서 돈다</text>
  <text x="150" y="400" font-size="10.5" fill="#57606a" text-anchor="middle">포트는 열지 않는다</text>

  <line x1="276" y1="373" x2="336" y2="373" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#n-ok)"/>
  <text x="306" y="364" font-size="10" font-weight="700" fill="#1a7f37" text-anchor="middle">먼저 연결</text>

  <rect x="342" y="330" width="240" height="86" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="462" y="360" font-size="12.5" font-weight="700" fill="#1a7f37" text-anchor="middle">터널 서비스</text>
  <text x="462" y="382" font-size="10.5" fill="#57606a" text-anchor="middle">Tailscale Funnel ·</text>
  <text x="462" y="400" font-size="10.5" fill="#57606a" text-anchor="middle">Cloudflare Tunnel · ngrok</text>

  <line x1="648" y1="373" x2="588" y2="373" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#n-ok)"/>
  <text x="618" y="364" font-size="10" font-weight="700" fill="#1a7f37" text-anchor="middle">접속</text>

  <rect x="654" y="330" width="216" height="86" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="762" y="360" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">친구</text>
  <text x="762" y="382" font-size="10.5" fill="#57606a" text-anchor="middle">공개된 주소로</text>
  <text x="762" y="400" font-size="10.5" fill="#57606a" text-anchor="middle">그냥 들어온다</text>

  <text x="30" y="450" font-size="12" fill="#1f2328">이미 뚫려 있는 통로(안에서 밖으로)를 <tspan font-weight="700">되짚어 들어오게</tspan> 하는 것이라, 문을 열지 않아도 된다.</text>
  <text x="30" y="472" font-size="12" fill="#57606a">단, 내 컴퓨터가 꺼지면 서비스도 함께 멈춘다. 상시 서비스라면 클라우드에 올리는 편이 낫다.</text>
</svg>
