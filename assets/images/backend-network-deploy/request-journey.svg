<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="주소를 입력한 뒤 화면이 뜨기까지의 다섯 단계와 택배 비유" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="j-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="14" font-weight="700" fill="#1f2328">엔터를 누른 뒤 1초 안에 벌어지는 일</text>
  <text x="540" y="34" font-size="14" font-weight="700" fill="#57606a">택배로 바꾸면</text>

  <!-- ① -->
  <rect x="30" y="52" width="470" height="62" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="46" y="76" font-size="12.5" font-weight="700" fill="#0969da">① 주소를 입력한다</text>
  <text x="46" y="98" font-size="11" fill="#57606a">mysite.com — 아직 이 이름이 어디 있는지 모른다</text>
  <rect x="540" y="52" width="330" height="62" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="705" y="89" font-size="11.5" fill="#57606a" text-anchor="middle">보낼 곳의 이름만 안다</text>
  <line x1="265" y1="118" x2="265" y2="130" stroke="#0969da" stroke-width="2" marker-end="url(#j-ar)"/>

  <!-- ② -->
  <rect x="30" y="134" width="470" height="62" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="46" y="158" font-size="12.5" font-weight="700" fill="#0969da">② DNS에 묻는다</text>
  <text x="46" y="180" font-size="11" fill="#57606a">"그 이름의 번호가 뭐예요?" → 142.250.x.x 를 받는다</text>
  <rect x="540" y="134" width="330" height="62" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="705" y="171" font-size="11.5" fill="#57606a" text-anchor="middle">배송지 주소를 검색한다</text>
  <line x1="265" y1="200" x2="265" y2="212" stroke="#0969da" stroke-width="2" marker-end="url(#j-ar)"/>

  <!-- ③ -->
  <rect x="30" y="216" width="470" height="62" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="46" y="240" font-size="12.5" font-weight="700" fill="#0969da">③ 그 번호의 서버에 연결한다</text>
  <text x="46" y="262" font-size="11" fill="#57606a">443번 문(포트)으로, HTTPS 자물쇠를 걸고</text>
  <rect x="540" y="216" width="330" height="62" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="705" y="253" font-size="11.5" fill="#57606a" text-anchor="middle">그 주소로 차량이 이동한다</text>
  <line x1="265" y1="282" x2="265" y2="294" stroke="#0969da" stroke-width="2" marker-end="url(#j-ar)"/>

  <!-- ④ -->
  <rect x="30" y="298" width="470" height="62" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="46" y="322" font-size="12.5" font-weight="700" fill="#1a7f37">④ HTTP로 요청하고 응답받는다</text>
  <text x="46" y="344" font-size="11" fill="#57606a">"이 페이지 줘" → 200 OK 와 함께 내용이 온다</text>
  <rect x="540" y="298" width="330" height="62" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="705" y="335" font-size="11.5" fill="#57606a" text-anchor="middle">물건을 요청하고 받아 온다</text>
  <line x1="265" y1="364" x2="265" y2="376" stroke="#0969da" stroke-width="2" marker-end="url(#j-ar)"/>

  <!-- ⑤ -->
  <rect x="30" y="380" width="470" height="62" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="46" y="404" font-size="12.5" font-weight="700" fill="#0969da">⑤ 브라우저가 화면으로 그린다</text>
  <text x="46" y="426" font-size="11" fill="#57606a">받은 것을 사람이 보는 모양으로 바꾼다</text>
  <rect x="540" y="380" width="330" height="62" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="705" y="417" font-size="11.5" fill="#57606a" text-anchor="middle">포장을 풀어 정리한다</text>

  <text x="30" y="468" font-size="12" fill="#1f2328">이 왕복이 페이지를 넘길 때마다 반복된다. 목업 데이터는 이 왕복 <tspan font-weight="700">없이</tspan> 화면 안에 미리 넣어 둔 것이었다.</text>
</svg>
