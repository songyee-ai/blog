<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="그루뽑기의 구조: 브라우저에서 Vercel의 API 라우트를 거쳐 Supabase로, 브라우저의 DB 직접 접근은 차단" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="g-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="g-block" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="14" font-weight="700" fill="#1f2328">그루뽑기 — 요청이 지나가는 길</text>

  <!-- 브라우저 -->
  <rect x="30" y="60" width="200" height="110" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="130" y="90" font-size="13" font-weight="700" fill="#0969da" text-anchor="middle">브라우저</text>
  <text x="130" y="114" font-size="10.5" fill="#57606a" text-anchor="middle">조원들이 링크로</text>
  <text x="130" y="131" font-size="10.5" fill="#57606a" text-anchor="middle">들어오는 곳</text>
  <text x="130" y="155" font-size="10" font-weight="700" fill="#cf222e" text-anchor="middle">비밀 키가 오지 않는다</text>

  <line x1="236" y1="115" x2="294" y2="115" stroke="#0969da" stroke-width="2" marker-end="url(#g-ar)"/>
  <text x="265" y="106" font-size="10" fill="#0969da" text-anchor="middle">요청</text>

  <!-- Vercel -->
  <rect x="300" y="52" width="300" height="126" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="316" y="74" font-size="12" font-weight="700" fill="#1f2328">Vercel (24시간 켜진 곳)</text>

  <rect x="316" y="86" width="128" height="76" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="110" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">화면</text>
  <text x="380" y="130" font-size="10" fill="#57606a" text-anchor="middle">Next.js</text>
  <text x="380" y="147" font-size="10" fill="#57606a" text-anchor="middle">front/</text>

  <rect x="456" y="86" width="128" height="76" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="520" y="110" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">API 라우트</text>
  <text x="520" y="130" font-size="10" fill="#57606a" text-anchor="middle">back/</text>
  <text x="520" y="147" font-size="10" font-weight="700" fill="#1a7f37" text-anchor="middle">비밀 키는 여기까지</text>

  <line x1="606" y1="115" x2="664" y2="115" stroke="#0969da" stroke-width="2" marker-end="url(#g-ar)"/>
  <text x="635" y="106" font-size="10" fill="#0969da" text-anchor="middle">조회·저장</text>

  <!-- Supabase -->
  <rect x="670" y="60" width="200" height="110" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <text x="770" y="90" font-size="13" font-weight="700" fill="#8250df" text-anchor="middle">Supabase</text>
  <text x="770" y="112" font-size="10.5" fill="#57606a" text-anchor="middle">Postgres 데이터베이스</text>
  <text x="770" y="132" font-size="10.5" fill="#57606a" text-anchor="middle">조 명단 · 배정 기록 ·</text>
  <text x="770" y="149" font-size="10.5" fill="#57606a" text-anchor="middle">타이머 상태</text>

  <!-- 직접 접근 차단 -->
  <path d="M130,180 L130,236 L770,236 L770,182" fill="none" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#g-block)"/>
  <text x="450" y="258" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="middle">브라우저가 DB에 직접 붙는 길은 막아 두었다 (RLS)</text>
  <text x="450" y="276" font-size="10.5" fill="#57606a" text-anchor="middle">키가 새더라도 브라우저 쪽에서는 아무것도 읽지 못한다</text>
  <text x="440" y="230" font-size="18" font-weight="700" fill="#cf222e" text-anchor="middle">✕</text>

  <line x1="30" y1="300" x2="870" y2="300" stroke="#d0d7de"/>

  <!-- 비밀값 세 겹 -->
  <text x="30" y="330" font-size="13" font-weight="700" fill="#1f2328">비밀값을 막는 세 겹</text>

  <rect x="30" y="346" width="266" height="88" rx="8" fill="none" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="163" y="370" font-size="11.5" font-weight="700" fill="#bc4c00" text-anchor="middle">1겹 · 이름 규칙</text>
  <text x="163" y="392" font-size="10.5" fill="#57606a" text-anchor="middle">NEXT_PUBLIC_ 을 붙이지 않는다</text>
  <text x="163" y="410" font-size="10" fill="#57606a" text-anchor="middle">붙이면 브라우저까지 딸려 나간다</text>
  <text x="163" y="427" font-size="10" fill="#57606a" text-anchor="middle">.env.local 은 깃에 올리지 않는다</text>

  <rect x="317" y="346" width="266" height="88" rx="8" fill="none" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="450" y="370" font-size="11.5" font-weight="700" fill="#bc4c00" text-anchor="middle">2겹 · 도구가 막는다</text>
  <text x="450" y="392" font-size="10.5" font-family="Consolas,monospace" fill="#57606a" text-anchor="middle">import 'server-only'</text>
  <text x="450" y="410" font-size="10" fill="#57606a" text-anchor="middle">화면 쪽에서 실수로 부르면</text>
  <text x="450" y="427" font-size="10" fill="#57606a" text-anchor="middle">빌드가 그 자리에서 실패한다</text>

  <rect x="604" y="346" width="266" height="88" rx="8" fill="none" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="737" y="370" font-size="11.5" font-weight="700" fill="#bc4c00" text-anchor="middle">3겹 · DB가 막는다</text>
  <text x="737" y="392" font-size="10.5" fill="#57606a" text-anchor="middle">모든 표에 RLS를 켜고</text>
  <text x="737" y="410" font-size="10" fill="#57606a" text-anchor="middle">브라우저 역할의 권한을 회수</text>
  <text x="737" y="427" font-size="10" fill="#57606a" text-anchor="middle">사람의 주의력에 기대지 않는다</text>
</svg>
