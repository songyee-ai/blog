<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="sx-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
    <marker id="sx-ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#57606a">권한은 문 앞에서, 샌드박스는 문 안에서</text>
  <text x="24" y="50" font-size="12" fill="#6e7781">25회차 노드 8의 "권한과 격리" 표를 풀어 그렸다. 두 칸은 서로 다른 때에 일한다.</text>

  <!-- 행동 -->
  <rect x="24" y="96" width="150" height="96" rx="12" fill="none" stroke="#6e7781"/>
  <text x="40" y="124" font-size="14" font-weight="700" fill="#57606a">에이전트가</text>
  <text x="40" y="146" font-size="14" font-weight="700" fill="#57606a">하려는 행동</text>
  <text x="40" y="174" font-size="12.5" fill="#6e7781">(셸 명령 하나)</text>

  <line x1="178" y1="144" x2="212" y2="144" stroke="#6e7781" stroke-width="2" marker-end="url(#sx-ah)"/>

  <!-- 권한 -->
  <rect x="216" y="76" width="196" height="136" rx="12" fill="#ddf4ff" stroke="#0969da"/>
  <text x="232" y="102" font-size="15" font-weight="700" fill="#0969da">권한</text>
  <text x="232" y="124" font-size="13" fill="#57606a">해도 되는지 정한다</text>
  <text x="232" y="146" font-size="13" fill="#57606a">실행하기 전에 판단</text>
  <text x="232" y="174" font-size="12.5" font-family="monospace" fill="#0969da">allow · ask · deny</text>
  <text x="232" y="198" font-size="12" fill="#6e7781">예: Claude Code 권한 규칙</text>

  <!-- 거부 -->
  <line x1="314" y1="216" x2="314" y2="262" stroke="#cf222e" stroke-width="2" marker-end="url(#sx-ahr)"/>
  <rect x="236" y="266" width="156" height="44" rx="10" fill="none" stroke="#cf222e"/>
  <text x="314" y="293" font-size="13" fill="#cf222e" text-anchor="middle">거부 → 실행 안 함</text>

  <!-- 허락 -->
  <line x1="416" y1="144" x2="452" y2="144" stroke="#6e7781" stroke-width="2" marker-end="url(#sx-ah)"/>
  <text x="434" y="134" font-size="12" fill="#6e7781" text-anchor="middle">허락</text>

  <!-- 샌드박스 울타리 -->
  <rect x="456" y="76" width="280" height="234" rx="12" fill="#dafbe1" fill-opacity="0.5" stroke="#1a7f37" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="472" y="102" font-size="15" font-weight="700" fill="#1a7f37">샌드박스 · 격리</text>
  <text x="472" y="124" font-size="13" fill="#57606a">허락된 실행이 어디까지 닿나</text>
  <rect x="472" y="140" width="248" height="54" rx="10" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="488" y="164" font-size="13" font-weight="700" fill="#bc4c00">실행 중인 명령</text>
  <text x="488" y="184" font-size="12" fill="#57606a">실수하거나 속아도 이 안에서</text>
  <rect x="472" y="208" width="248" height="44" rx="10" fill="none" stroke="#1a7f37"/>
  <text x="488" y="235" font-size="13" fill="#1a7f37">작업 폴더 — 닿는다</text>
  <text x="472" y="276" font-size="12" fill="#6e7781">예: Docker 컨테이너,</text>
  <text x="472" y="294" font-size="12" fill="#6e7781">Claude Code의 Bash 샌드박스</text>

  <!-- 바깥 -->
  <rect x="456" y="340" width="280" height="56" rx="10" fill="none" stroke="#cf222e"/>
  <text x="472" y="364" font-size="13" fill="#cf222e">울타리 밖 파일 · 네트워크</text>
  <text x="472" y="384" font-size="12" fill="#57606a">닿지 못하게 막는다</text>
  <line x1="596" y1="314" x2="596" y2="336" stroke="#cf222e" stroke-width="2" stroke-dasharray="3 3"/>
  <text x="608" y="330" font-size="12" fill="#cf222e">막힘</text>

  <!-- 아래 설명 -->
  <text x="24" y="356" font-size="13" fill="#57606a">권한을 촘촘히 해도, 허락한 명령의</text>
  <text x="24" y="376" font-size="13" fill="#57606a">실수까지 막지는 못한다.</text>
  <text x="24" y="404" font-size="13" fill="#57606a">울타리를 쳐도, 그 안에서 무엇을</text>
  <text x="24" y="424" font-size="13" fill="#57606a">해도 될지는 따로 정해야 한다.</text>
  <text x="24" y="454" font-size="13" font-weight="700" fill="#57606a">하나가 다른 하나를 대신하지 않는다.</text>
</svg>
