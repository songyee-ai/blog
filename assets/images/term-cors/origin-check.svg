<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="내 컴퓨터 안에서 github.io 주소로 열린 페이지가 localhost:11434의 Ollama를 부른다. 브라우저는 Ollama의 답에 이 출처를 허락한다는 표시가 있는지 확인하고, 있으면 페이지에 답을 넘기고 없으면 막는다. 허락 명단은 받는 쪽인 Ollama가 OLLAMA_ORIGINS로 정한다. 터미널의 node나 curl은 브라우저가 아니라 이 검사를 거치지 않는다">
  <defs>
    <marker id="cr-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
  </defs>

  <text x="20" y="28" font-size="16" font-weight="700" fill="#0969da">막는 건 브라우저, 허락하는 건 받는 쪽</text>

  <rect x="20" y="46" width="300" height="260" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="38" y="74" font-size="15" font-weight="700" fill="#0969da">브라우저 (경비가 있는 정문)</text>
  <rect x="38" y="90" width="264" height="74" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="54" y="114" font-size="13" fill="#57606a">페이지가 열린 주소 = 출처</text>
  <text x="54" y="140" font-size="13" font-family="monospace" font-weight="700" fill="#1f2328">https://YOUR_ID.github.io</text>
  <text x="38" y="210" font-size="13" fill="#1f2328">다른 출처로 보낸 요청의 답에</text>
  <text x="38" y="234" font-size="13" fill="#1f2328">"이 출처는 허락" 표시가 있는지</text>
  <text x="38" y="258" font-size="13" fill="#1f2328">확인한 뒤에야 페이지에 넘긴다</text>

  <rect x="440" y="46" width="300" height="260" rx="8" fill="#fff8c5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="458" y="74" font-size="15" font-weight="700" fill="#bc4c00">내 컴퓨터의 Ollama</text>
  <text x="458" y="100" font-size="13" font-family="monospace" fill="#1f2328">http://localhost:11434</text>
  <rect x="458" y="116" width="264" height="114" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="474" y="140" font-size="13" font-weight="700" fill="#1f2328">출입 명단 = OLLAMA_ORIGINS</text>
  <text x="474" y="164" font-size="13" fill="#57606a">기본: localhost 같은 내 주소</text>
  <text x="474" y="188" font-size="13" font-family="monospace" fill="#1a7f37">+ https://YOUR_ID.github.io</text>
  <text x="474" y="212" font-size="13" fill="#57606a">(직접 더해야 들어간다)</text>
  <text x="458" y="262" font-size="13" fill="#1f2328">명단에 있으면 답에 허락 표시를</text>
  <text x="458" y="284" font-size="13" fill="#1f2328">붙여 돌려주고, 없으면 403으로 거절한다</text>

  <line x1="324" y1="130" x2="436" y2="130" stroke="#8c959f" stroke-width="1.5" marker-end="url(#cr-ar)"/>
  <text x="380" y="120" font-size="13" fill="#57606a" text-anchor="middle">① 요청</text>
  <line x1="436" y1="214" x2="324" y2="214" stroke="#8c959f" stroke-width="1.5" marker-end="url(#cr-ar)"/>
  <text x="380" y="204" font-size="13" fill="#57606a" text-anchor="middle">② 답 + 표시</text>

  <rect x="20" y="326" width="352" height="78" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="38" y="354" font-size="14" font-weight="700" fill="#1a7f37">표시가 있다</text>
  <text x="38" y="380" font-size="13" fill="#1f2328">브라우저가 답을 페이지에 넘긴다</text>

  <rect x="388" y="326" width="352" height="78" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="406" y="354" font-size="14" font-weight="700" fill="#cf222e">표시가 없다</text>
  <text x="406" y="380" font-size="13" fill="#1f2328">브라우저가 막는다 (콘솔에 CORS 오류)</text>

  <rect x="20" y="420" width="720" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="38" y="446" font-size="13" font-weight="700" fill="#1f2328">터미널의 node · curl은 브라우저가 아니다</text>
  <text x="38" y="468" font-size="13" fill="#57606a">정문 경비를 지나지 않으니 이 검사도 없다. 23회차 작업물은 이쪽으로 Ollama를 불렀다.</text>
</svg>
