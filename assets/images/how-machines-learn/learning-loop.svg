<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">학습은 세 박자의 반복이다</text>
  <text x="24" y="50" font-size="12" fill="#57606a">규칙을 사람이 적는 대신, 틀린 만큼 내부 숫자를 조금씩 미는 일.</text>

  <rect x="24" y="68" width="440" height="228" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>

  <rect x="40" y="120" width="90" height="56" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="85" y="145" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">데이터</text>
  <text x="85" y="162" font-size="10.5" fill="#57606a" text-anchor="middle">정답 붙은 예시</text>

  <line x1="134" y1="148" x2="142" y2="148" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="148,148 138,143 138,153" fill="#57606a"/>

  <rect x="150" y="120" width="90" height="56" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="195" y="145" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">예측</text>
  <text x="195" y="162" font-size="10.5" fill="#57606a" text-anchor="middle">답을 내본다</text>

  <line x1="244" y1="148" x2="252" y2="148" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="258,148 248,143 248,153" fill="#57606a"/>

  <rect x="260" y="120" width="90" height="56" rx="8" fill="#ffe3e3" stroke="#cf222e"/>
  <text x="305" y="145" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="middle">오차</text>
  <text x="305" y="162" font-size="10.5" fill="#57606a" text-anchor="middle">얼마나 틀렸나</text>

  <line x1="354" y1="148" x2="362" y2="148" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="368,148 358,143 358,153" fill="#57606a"/>

  <rect x="370" y="120" width="90" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="415" y="145" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">조정</text>
  <text x="415" y="162" font-size="10.5" fill="#57606a" text-anchor="middle">숫자를 민다</text>

  <path d="M415 176 L415 216 L195 216 L195 186" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="195,178 190,188 200,188" fill="#57606a"/>
  <text x="305" y="236" font-size="11.5" fill="#57606a" text-anchor="middle">수없이 반복</text>

  <text x="40" y="272" font-size="11.5" fill="#1f2328">학습이 끝나고 남는 것은 규칙집이 아니라</text>
  <text x="40" y="288" font-size="11.5" font-weight="700" fill="#1f2328">조정을 마친 숫자들(가중치)뿐이다.</text>

  <rect x="480" y="68" width="256" height="228" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="496" y="92" font-size="11.5" font-weight="700" fill="#1f2328">오차를 언덕으로 보면</text>

  <line x1="508" y1="108" x2="508" y2="252" stroke="#57606a" stroke-width="1.5"/>
  <line x1="508" y1="252" x2="716" y2="252" stroke="#57606a" stroke-width="1.5"/>
  <text x="496" y="120" font-size="10.5" fill="#57606a" text-anchor="end">오차</text>
  <text x="716" y="270" font-size="10.5" fill="#57606a" text-anchor="end">가중치</text>

  <path d="M524 120 C552 182 586 222 626 234 C664 226 696 194 710 158" fill="none" stroke="#0969da" stroke-width="2.5"/>

  <circle cx="524" cy="120" r="5" fill="#cf222e"/>
  <text x="534" y="116" font-size="10.5" fill="#cf222e">시작</text>
  <circle cx="546" cy="162" r="4" fill="#57606a"/>
  <circle cx="570" cy="196" r="4" fill="#57606a"/>
  <circle cx="597" cy="220" r="4" fill="#57606a"/>
  <circle cx="626" cy="234" r="6" fill="#1a7f37"/>
  <text x="640" y="246" font-size="10.5" fill="#1a7f37">최소</text>

  <text x="496" y="286" font-size="11" fill="#57606a">낮은 쪽으로 한 걸음씩 — 경사하강</text>
</svg>
