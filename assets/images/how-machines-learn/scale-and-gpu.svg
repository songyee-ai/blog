<svg viewBox="0 0 760 396" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">왜 내 노트북으론 벅찬가</text>
  <text x="24" y="50" font-size="12" fill="#57606a">학습되는 숫자의 개수가 문제마다 하늘과 땅 차이다.</text>

  <text x="40" y="82" font-size="11" font-weight="700" fill="#57606a">무엇을 학습하나</text>
  <text x="330" y="82" font-size="11" font-weight="700" fill="#57606a">학습되는 숫자</text>
  <text x="560" y="82" font-size="11" font-weight="700" fill="#57606a">어디서 도나</text>
  <line x1="24" y1="92" x2="736" y2="92" stroke="#d0d7de"/>

  <rect x="24" y="100" width="712" height="30" rx="5" fill="#dafbe1"/>
  <text x="40" y="120" font-size="11.5" fill="#1f2328">카페 선형모델</text>
  <text x="330" y="120" font-size="11.5" font-weight="700" fill="#1a7f37">2개</text>
  <text x="560" y="120" font-size="11.5" fill="#57606a">노트북에서 즉시</text>

  <rect x="24" y="136" width="712" height="30" rx="5" fill="#ddf4ff"/>
  <text x="40" y="156" font-size="11.5" fill="#1f2328">손글씨 숫자 분류기</text>
  <text x="330" y="156" font-size="11.5" font-weight="700" fill="#0969da">수만 ~ 수십만</text>
  <text x="560" y="156" font-size="11.5" fill="#57606a">노트북 CPU로 몇 분</text>

  <rect x="24" y="172" width="712" height="30" rx="5" fill="#fff8c5"/>
  <text x="40" y="192" font-size="11.5" fill="#1f2328">사진 분류 파인튜닝</text>
  <text x="330" y="192" font-size="11.5" font-weight="700" fill="#bc4c00">약 1,100만</text>
  <text x="560" y="192" font-size="11.5" fill="#57606a">GPU 권장</text>

  <rect x="24" y="208" width="712" height="30" rx="5" fill="#ffe3e3"/>
  <text x="40" y="228" font-size="11.5" fill="#1f2328">대형 언어모델</text>
  <text x="330" y="228" font-size="11.5" font-weight="700" fill="#cf222e">수십억 ~ 수천억</text>
  <text x="560" y="228" font-size="11.5" fill="#57606a">GPU 수백~수천 대</text>

  <text x="24" y="270" font-size="12" fill="#57606a">계산의 대부분이 거대한 행렬 곱셈이고, 그 안의 곱셈들은 서로 독립이라 순서 없이 한꺼번에 해도 된다.</text>

  <rect x="24" y="286" width="344" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="310" font-size="12.5" font-weight="700" fill="#1f2328">CPU</text>
  <text x="44" y="328" font-size="11" fill="#57606a">큰 코어 몇 개 · 순서대로</text>
  <rect x="44" y="340" width="30" height="24" rx="4" fill="#57606a"/>
  <rect x="80" y="340" width="30" height="24" rx="4" fill="#57606a"/>
  <rect x="116" y="340" width="30" height="24" rx="4" fill="#57606a"/>
  <rect x="152" y="340" width="30" height="24" rx="4" fill="#57606a"/>

  <rect x="392" y="286" width="344" height="92" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="412" y="310" font-size="12.5" font-weight="700" fill="#0969da">GPU</text>
  <text x="412" y="328" font-size="11" fill="#57606a">작은 코어 수천 개 · 한꺼번에</text>
  <g fill="#0969da">
    <rect x="412" y="338" width="8" height="8" rx="1.5"/><rect x="424" y="338" width="8" height="8" rx="1.5"/><rect x="436" y="338" width="8" height="8" rx="1.5"/><rect x="448" y="338" width="8" height="8" rx="1.5"/><rect x="460" y="338" width="8" height="8" rx="1.5"/><rect x="472" y="338" width="8" height="8" rx="1.5"/><rect x="484" y="338" width="8" height="8" rx="1.5"/><rect x="496" y="338" width="8" height="8" rx="1.5"/><rect x="508" y="338" width="8" height="8" rx="1.5"/><rect x="520" y="338" width="8" height="8" rx="1.5"/><rect x="532" y="338" width="8" height="8" rx="1.5"/><rect x="544" y="338" width="8" height="8" rx="1.5"/>
    <rect x="412" y="350" width="8" height="8" rx="1.5"/><rect x="424" y="350" width="8" height="8" rx="1.5"/><rect x="436" y="350" width="8" height="8" rx="1.5"/><rect x="448" y="350" width="8" height="8" rx="1.5"/><rect x="460" y="350" width="8" height="8" rx="1.5"/><rect x="472" y="350" width="8" height="8" rx="1.5"/><rect x="484" y="350" width="8" height="8" rx="1.5"/><rect x="496" y="350" width="8" height="8" rx="1.5"/><rect x="508" y="350" width="8" height="8" rx="1.5"/><rect x="520" y="350" width="8" height="8" rx="1.5"/><rect x="532" y="350" width="8" height="8" rx="1.5"/><rect x="544" y="350" width="8" height="8" rx="1.5"/>
    <rect x="412" y="362" width="8" height="8" rx="1.5"/><rect x="424" y="362" width="8" height="8" rx="1.5"/><rect x="436" y="362" width="8" height="8" rx="1.5"/><rect x="448" y="362" width="8" height="8" rx="1.5"/><rect x="460" y="362" width="8" height="8" rx="1.5"/><rect x="472" y="362" width="8" height="8" rx="1.5"/><rect x="484" y="362" width="8" height="8" rx="1.5"/><rect x="496" y="362" width="8" height="8" rx="1.5"/><rect x="508" y="362" width="8" height="8" rx="1.5"/><rect x="520" y="362" width="8" height="8" rx="1.5"/><rect x="532" y="362" width="8" height="8" rx="1.5"/><rect x="544" y="362" width="8" height="8" rx="1.5"/>
  </g>
  <text x="566" y="358" font-size="11" fill="#57606a">그래서 코랩에서</text>
  <text x="566" y="374" font-size="11" fill="#57606a">GPU를 빌려 쓴다</text>
</svg>
