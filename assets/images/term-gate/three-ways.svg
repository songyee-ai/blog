<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="게이트는 들어온 요청을 통과, 차단, 우회 세 갈래로 나눈다">
  <defs>
    <marker id="gt-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
    <marker id="gt-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/></marker>
    <marker id="gt-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
    <marker id="gt-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>

  <text x="30" y="30" font-size="15" font-weight="700" fill="#1f2328">게이트가 나누는 세 갈래</text>
  <text x="30" y="50" font-size="10.5" fill="#57606a">판단 기준은 하나 — 실수했을 때 되돌릴 수 있는가</text>

  <rect x="30" y="140" width="130" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="95" y="167" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">에이전트의</text>
  <text x="95" y="187" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">다음 행동</text>
  <line x1="160" y1="171" x2="204" y2="171" stroke="#57606a" stroke-width="2" marker-end="url(#gt-n)"/>

  <rect x="206" y="126" width="132" height="90" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="272" y="156" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">게이트</text>
  <text x="272" y="178" font-size="10" fill="#57606a" text-anchor="middle">되돌릴 수 있나?</text>
  <text x="272" y="196" font-size="10" fill="#57606a" text-anchor="middle">확신은 충분한가?</text>

  <path d="M338 150 L382 86" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#gt-g)"/>
  <rect x="386" y="60" width="484" height="56" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="406" y="84" font-size="12" font-weight="700" fill="#1a7f37">통과</text>
  <text x="470" y="84" font-size="11" fill="#1f2328">되돌릴 수 있는 일은 묻지 않고 그냥 실행</text>
  <text x="406" y="104" font-size="10.5" fill="#57606a">파일 읽기 · 검색하기 — 부작용이 없다</text>

  <line x1="338" y1="171" x2="382" y2="171" stroke="#cf222e" stroke-width="2" marker-end="url(#gt-r)"/>
  <rect x="386" y="143" width="484" height="56" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="406" y="167" font-size="12" font-weight="700" fill="#cf222e">차단</text>
  <text x="470" y="167" font-size="11" fill="#1f2328">막고, 막았다는 사실을 모델에게 알려준다</text>
  <text x="406" y="187" font-size="10.5" fill="#57606a">조용히 넘기면 모델은 성공한 줄 알고 계속 간다</text>

  <path d="M338 192 L382 256" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#gt-o)"/>
  <rect x="386" y="226" width="484" height="56" rx="8" fill="#fff8c5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="406" y="250" font-size="12" font-weight="700" fill="#bc4c00">우회</text>
  <text x="470" y="250" font-size="11" fill="#1f2328">다른 길로 돌린다 — 가장 자주 잊는 갈래</text>
  <text x="406" y="270" font-size="10.5" fill="#57606a">확신이 낮으면 더 찾아보게, 위험하면 사람에게</text>

  <text x="30" y="312" font-size="10.5" fill="#57606a">문이 너무 잦으면 사람이 내용을 안 읽고 승인하게 된다. 되돌릴 수 없는 것에만 세운다.</text>
</svg>
