<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="dc-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
  </defs>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#57606a">시험 문제가 미리 공부 자료에 섞이면</text>
  <text x="24" y="50" font-size="13" fill="#6e7781">공개 벤치마크(예: SWE-bench)에서 생길 수 있는 일을 단순하게 그렸다</text>

  <text x="24" y="78" font-size="14" font-weight="700" fill="#0969da">시험 전 — 학습</text>
  <!-- row1 -->
  <rect x="24" y="90" width="212" height="96" rx="12" fill="#ddf4ff" stroke="#0969da"/>
  <text x="40" y="116" font-size="14" font-weight="700" fill="#0969da">① 문제와 정답 공개</text>
  <text x="40" y="140" font-size="13" fill="#57606a">GitHub 이슈와</text>
  <text x="40" y="160" font-size="13" fill="#57606a">실제로 들어간 수정</text>
  <line x1="240" y1="138" x2="270" y2="138" stroke="#6e7781" stroke-width="2" marker-end="url(#dc-ah)"/>
  <rect x="274" y="90" width="212" height="96" rx="12" fill="#ddf4ff" stroke="#0969da"/>
  <text x="290" y="116" font-size="14" font-weight="700" fill="#0969da">② 학습 데이터에 섞임</text>
  <text x="290" y="140" font-size="13" fill="#57606a">인터넷 글을 모을 때</text>
  <text x="290" y="160" font-size="13" fill="#57606a">함께 들어갈 수 있다</text>
  <line x1="490" y1="138" x2="520" y2="138" stroke="#6e7781" stroke-width="2" marker-end="url(#dc-ah)"/>
  <rect x="524" y="90" width="212" height="96" rx="12" fill="#ddf4ff" stroke="#0969da"/>
  <text x="540" y="116" font-size="14" font-weight="700" fill="#0969da">③ 모델이 학습</text>
  <text x="540" y="140" font-size="13" fill="#57606a">문제와 답의 모양이</text>
  <text x="540" y="160" font-size="13" fill="#57606a">어딘가에 남을 수 있다</text>

  <!-- 같은 문제 점선 -->
  <line x1="130" y1="190" x2="130" y2="254" stroke="#bc4c00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#dc-ah)"/>
  <text x="142" y="226" font-size="13" font-weight="700" fill="#bc4c00">같은 문제</text>

  <text x="274" y="244" font-size="14" font-weight="700" fill="#1a7f37">시험 때 — 평가</text>
  <!-- row2 -->
  <rect x="24" y="258" width="212" height="96" rx="12" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="40" y="284" font-size="14" font-weight="700" fill="#1a7f37">④ 그 문제를 낸다</text>
  <text x="40" y="308" font-size="13" fill="#57606a">벤치마크 문제는</text>
  <text x="40" y="328" font-size="13" fill="#57606a">누구나 볼 수 있다</text>
  <line x1="240" y1="306" x2="270" y2="306" stroke="#6e7781" stroke-width="2" marker-end="url(#dc-ah)"/>
  <rect x="274" y="258" width="212" height="96" rx="12" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="290" y="284" font-size="14" font-weight="700" fill="#1a7f37">⑤ 맞혔다</text>
  <text x="290" y="308" font-size="13" fill="#57606a">실제 정답과 같은</text>
  <text x="290" y="328" font-size="13" fill="#57606a">모양의 수정이 나온다</text>
  <line x1="490" y1="306" x2="520" y2="306" stroke="#6e7781" stroke-width="2" marker-end="url(#dc-ah)"/>
  <rect x="524" y="258" width="212" height="96" rx="12" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="540" y="284" font-size="14" font-weight="700" fill="#bc4c00">⑥ 그런데 왜 맞혔나?</text>
  <text x="540" y="308" font-size="13" fill="#57606a">풀어서? 기억해서?</text>
  <text x="540" y="328" font-size="13" fill="#57606a">점수로는 가를 수 없다</text>

  <!-- 아래 설명 -->
  <line x1="24" y1="380" x2="736" y2="380" stroke="#d0d7de"/>
  <text x="24" y="406" font-size="13" fill="#57606a">26회차 실습: 24152·24213 수정이 세 방식 모두 같았고, 아는 한 실제 SymPy 수정과도 같은 모양이었다.</text>
  <text x="24" y="428" font-size="13" fill="#57606a">그래서 ①~③이 일어났을 가능성을 배제할 수 없다고 적었다. 일어났다는 뜻은 아니다.</text>
  <text x="24" y="450" font-size="13" fill="#6e7781">확인하려면 학습 데이터를 봐야 하는데, 보통 밖에서는 볼 수 없다.</text>
</svg>
