<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
  </defs>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#57606a">ReAct 한 판 — 누가 어느 줄을 쓰나</text>
  <text x="24" y="50" font-size="12" fill="#6e7781">파란 줄은 모델이 쓰고, 초록 줄은 프로그램이 도구를 실제로 돌린 뒤 붙여 넣는다.</text>

  <!-- 범례 -->
  <rect x="470" y="62" width="14" height="14" rx="3" fill="#ddf4ff" stroke="#0969da"/>
  <text x="490" y="74" font-size="12" fill="#57606a">모델이 쓴다</text>
  <rect x="580" y="62" width="14" height="14" rx="3" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="600" y="74" font-size="12" fill="#57606a">프로그램이 붙인다</text>

  <!-- 질문 -->
  <rect x="24" y="88" width="560" height="38" rx="8" fill="none" stroke="#8c959f"/>
  <text x="40" y="112" font-size="13" fill="#57606a">질문: 내일 서울로 소풍 가는데 우산 챙길까?</text>

  <!-- Thought 1 -->
  <rect x="24" y="136" width="560" height="38" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="40" y="160" font-size="13" fill="#0969da"><tspan font-weight="700">Thought 1:</tspan> 내일 날씨를 모른다. 찾아봐야 한다.</text>
  <!-- Action 1 -->
  <rect x="24" y="184" width="560" height="38" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="40" y="208" font-size="13" fill="#0969da"><tspan font-weight="700">Action 1:</tspan> 날씨[서울, 내일]</text>

  <!-- 끊는 선 -->
  <line x1="24" y1="236" x2="584" y2="236" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="254" font-size="12" fill="#cf222e">여기서 프로그램이 모델의 글쓰기를 멈추고, Action 줄을 읽어 날씨 도구를 돌린다</text>

  <!-- Observation 1 -->
  <rect x="24" y="266" width="560" height="38" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="40" y="290" font-size="13" fill="#1a7f37"><tspan font-weight="700">Observation 1:</tspan> 오후 강수확률 70%</text>
  <!-- Thought 2 -->
  <rect x="24" y="314" width="560" height="38" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="40" y="338" font-size="13" fill="#0969da"><tspan font-weight="700">Thought 2:</tspan> 오후에 비가 올 가능성이 높다.</text>
  <!-- Action 2 -->
  <rect x="24" y="362" width="560" height="38" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="40" y="386" font-size="13" fill="#0969da"><tspan font-weight="700">Action 2:</tspan> 끝[우산을 챙기는 게 좋겠다]</text>

  <!-- 되돌이 화살표 -->
  <path d="M592,285 C690,285 690,155 592,155" fill="none" stroke="#6e7781" stroke-width="2" marker-end="url(#ah)"/>
  <text x="676" y="206" font-size="12" fill="#6e7781">답이 나올</text>
  <text x="676" y="224" font-size="12" fill="#6e7781">때까지</text>
  <text x="676" y="242" font-size="12" fill="#6e7781">되풀이</text>

  <text x="24" y="430" font-size="12" fill="#57606a">"Action 1: 이름[인자]" 같은 줄 모양은 프롬프트로 정한 약속일 뿐이다.</text>
  <text x="24" y="450" font-size="12" fill="#57606a">모델이 모양을 조금만 바꿔 써도 프로그램은 그 줄을 읽지 못한다.</text>
</svg>
