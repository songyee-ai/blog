<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">Stop 훅 실험 — 기준선에서도 0건이라 판정 불가</text>
  <text x="24" y="50" font-size="12" fill="#57606a">같은 깃 작업 요청 10개 × 조건마다 3번, 끔·켬 번갈아</text>

  <g font-size="12">
    <rect x="24" y="68" width="346" height="92" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="40" y="92" font-size="14" font-weight="700" fill="#1f2328">훅 끔</text>
    <text x="40" y="116" fill="#1f2328">답 30개 · 처음 답 영어 0 · 최종 답 영어 0</text>
    <text x="40" y="138" fill="#57606a">도구 호출 137 · 18분 9초</text>

    <rect x="390" y="68" width="346" height="92" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="406" y="92" font-size="14" font-weight="700" fill="#0969da">훅 켬</text>
    <text x="406" y="116" fill="#1f2328">답 30개 · 처음 답 영어 0 · 최종 답 영어 0</text>
    <text x="406" y="138" fill="#57606a">도구 호출 127 · 18분 29초 · 되돌려 보냄 0</text>

    <text x="24" y="192" font-size="14" font-weight="700" fill="#1f2328">왜 재현되지 않았나 — 누적 도구 호출 수</text>
    <text x="24" y="222" fill="#1f2328">실제로 샌 세션</text>
    <rect x="150" y="208" width="172" height="20" rx="3" fill="#ffebe9" stroke="#cf222e"/>
    <rect x="322" y="208" width="333" height="20" rx="3" fill="#cf222e" fill-opacity="0.75"/>
    <text x="664" y="222" fill="#cf222e" font-weight="700">143~421번</text>
    <text x="24" y="256" fill="#1f2328">이번 시도</text>
    <rect x="150" y="242" width="59" height="20" rx="3" fill="#0969da" fill-opacity="0.75"/>
    <text x="217" y="256" fill="#0969da" font-weight="700">40~49번</text>
    <text x="150" y="282" fill="#57606a">(막대 길이는 호출 수에 비례. 이번 시도는 명령을 &amp;&amp;로 이어 붙여 호출 수가 적었다)</text>

    <rect x="24" y="304" width="712" height="110" rx="10" fill="#fff8c5" stroke="#9a6700"/>
    <text x="40" y="328" font-size="14" font-weight="700" fill="#9a6700">그래도 보인 것 — 도구 사이 영어 한 줄</text>
    <text x="40" y="352" fill="#1f2328">훅을 켠 시도 두 번에서 진행 문장 한 줄이 영어로 나왔다. 훅은 영어 줄 2줄 이상부터 막아 통과시켰다.</text>
    <text x="40" y="376" fill="#1f2328">훅은 답을 마칠 때 검사하므로, 그 한 줄은 이미 화면에 나간 뒤다.</text>
    <text x="40" y="400" fill="#57606a">→ 답한 뒤 검사는 새는 것을 막는 장치가 아니라, 나중에 바로잡는 장치</text>
  </g>
</svg>
