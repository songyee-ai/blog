<svg viewBox="0 0 760 470" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">하네스의 일곱 칸 — 선수(모델) 주변에서 경기를 바꾸는 것들</text>
  <text x="24" y="50" font-size="12" fill="#57606a">파란 칸은 모델이 일하는 방식, 주황 칸은 지키는 장치, 초록 칸은 확인하는 장치</text>

  <g font-size="12">
    <rect x="24" y="70" width="230" height="78" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="40" y="94" font-size="14" font-weight="700" fill="#0969da">행동 포맷</text>
    <text x="40" y="116" fill="#1f2328">고칠 곳·내용을 정해진 모양으로</text>
    <text x="40" y="134" fill="#57606a">축구로 치면: 작전판</text>

    <rect x="265" y="70" width="230" height="78" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="281" y="94" font-size="14" font-weight="700" fill="#0969da">컨텍스트 관리</text>
    <text x="281" y="116" fill="#1f2328">무엇을 남기고 무엇을 줄일지</text>
    <text x="281" y="134" fill="#57606a">벤치의 메모판</text>

    <rect x="506" y="70" width="230" height="78" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="522" y="94" font-size="14" font-weight="700" fill="#0969da">경험·스킬 축적</text>
    <text x="522" y="116" fill="#1f2328">해결한 일을 다음에 다시 쓰기</text>
    <text x="522" y="134" fill="#57606a">지난 경기 영상</text>

    <rect x="24" y="160" width="230" height="78" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="40" y="184" font-size="14" font-weight="700" fill="#0969da">성찰</text>
    <text x="40" y="206" fill="#1f2328">실패에서 바꿀 행동 하나 남기기</text>
    <text x="40" y="224" fill="#57606a">하프타임 작전 회의</text>

    <rect x="265" y="160" width="230" height="78" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="281" y="184" font-size="14" font-weight="700" fill="#0969da">미니멀</text>
    <text x="281" y="206" fill="#1f2328">필요한 구성만 남기기</text>
    <text x="281" y="224" fill="#57606a">꼭 필요한 선수만 내보내기</text>

    <rect x="506" y="160" width="230" height="78" rx="10" fill="#fff1e5" stroke="#bc4c00"/>
    <text x="522" y="184" font-size="14" font-weight="700" fill="#bc4c00">권한·보안</text>
    <text x="522" y="206" fill="#1f2328">읽기·고치기·실행의 허용 범위</text>
    <text x="522" y="224" fill="#57606a">심판과 경기장 울타리</text>

    <rect x="24" y="250" width="712" height="62" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="40" y="274" font-size="14" font-weight="700" fill="#1a7f37">평가 루프</text>
    <text x="40" y="296" fill="#1f2328">결과가 맞았는지, 그 과정은 적절했는지를 나눠 확인</text>
    <text x="520" y="296" fill="#57606a">점수판과 경기 기록지</text>

    <rect x="24" y="330" width="712" height="122" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="5 4"/>
    <text x="40" y="354" font-size="14" font-weight="700" fill="#1f2328">막혔을 때 묻는 세 질문 (기능 지도를 쓰는 순서)</text>
    <text x="40" y="380" fill="#1f2328">① 어디서 막히나 — 행동이 애매한가, 기록이 넘치나, 같은 실수를 반복하나, 승인이 잦은가, 증명이 어려운가</text>
    <text x="40" y="404" fill="#1f2328">② 그 병목을 줄일 칸은 무엇인가</text>
    <text x="40" y="428" fill="#1f2328">③ 그 칸이 실제로 일했다는 기록은 어디에 남나</text>
  </g>
</svg>
