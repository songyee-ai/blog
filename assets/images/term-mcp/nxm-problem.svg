<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="MCP 이전에는 AI 3개와 서비스 4개를 잇는 연결을 12개 만들어야 했지만, MCP라는 공통 규격이 생기면서 7개로 줄어든다">
  <text x="30" y="28" font-size="14" font-weight="700" fill="#cf222e">MCP 이전 — 만들 연결 12개</text>
  <text x="470" y="28" font-size="14" font-weight="700" fill="#1a7f37">MCP 이후 — 만들 연결 7개</text>
  <text x="30" y="48" font-size="10.5" fill="#57606a">AI 3개 × 서비스 4개 = 3 × 4</text>
  <text x="470" y="48" font-size="10.5" fill="#57606a">AI 3개 + 서비스 4개 = 3 + 4</text>

  <g stroke="#cf222e" stroke-width="1" opacity="0.55">
    <line x1="128" y1="135" x2="300" y2="115"/><line x1="128" y1="135" x2="300" y2="165"/>
    <line x1="128" y1="135" x2="300" y2="215"/><line x1="128" y1="135" x2="300" y2="265"/>
    <line x1="128" y1="190" x2="300" y2="115"/><line x1="128" y1="190" x2="300" y2="165"/>
    <line x1="128" y1="190" x2="300" y2="215"/><line x1="128" y1="190" x2="300" y2="265"/>
    <line x1="128" y1="245" x2="300" y2="115"/><line x1="128" y1="245" x2="300" y2="165"/>
    <line x1="128" y1="245" x2="300" y2="215"/><line x1="128" y1="245" x2="300" y2="265"/>
  </g>

  <rect x="50" y="120" width="78" height="30" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="89" y="140" font-size="11" fill="#1f2328" text-anchor="middle">AI ①</text>
  <rect x="50" y="175" width="78" height="30" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="89" y="195" font-size="11" fill="#1f2328" text-anchor="middle">AI ②</text>
  <rect x="50" y="230" width="78" height="30" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="89" y="250" font-size="11" fill="#1f2328" text-anchor="middle">AI ③</text>

  <rect x="300" y="100" width="86" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="343" y="120" font-size="10.5" fill="#1f2328" text-anchor="middle">드라이브</text>
  <rect x="300" y="150" width="86" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="343" y="170" font-size="10.5" fill="#1f2328" text-anchor="middle">슬랙</text>
  <rect x="300" y="200" width="86" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="343" y="220" font-size="10.5" fill="#1f2328" text-anchor="middle">노션</text>
  <rect x="300" y="250" width="86" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="343" y="270" font-size="10.5" fill="#1f2328" text-anchor="middle">깃허브</text>

  <text x="218" y="312" font-size="11" fill="#cf222e" text-anchor="middle">AI가 늘어도, 서비스가 늘어도 곱하기로 늘어난다</text>

  <line x1="428" y1="60" x2="428" y2="300" stroke="#d0d7de" stroke-width="1" stroke-dasharray="5 4"/>

  <g stroke="#1a7f37" stroke-width="1.6">
    <line x1="568" y1="135" x2="640" y2="185"/>
    <line x1="568" y1="190" x2="640" y2="200"/>
    <line x1="568" y1="245" x2="640" y2="215"/>
    <line x1="720" y1="185" x2="790" y2="115"/>
    <line x1="720" y1="195" x2="790" y2="165"/>
    <line x1="720" y1="208" x2="790" y2="215"/>
    <line x1="720" y1="218" x2="790" y2="265"/>
  </g>

  <rect x="490" y="120" width="78" height="30" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="529" y="140" font-size="11" fill="#1f2328" text-anchor="middle">AI ①</text>
  <rect x="490" y="175" width="78" height="30" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="529" y="195" font-size="11" fill="#1f2328" text-anchor="middle">AI ②</text>
  <rect x="490" y="230" width="78" height="30" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="529" y="250" font-size="11" fill="#1f2328" text-anchor="middle">AI ③</text>

  <rect x="640" y="165" width="80" height="70" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="680" y="192" font-size="12.5" font-weight="700" fill="#1a7f37" text-anchor="middle">MCP</text>
  <text x="680" y="211" font-size="9.5" fill="#57606a" text-anchor="middle">공통 규격</text>
  <text x="680" y="226" font-size="9.5" fill="#57606a" text-anchor="middle">USB-C</text>

  <rect x="790" y="100" width="86" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="833" y="120" font-size="10.5" fill="#1f2328" text-anchor="middle">드라이브</text>
  <rect x="790" y="150" width="86" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="833" y="170" font-size="10.5" fill="#1f2328" text-anchor="middle">슬랙</text>
  <rect x="790" y="200" width="86" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="833" y="220" font-size="10.5" fill="#1f2328" text-anchor="middle">노션</text>
  <rect x="790" y="250" width="86" height="30" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="833" y="270" font-size="10.5" fill="#1f2328" text-anchor="middle">깃허브</text>

  <text x="680" y="312" font-size="11" fill="#1a7f37" text-anchor="middle">각자 한 번씩만 만들면 된다. 더하기로 늘어난다</text>
</svg>
