<svg viewBox="0 0 760 504" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="dk-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
  </defs>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#57606a">이미지 · 컨테이너 · 볼륨 · 포트 — 한 줄 명령이 만드는 것</text>
  <text x="24" y="50" font-size="12" fill="#6e7781">24회차 노드 7(선택 심화)에 실린 n8n 공식 실행 예를 풀어 그렸다. 직접 띄워 보지는 않았다.</text>

  <!-- 이미지 -->
  <rect x="24" y="72" width="190" height="120" rx="12" fill="#ddf4ff" stroke="#0969da"/>
  <text x="42" y="100" font-size="15" font-weight="700" fill="#0969da">이미지</text>
  <text x="42" y="122" font-size="12.5" font-family="monospace" fill="#0969da">n8nio/n8n</text>
  <text x="42" y="146" font-size="12.5" fill="#57606a">앱 + 필요한 환경을</text>
  <text x="42" y="166" font-size="12.5" fill="#57606a">통째로 싸 둔 견본</text>
  <text x="42" y="184" font-size="12" fill="#6e7781">(바뀌지 않는다)</text>

  <line x1="218" y1="132" x2="296" y2="132" stroke="#6e7781" stroke-width="2" marker-end="url(#dk-ah)"/>
  <text x="242" y="122" font-size="12" fill="#6e7781" text-anchor="middle">docker run</text>

  <!-- 내 컴퓨터 -->
  <rect x="280" y="64" width="456" height="300" rx="12" fill="none" stroke="#6e7781" stroke-dasharray="5 4"/>
  <text x="298" y="88" font-size="14" font-weight="700" fill="#57606a">내 컴퓨터</text>

  <!-- 컨테이너 -->
  <rect x="300" y="102" width="416" height="112" rx="12" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="320" y="128" font-size="15" font-weight="700" fill="#bc4c00">컨테이너 — 이미지로 띄운 실행 중인 한 통</text>
  <text x="320" y="152" font-size="13" fill="#57606a">안에서 n8n이 돌고, 5678번 문으로 화면을 연다</text>
  <text x="320" y="174" font-size="13" fill="#57606a">--rm: 멈추면 컨테이너는 지워진다</text>
  <text x="320" y="196" font-size="13" fill="#57606a">안에 둔 임시 파일도 함께 사라진다</text>

  <!-- 볼륨 -->
  <line x1="508" y1="218" x2="508" y2="262" stroke="#6e7781" stroke-width="2" marker-start="url(#dk-ah)" marker-end="url(#dk-ah)"/>
  <text x="520" y="238" font-size="12" font-family="monospace" fill="#6e7781">-v n8n_data:/home/node/.n8n</text>
  <rect x="300" y="266" width="416" height="82" rx="12" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="320" y="292" font-size="15" font-weight="700" fill="#1a7f37">볼륨 n8n_data — 컨테이너 바깥 서랍</text>
  <text x="320" y="316" font-size="13" fill="#57606a">워크플로·설정 같은 n8n 데이터가 여기에 남는다</text>
  <text x="320" y="336" font-size="13" fill="#57606a">컨테이너를 지우고 새로 띄워도 이어서 쓴다</text>

  <!-- 브라우저 / 포트 -->
  <rect x="24" y="236" width="190" height="96" rx="12" fill="none" stroke="#0969da"/>
  <text x="42" y="262" font-size="15" font-weight="700" fill="#0969da">브라우저</text>
  <text x="42" y="286" font-size="12" font-family="monospace" fill="#0969da">127.0.0.1:5678</text>
  <text x="42" y="308" font-size="12" fill="#57606a">내 컴퓨터의 5678번 문</text>
  <path d="M214,272 C252,272 252,170 296,170" fill="none" stroke="#6e7781" stroke-width="2" marker-end="url(#dk-ah)"/>
  <text x="236" y="224" font-size="12" font-family="monospace" fill="#6e7781" text-anchor="end">-p 5678:5678</text>

  <!-- 아래 설명 -->
  <text x="24" y="398" font-size="13" fill="#57606a">-p 앞의 숫자는 내 컴퓨터 쪽 문, 뒤의 숫자는 컨테이너 안쪽 문이다.</text>
  <text x="24" y="420" font-size="13" fill="#57606a">컨테이너는 쓰고 버리는 통, 오래 남길 것은 볼륨에 둔다.</text>
  <text x="24" y="446" font-size="12" fill="#6e7781">실제 명령 (수업 자료의 공식 예):</text>
  <text x="24" y="466" font-size="12" font-family="monospace" fill="#6e7781">docker volume create n8n_data</text>
  <text x="24" y="486" font-size="12" font-family="monospace" fill="#6e7781">docker run -it --rm --name n8n -p 5678:5678 -v n8n_data:/home/node/.n8n n8nio/n8n</text>
</svg>
