<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="페어프로그래밍에서 요청부터 PRD 구체화, 제작, 검토, 수정까지의 흐름" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="f-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="f-ar-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
  </defs>

  <!-- 역할 범례 -->
  <rect x="30" y="24" width="16" height="16" rx="3" fill="#ddf4ff" stroke="#0969da"/>
  <text x="54" y="37" font-size="11.5" fill="#1f2328">네비게이터 — 요청하고 검토한다</text>
  <rect x="250" y="24" width="16" height="16" rx="3" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="274" y="37" font-size="11.5" fill="#1f2328">드라이버 — 손을 움직인다</text>
  <text x="500" y="37" font-size="11.5" font-weight="700" fill="#bc4c00">10분마다 역할을 바꾼다</text>

  <!-- 상단 4단계 -->
  <rect x="30" y="70" width="195" height="86" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="44" y="92" font-size="11" font-weight="700" fill="#0969da">① 요청</text>
  <text x="127" y="118" font-size="11.5" fill="#1f2328" text-anchor="middle">"이런 게임을</text>
  <text x="127" y="136" font-size="11.5" fill="#1f2328" text-anchor="middle">만들어 줘"</text>

  <line x1="231" y1="113" x2="239" y2="113" stroke="#57606a" stroke-width="2" marker-end="url(#f-ar)"/>

  <rect x="245" y="70" width="195" height="86" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="259" y="92" font-size="11" font-weight="700" fill="#1a7f37">② PRD 초안</text>
  <text x="342" y="118" font-size="11.5" fill="#1f2328" text-anchor="middle">무엇을 왜 만들지</text>
  <text x="342" y="136" font-size="11.5" fill="#1f2328" text-anchor="middle">글로 적는다</text>

  <line x1="446" y1="113" x2="454" y2="113" stroke="#57606a" stroke-width="2" marker-end="url(#f-ar)"/>

  <rect x="460" y="70" width="195" height="86" rx="8" fill="#fff8c5" stroke="#bc4c00" stroke-width="2"/>
  <text x="474" y="92" font-size="11" font-weight="700" fill="#bc4c00">③ LLM과 대화</text>
  <text x="557" y="118" font-size="11.5" fill="#1f2328" text-anchor="middle">질문을 받으며</text>
  <text x="557" y="136" font-size="11.5" fill="#1f2328" text-anchor="middle">빈칸을 채운다</text>

  <line x1="661" y1="113" x2="669" y2="113" stroke="#57606a" stroke-width="2" marker-end="url(#f-ar)"/>

  <rect x="675" y="70" width="195" height="86" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="689" y="92" font-size="11" font-weight="700" fill="#0969da">④ 피드백</text>
  <text x="772" y="118" font-size="11.5" fill="#1f2328" text-anchor="middle">빠진 조건을</text>
  <text x="772" y="136" font-size="11.5" fill="#1f2328" text-anchor="middle">짚어 준다</text>

  <!-- 줄바꿈 화살표 -->
  <path d="M772,162 L772,186 L127,186 L127,214" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#f-ar)"/>
  <text x="450" y="180" font-size="10.5" fill="#57606a" text-anchor="middle">PRD가 충분히 구체적이 되면 제작으로 넘어간다</text>

  <!-- 하단 3단계 -->
  <rect x="30" y="220" width="195" height="86" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="44" y="242" font-size="11" font-weight="700" fill="#1a7f37">⑤ 제작 의뢰</text>
  <text x="127" y="268" font-size="11.5" fill="#1f2328" text-anchor="middle">구체화된 PRD로</text>
  <text x="127" y="286" font-size="11.5" fill="#1f2328" text-anchor="middle">LLM에 요청</text>

  <line x1="231" y1="263" x2="239" y2="263" stroke="#57606a" stroke-width="2" marker-end="url(#f-ar)"/>

  <rect x="245" y="220" width="195" height="86" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="259" y="242" font-size="11" font-weight="700" fill="#0969da">⑥ 검토</text>
  <text x="342" y="268" font-size="11.5" fill="#1f2328" text-anchor="middle">부족한 점과</text>
  <text x="342" y="286" font-size="11.5" fill="#1f2328" text-anchor="middle">위험한 점을 찾는다</text>

  <line x1="446" y1="263" x2="454" y2="263" stroke="#57606a" stroke-width="2" marker-end="url(#f-ar)"/>

  <rect x="460" y="220" width="195" height="86" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="474" y="242" font-size="11" font-weight="700" fill="#1a7f37">⑦ 수정 반영</text>
  <text x="557" y="268" font-size="11.5" fill="#1f2328" text-anchor="middle">지적받은 내용을</text>
  <text x="557" y="286" font-size="11.5" fill="#1f2328" text-anchor="middle">고쳐 넣는다</text>

  <line x1="661" y1="263" x2="669" y2="263" stroke="#57606a" stroke-width="2" marker-end="url(#f-ar)"/>

  <rect x="675" y="220" width="195" height="86" rx="8" fill="#ffffff" stroke="#1f2328" stroke-width="2"/>
  <text x="772" y="256" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">완성</text>
  <text x="772" y="280" font-size="10.5" fill="#57606a" text-anchor="middle">카드 뒤집기 · 벽돌깨기</text>

  <!-- 되돌아가는 화살표 -->
  <path d="M342,312 L342,350 L790,350 L790,312" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#f-ar-p)"/>
  <text x="566" y="372" font-size="11" font-weight="700" fill="#8250df" text-anchor="middle">고칠 게 남으면 검토로 되돌아간다</text>

  <line x1="30" y1="396" x2="870" y2="396" stroke="#d0d7de"/>
  <text x="30" y="422" font-size="12" fill="#1f2328">키보드를 잡은 사람은 한 명이지만, <tspan font-weight="700">무엇을 만들지 정하는 일은 둘이 함께</tspan> 한다.</text>
  <text x="30" y="444" font-size="12" fill="#57606a">코드를 못 짜도 ①·④·⑥은 할 수 있다. 그게 이 방식의 핵심이었다.</text>
</svg>
