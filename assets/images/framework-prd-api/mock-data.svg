<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="백엔드가 없을 때 API 규약에 맞춘 목업 데이터를 쓰고, 나중에 실제 백엔드로 갈아끼우는 구조" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="m-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- 지금 -->
  <text x="30" y="34" font-size="14" font-weight="700" fill="#bc4c00">지금 — 백엔드가 아직 없다</text>

  <rect x="30" y="52" width="215" height="82" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="137" y="82" font-size="13" font-weight="700" fill="#0969da" text-anchor="middle">프론트엔드</text>
  <text x="137" y="104" font-size="10.5" fill="#57606a" text-anchor="middle">화면을 먼저 만들어야</text>
  <text x="137" y="120" font-size="10.5" fill="#57606a" text-anchor="middle">일이 진행된다</text>

  <line x1="251" y1="93" x2="299" y2="93" stroke="#57606a" stroke-width="2" marker-end="url(#m-ar)"/>

  <rect x="305" y="52" width="250" height="82" rx="8" fill="#fff8c5" stroke="#bc4c00" stroke-width="2"/>
  <text x="430" y="80" font-size="13" font-weight="700" fill="#bc4c00" text-anchor="middle">API 규약</text>
  <text x="430" y="102" font-size="10.5" fill="#57606a" text-anchor="middle">무엇을 어떤 형태로 주고받을지</text>
  <text x="430" y="118" font-size="10.5" fill="#57606a" text-anchor="middle">미리 정해 둔 약속</text>

  <line x1="561" y1="93" x2="609" y2="93" stroke="#57606a" stroke-width="2" marker-end="url(#m-ar)"/>

  <rect x="615" y="52" width="255" height="82" rx="8" fill="none" stroke="#8250df" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="742" y="80" font-size="13" font-weight="700" fill="#8250df" text-anchor="middle">목업 데이터</text>
  <text x="742" y="102" font-size="10.5" fill="#57606a" text-anchor="middle">규약과 똑같은 형태로 만든</text>
  <text x="742" y="118" font-size="10.5" fill="#57606a" text-anchor="middle">임시 데이터</text>

  <!-- 교체 화살표 -->
  <line x1="742" y1="150" x2="742" y2="196" stroke="#8250df" stroke-width="2.5" marker-end="url(#m-ar)"/>
  <text x="758" y="178" font-size="11.5" font-weight="700" fill="#8250df">이 자리만 갈아끼운다</text>

  <!-- 나중 -->
  <text x="30" y="238" font-size="14" font-weight="700" fill="#1a7f37">나중 — 백엔드가 준비되면</text>

  <rect x="30" y="256" width="215" height="82" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="137" y="286" font-size="13" font-weight="700" fill="#0969da" text-anchor="middle">프론트엔드</text>
  <text x="137" y="308" font-size="10.5" font-weight="700" fill="#1a7f37" text-anchor="middle">고치지 않는다</text>
  <text x="137" y="324" font-size="10.5" fill="#57606a" text-anchor="middle">받는 형태가 같으니까</text>

  <line x1="251" y1="297" x2="299" y2="297" stroke="#57606a" stroke-width="2" marker-end="url(#m-ar)"/>

  <rect x="305" y="256" width="250" height="82" rx="8" fill="#fff8c5" stroke="#bc4c00" stroke-width="2"/>
  <text x="430" y="284" font-size="13" font-weight="700" fill="#bc4c00" text-anchor="middle">API 규약</text>
  <text x="430" y="308" font-size="10.5" font-weight="700" fill="#bc4c00" text-anchor="middle">그대로 유지</text>
  <text x="430" y="324" font-size="10.5" fill="#57606a" text-anchor="middle">기준이 바뀌지 않는다</text>

  <line x1="561" y1="297" x2="609" y2="297" stroke="#57606a" stroke-width="2" marker-end="url(#m-ar)"/>

  <rect x="615" y="256" width="255" height="82" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="742" y="286" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle">실제 백엔드</text>
  <text x="742" y="308" font-size="10.5" fill="#57606a" text-anchor="middle">진짜 데이터를</text>
  <text x="742" y="324" font-size="10.5" fill="#57606a" text-anchor="middle">같은 형태로 돌려준다</text>

  <line x1="30" y1="368" x2="870" y2="368" stroke="#d0d7de"/>
  <text x="30" y="394" font-size="12" fill="#1f2328">그래서 목업 데이터는 <tspan font-weight="700">아무 형태로나 만들면 안 된다.</tspan> 규약에서 벗어나면 나중에 화면 코드를 전부 고쳐야 한다.</text>
  <text x="30" y="416" font-size="12" fill="#57606a">규약을 먼저 정해두는 것이, 프론트엔드와 백엔드가 서로를 기다리지 않고 동시에 일할 수 있게 만든다.</text>
</svg>
