<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="API를 레스토랑의 웨이터에 비유한 그림과 날씨 앱의 실제 요청·응답 대응" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
    <marker id="a-ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <!-- 비유 -->
  <text x="30" y="34" font-size="14" font-weight="700" fill="#57606a">비유 — 레스토랑</text>

  <rect x="30" y="50" width="220" height="76" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="82" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">손님</text>
  <text x="140" y="103" font-size="10.5" fill="#57606a" text-anchor="middle">주방에 직접 들어갈 수 없다</text>

  <rect x="340" y="50" width="220" height="76" rx="8" fill="#fff8c5" stroke="#bc4c00" stroke-width="2"/>
  <text x="450" y="82" font-size="13" font-weight="700" fill="#bc4c00" text-anchor="middle">웨이터</text>
  <text x="450" y="103" font-size="10.5" fill="#57606a" text-anchor="middle">주문을 받아 전달하고 가져온다</text>

  <rect x="650" y="50" width="220" height="76" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="760" y="82" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">주방</text>
  <text x="760" y="103" font-size="10.5" fill="#57606a" text-anchor="middle">어떻게 만드는지는 안 보여준다</text>

  <line x1="256" y1="76" x2="334" y2="76" stroke="#bc4c00" stroke-width="2" marker-end="url(#a-ar)"/>
  <text x="295" y="68" font-size="10" fill="#bc4c00" text-anchor="middle">주문</text>
  <line x1="566" y1="76" x2="644" y2="76" stroke="#bc4c00" stroke-width="2" marker-end="url(#a-ar)"/>
  <text x="605" y="68" font-size="10" fill="#bc4c00" text-anchor="middle">전달</text>
  <line x1="644" y1="110" x2="566" y2="110" stroke="#1a7f37" stroke-width="2" marker-end="url(#a-ar-g)"/>
  <line x1="334" y1="110" x2="256" y2="110" stroke="#1a7f37" stroke-width="2" marker-end="url(#a-ar-g)"/>
  <text x="450" y="144" font-size="10" fill="#1a7f37" text-anchor="middle">요리를 가져다준다</text>

  <line x1="30" y1="152" x2="870" y2="152" stroke="#d0d7de" stroke-dasharray="4 4"/>

  <!-- 실제 -->
  <text x="30" y="186" font-size="14" font-weight="700" fill="#1f2328">실제 — 날씨 앱</text>

  <rect x="30" y="202" width="220" height="90" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="140" y="232" font-size="13" font-weight="700" fill="#0969da" text-anchor="middle">내 앱</text>
  <text x="140" y="254" font-size="10.5" fill="#57606a" text-anchor="middle">기상 데이터를 직접</text>
  <text x="140" y="270" font-size="10.5" fill="#57606a" text-anchor="middle">측정하지 않는다</text>

  <rect x="340" y="202" width="220" height="90" rx="8" fill="#fff8c5" stroke="#bc4c00" stroke-width="2"/>
  <text x="450" y="232" font-size="13" font-weight="700" fill="#bc4c00" text-anchor="middle">API</text>
  <text x="450" y="254" font-size="10.5" fill="#57606a" text-anchor="middle">정해진 규칙에 따라</text>
  <text x="450" y="270" font-size="10.5" fill="#57606a" text-anchor="middle">데이터를 주고받는 창구</text>

  <rect x="650" y="202" width="220" height="90" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="760" y="232" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">기상청 서버</text>
  <text x="760" y="254" font-size="10.5" fill="#57606a" text-anchor="middle">내부 구조를 몰라도</text>
  <text x="760" y="270" font-size="10.5" fill="#57606a" text-anchor="middle">쓸 수 있다</text>

  <line x1="256" y1="228" x2="334" y2="228" stroke="#bc4c00" stroke-width="2" marker-end="url(#a-ar)"/>
  <line x1="566" y1="228" x2="644" y2="228" stroke="#bc4c00" stroke-width="2" marker-end="url(#a-ar)"/>
  <text x="450" y="196" font-size="10.5" font-weight="700" fill="#bc4c00" text-anchor="middle">요청: "서울, 오늘 날씨"</text>

  <line x1="644" y1="272" x2="566" y2="272" stroke="#1a7f37" stroke-width="2" marker-end="url(#a-ar-g)"/>
  <line x1="334" y1="272" x2="256" y2="272" stroke="#1a7f37" stroke-width="2" marker-end="url(#a-ar-g)"/>
  <text x="450" y="310" font-size="10.5" font-weight="700" fill="#1a7f37" text-anchor="middle">응답: 아래 형식의 데이터</text>

  <!-- JSON -->
  <rect x="240" y="326" width="420" height="146" rx="8" fill="#1f2328"/>
  <text x="258" y="350" font-size="10.5" font-family="Consolas,monospace" fill="#8b949e">JSON — 요즘 가장 많이 쓰는 전송 형식</text>
  <text x="258" y="374" font-size="12" font-family="Consolas,monospace" fill="#e6edf3">{</text>
  <text x="278" y="394" font-size="12" font-family="Consolas,monospace" fill="#e6edf3">"city": <tspan fill="#7ee787">"서울"</tspan>,</text>
  <text x="278" y="414" font-size="12" font-family="Consolas,monospace" fill="#e6edf3">"weather": <tspan fill="#7ee787">"맑음"</tspan>,</text>
  <text x="278" y="434" font-size="12" font-family="Consolas,monospace" fill="#e6edf3">"temp": <tspan fill="#79c0ff">25</tspan></text>
  <text x="258" y="454" font-size="12" font-family="Consolas,monospace" fill="#e6edf3">}</text>

  <text x="30" y="498" font-size="12" fill="#1f2328">메뉴판 = <tspan font-weight="700">API 문서</tspan>. 메뉴판에 없는 것은 주문할 수 없고, 정해진 형식대로만 주문해야 한다.</text>
</svg>
