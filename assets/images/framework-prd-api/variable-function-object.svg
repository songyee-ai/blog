<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="변수는 값에 붙인 이름, 함수는 입력을 받아 처리하는 단위, 객체는 둘을 묶은 것" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="v-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- 변수 -->
  <rect x="30" y="40" width="390" height="152" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="48" y="66" font-size="14" font-weight="700" fill="#0969da">변수 — 값에 붙인 이름</text>

  <rect x="60" y="86" width="120" height="50" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="120" y="116" font-size="13" font-family="Consolas,monospace" fill="#1f2328" text-anchor="middle">speed</text>

  <line x1="188" y1="111" x2="238" y2="111" stroke="#57606a" stroke-width="2" marker-end="url(#v-ar)"/>
  <text x="213" y="102" font-size="10" fill="#57606a" text-anchor="middle">가리킨다</text>

  <rect x="246" y="86" width="140" height="50" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="316" y="108" font-size="13" font-family="Consolas,monospace" fill="#1f2328" text-anchor="middle">60</text>
  <text x="316" y="126" font-size="9.5" fill="#57606a" text-anchor="middle">메모리에 저장된 값</text>

  <text x="48" y="164" font-size="11" fill="#57606a">이름은 값 자체가 아니다. 값이 있는 자리를 가리키는 이름표에 가깝다.</text>
  <text x="48" y="181" font-size="11" fill="#57606a">그래서 같은 이름이 나중에 다른 값을 가리킬 수도 있다.</text>

  <!-- 함수 -->
  <rect x="450" y="40" width="420" height="152" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="468" y="66" font-size="14" font-weight="700" fill="#1a7f37">함수 — 입력을 받아 일을 한다</text>

  <rect x="472" y="86" width="98" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="521" y="110" font-size="11.5" fill="#1f2328" text-anchor="middle">입력</text>
  <text x="521" y="126" font-size="9.5" fill="#57606a" text-anchor="middle">(값을 넣는다)</text>

  <line x1="576" y1="111" x2="606" y2="111" stroke="#57606a" stroke-width="2" marker-end="url(#v-ar)"/>

  <rect x="612" y="86" width="98" height="50" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="661" y="110" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">작업 수행</text>
  <text x="661" y="126" font-size="9.5" fill="#57606a" text-anchor="middle">(정해진 일)</text>

  <line x1="716" y1="111" x2="746" y2="111" stroke="#57606a" stroke-width="2" marker-end="url(#v-ar)"/>

  <rect x="752" y="86" width="98" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="801" y="110" font-size="11.5" fill="#1f2328" text-anchor="middle">결과</text>
  <text x="801" y="126" font-size="9.5" fill="#57606a" text-anchor="middle">(필요하면 돌려줌)</text>

  <text x="468" y="164" font-size="11" fill="#57606a">"필요하면"이 중요하다. 값을 돌려주지 않고 화면에 그리기만 하는</text>
  <text x="468" y="181" font-size="11" fill="#57606a">함수도 있다.</text>

  <!-- 객체 -->
  <rect x="30" y="216" width="840" height="152" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
  <text x="48" y="243" font-size="14" font-weight="700" fill="#8250df">객체(오브젝트) = 변수 + 함수 — 흩어진 것을 하나의 덩어리로 묶는다</text>

  <rect x="60" y="258" width="370" height="92" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="245" y="281" font-size="12" font-weight="700" fill="#0969da" text-anchor="middle">상태 — 변수</text>
  <text x="245" y="305" font-size="11.5" font-family="Consolas,monospace" fill="#1f2328" text-anchor="middle">speed = 60</text>
  <text x="245" y="325" font-size="11.5" font-family="Consolas,monospace" fill="#1f2328" text-anchor="middle">color = "red"</text>
  <text x="245" y="343" font-size="9.5" fill="#57606a" text-anchor="middle">이 자동차가 지금 어떤 상태인가</text>

  <text x="450" y="310" font-size="20" font-weight="700" fill="#8250df" text-anchor="middle">+</text>

  <rect x="470" y="258" width="370" height="92" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="655" y="281" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">행동 — 함수</text>
  <text x="655" y="305" font-size="11.5" font-family="Consolas,monospace" fill="#1f2328" text-anchor="middle">accelerate()</text>
  <text x="655" y="325" font-size="11.5" font-family="Consolas,monospace" fill="#1f2328" text-anchor="middle">brake()</text>
  <text x="655" y="343" font-size="9.5" fill="#57606a" text-anchor="middle">이 자동차가 무엇을 할 수 있는가</text>
</svg>
