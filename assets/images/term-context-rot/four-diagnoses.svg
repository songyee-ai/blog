<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">맥락 부패 — 흐려진 모습은 비슷해도 원인은 넷, 처방도 넷</text>
  <text x="24" y="50" font-size="12" fill="#57606a">한 해 동안 한 권에 계속 적은 알림장으로 읽기. 위는 알림장 장면, 아래 회색 줄은 모델 입력에서 생기는 일.</text>

  <g font-size="12">
    <text x="40" y="82" font-weight="700" fill="#57606a">유형</text>
    <text x="200" y="82" font-weight="700" fill="#57606a">알림장에서 생긴 일</text>
    <text x="566" y="82" font-weight="700" fill="#57606a">처방</text>

    <rect x="24" y="92" width="712" height="70" rx="10" fill="#ffebe9" stroke="#cf222e"/>
    <text x="40" y="120" font-size="14" font-weight="700" fill="#cf222e">오염</text>
    <text x="40" y="140" fill="#57606a">poisoning</text>
    <text x="200" y="120" font-size="13" fill="#1f2328">잘못 들은 "소풍 취소"를 적어 두고 사실로 믿는다</text>
    <text x="200" y="140" fill="#57606a">검증 안 된 앞선 답·요약이 다음 판단의 전제가 된다</text>
    <text x="566" y="120" font-size="14" font-weight="700" fill="#cf222e">상태 정정</text>
    <text x="566" y="140" fill="#57606a">원문과 대조해 틀린 줄을 고친다</text>

    <rect x="24" y="170" width="712" height="70" rx="10" fill="#fff8c5" stroke="#9a6700"/>
    <text x="40" y="198" font-size="14" font-weight="700" fill="#9a6700">주의 분산</text>
    <text x="40" y="218" fill="#57606a">distraction</text>
    <text x="200" y="198" font-size="13" fill="#1f2328">급식표와 낙서 사이에 숙제 한 줄이 묻힌다</text>
    <text x="200" y="218" fill="#57606a">지금 질문과 상관없는 글이 주의를 빼앗는다</text>
    <text x="566" y="198" font-size="14" font-weight="700" fill="#9a6700">선택 축소</text>
    <text x="566" y="218" fill="#57606a">필요한 것만 남긴다</text>

    <rect x="24" y="248" width="712" height="70" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="40" y="276" font-size="14" font-weight="700" fill="#0969da">혼동</text>
    <text x="40" y="296" fill="#57606a">confusion</text>
    <text x="200" y="276" font-size="13" fill="#1f2328">1반과 2반 준비물이 섞여 누구 것인지 모른다</text>
    <text x="200" y="296" fill="#57606a">비슷한 근거의 대상·버전·범위가 안 나뉘어 있다</text>
    <text x="566" y="276" font-size="14" font-weight="700" fill="#0969da">근거 경계 분리</text>
    <text x="566" y="296" fill="#57606a">자료마다 이름표를 붙인다</text>

    <rect x="24" y="326" width="712" height="70" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="40" y="354" font-size="14" font-weight="700" fill="#1a7f37">충돌</text>
    <text x="40" y="374" fill="#57606a">clash</text>
    <text x="200" y="354" font-size="13" fill="#1f2328">"실내화 챙겨" "운동화 신고 와"가 함께 적혀 있다</text>
    <text x="200" y="374" fill="#57606a">어긋나는 지시·근거 중 무엇이 먼저인지 안 정했다</text>
    <text x="566" y="354" font-size="14" font-weight="700" fill="#1a7f37">우선순위 판정</text>
    <text x="566" y="374" fill="#57606a">누구 말이 먼저인지 정한다</text>
  </g>
</svg>
