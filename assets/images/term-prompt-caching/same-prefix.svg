<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">프롬프트 캐싱 — 맨 앞부터 똑같은 데까지만 다시 쓴다</text>
  <g font-size="12">
    <rect x="24" y="42" width="14" height="14" rx="3" fill="#fff1e5" stroke="#bc4c00"/>
    <text x="44" y="54" fill="#57606a">처음 읽고 저장 (캐시 쓰기)</text>
    <rect x="214" y="42" width="14" height="14" rx="3" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="234" y="54" fill="#57606a">저장한 것 꺼내 쓰기 (캐시 읽기)</text>
    <rect x="434" y="42" width="14" height="14" rx="3" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="454" y="54" fill="#57606a">매번 새로 읽기 (일반 입력)</text>
  </g>

  <g font-size="13">
    <text x="24" y="104" font-weight="700" fill="#1f2328">요청 1</text>
    <rect x="96" y="80" width="372" height="40" rx="6" fill="#fff1e5" stroke="#bc4c00"/>
    <text x="112" y="105" fill="#1f2328">고정 앞부분: 상담 규칙 · 도구 설명 · 검토한 규정</text>
    <rect x="472" y="80" width="140" height="40" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="488" y="105" fill="#1f2328">이번 자료</text>
    <rect x="616" y="80" width="120" height="40" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="632" y="105" fill="#1f2328">질문 ①</text>
    <text x="96" y="142" font-size="12" fill="#57606a">처음이라 앞부분을 읽고 저장해 둔다. 저장하는 값은 일반 입력보다 조금 비쌀 수 있다</text>

    <text x="24" y="190" font-weight="700" fill="#1f2328">요청 2</text>
    <rect x="96" y="166" width="372" height="40" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="112" y="191" fill="#1f2328">같은 앞부분 → 저장한 계산을 꺼내 쓴다</text>
    <rect x="472" y="166" width="140" height="40" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="488" y="191" fill="#1f2328">이번 자료</text>
    <rect x="616" y="166" width="120" height="40" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="632" y="191" fill="#1f2328">질문 ②</text>
    <text x="96" y="228" font-size="12" fill="#57606a">유효 시간 안에 앞부분이 글자 하나까지 같으면 싼 값으로 읽힌다</text>

    <text x="24" y="276" font-weight="700" fill="#1f2328">요청 3</text>
    <rect x="96" y="252" width="96" height="40" rx="6" fill="#ffebe9" stroke="#cf222e"/>
    <text x="110" y="277" fill="#cf222e">오늘 날짜</text>
    <rect x="196" y="252" width="272" height="40" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="212" y="277" fill="#1f2328">상담 규칙 · 도구 설명 · 규정</text>
    <rect x="472" y="252" width="140" height="40" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="488" y="277" fill="#1f2328">이번 자료</text>
    <rect x="616" y="252" width="120" height="40" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="632" y="277" fill="#1f2328">질문 ③</text>
    <text x="96" y="314" font-size="12" fill="#57606a">맨 앞에 바뀌는 값을 끼우면, 뒤가 같은 내용이어도 처음부터 다시 읽는다</text>
  </g>

  <rect x="24" y="340" width="712" height="80" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="40" y="366" font-size="14" font-weight="700" fill="#0969da">적중률은 품질 점수가 아니다</text>
  <text x="40" y="390" font-size="13" fill="#1f2328">적중률이 높다 = 같은 앞부분이 자주 되풀이됐다. 그 앞부분이 맞고 최신이며</text>
  <text x="40" y="410" font-size="13" fill="#1f2328">넣어도 되는 자료라는 뜻은 아니다. 고정할 자료는 먼저 믿을 수 있는지부터 판정한다.</text>
</svg>
