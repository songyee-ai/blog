<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">맥락을 다루는 두 질문 — 가방 싸기와 알림장 관리</text>
  <text x="24" y="50" font-size="12" fill="#57606a">왼쪽은 이번 호출 한 번의 일, 오른쪽은 여러 턴에 걸친 일이다. 같은 "줄이기"라도 어느 쪽 일인지 먼저 정한다.</text>

  <g font-size="12">
    <rect x="24" y="66" width="348" height="276" rx="12" fill="#ddf4ff" stroke="#0969da"/>
    <text x="40" y="92" font-size="14" font-weight="700" fill="#0969da">선택 연산 — 이번에 무엇을 넣나</text>
    <text x="40" y="112" fill="#57606a">오늘 가방에 무엇을 챙길까</text>

    <text x="40" y="146" font-weight="700" fill="#1f2328">전체 투입</text>
    <text x="40" y="164" fill="#57606a">관계없는 내용이 핵심을 밀어낼 수 있다</text>
    <text x="40" y="196" font-weight="700" fill="#1f2328">RAG (검색한 조각만)</text>
    <text x="40" y="214" fill="#57606a">꼭 필요한 예외 조각이 빠질 수 있다</text>
    <text x="40" y="246" font-weight="700" fill="#1f2328">압축 (줄여서)</text>
    <text x="40" y="264" fill="#57606a">조건·예외가 빠진 채 사실처럼 남는다</text>
    <text x="40" y="296" font-weight="700" fill="#1f2328">폐기 (지금 근거가 아닌 것 빼기)</text>
    <text x="40" y="314" fill="#57606a">뺀 이유까지 잊으면 같은 실수가 돌아온다</text>

    <rect x="388" y="66" width="348" height="276" rx="12" fill="#fff8c5" stroke="#9a6700"/>
    <text x="404" y="92" font-size="14" font-weight="700" fill="#9a6700">상태 정책 — 지난 것을 어떻게 남기나</text>
    <text x="404" y="112" fill="#57606a">지난 알림장을 어떻게 정리해 둘까</text>

    <text x="404" y="146" font-weight="700" fill="#1f2328">누적 (전부 계속)</text>
    <text x="404" y="164" fill="#57606a">철회한 가정까지 계속 따라온다</text>
    <text x="404" y="196" font-weight="700" fill="#1f2328">슬라이딩 윈도 (최근 몇 턴만)</text>
    <text x="404" y="214" fill="#57606a">오래전에 정한 조건을 잃는다</text>
    <text x="404" y="246" font-weight="700" fill="#1f2328">요약 (오래된 부분을 줄여서)</text>
    <text x="404" y="264" fill="#57606a">원문과의 연결이 끊긴다</text>
    <text x="404" y="296" font-weight="700" fill="#1f2328">러닝 서머리 (정해진 칸을 계속 갱신)</text>
    <text x="404" y="314" fill="#57606a">뺀 이유를 안 적으면 옛 가정이 되살아난다</text>
  </g>
</svg>
