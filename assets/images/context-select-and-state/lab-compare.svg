<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">실습 1 → 실습 2 (JSON) — 같은 네 조건, 각 2회</text>
  <text x="24" y="50" font-size="12" fill="#57606a">qwen3.5:2b · temperature 0 · 추론 끔. 두 실습 사이에 질문 문장·틀·단정 금지 위치·출력 형식이 함께 바뀌었다.</text>

  <g font-size="12" font-weight="700" fill="#57606a" text-anchor="middle">
    <text x="300" y="84">정답성</text>
    <text x="440" y="84">지어낸 사실 없음</text>
    <text x="580" y="84">회수율</text>
    <text x="690" y="84">가능 여부(실습 2)</text>
  </g>

  <g font-size="12">
    <text x="24" y="118" font-size="14" font-weight="700" fill="#1f2328">none</text>
    <text x="24" y="135" fill="#57606a">정책 없음</text>
    <text x="300" y="124" text-anchor="middle" fill="#57606a">0/2 → 0/2</text>
    <text x="440" y="124" text-anchor="middle" fill="#57606a">0/2 → 0/2</text>
    <text x="580" y="124" text-anchor="middle" fill="#57606a">0/3 → 0/3</text>
    <text x="690" y="124" text-anchor="middle" fill="#cf222e">false</text>

    <rect x="18" y="148" width="724" height="46" rx="8" fill="#ffebe9" stroke="#cf222e"/>
    <text x="24" y="168" font-size="14" font-weight="700" fill="#1f2328">full</text>
    <text x="24" y="185" fill="#57606a">정책 전문 §1~§4</text>
    <text x="300" y="176" text-anchor="middle" font-weight="700" fill="#cf222e">2/2 → 0/2</text>
    <text x="440" y="176" text-anchor="middle" fill="#57606a">2/2 → 2/2</text>
    <text x="580" y="176" text-anchor="middle" fill="#57606a">1/3 → 2/3</text>
    <text x="690" y="176" text-anchor="middle" fill="#cf222e">false</text>

    <text x="24" y="222" font-size="14" font-weight="700" fill="#1f2328">selected</text>
    <text x="24" y="239" fill="#57606a">§1·§3, 표식 없음</text>
    <text x="300" y="228" text-anchor="middle" fill="#57606a">0/2 → 0/2</text>
    <text x="440" y="228" text-anchor="middle" fill="#57606a">0/2 → 0/2</text>
    <text x="580" y="228" text-anchor="middle" fill="#57606a">2/3 → 2/3</text>
    <text x="690" y="228" text-anchor="middle" fill="#cf222e">false</text>

    <rect x="18" y="252" width="724" height="46" rx="8" fill="#fff8c5" stroke="#9a6700"/>
    <text x="24" y="272" font-size="14" font-weight="700" fill="#1f2328">selected_cited</text>
    <text x="24" y="289" fill="#57606a">§1·§3 + 출처 표식</text>
    <text x="300" y="280" text-anchor="middle" fill="#57606a">0/2 → 0/2</text>
    <text x="440" y="280" text-anchor="middle" font-weight="700" fill="#1a7f37">0/2 → 2/2</text>
    <text x="580" y="280" text-anchor="middle" font-weight="700" fill="#cf222e">3/3 → 1/3</text>
    <text x="690" y="280" text-anchor="middle" fill="#cf222e">false</text>
  </g>
  <text x="24" y="320" font-size="11" fill="#57606a">정답은 "신청 가능, 단 착용 여부 확인 필요". 실습 2의 여덟 답은 모두 가능 여부를 false로 냈다.</text>
