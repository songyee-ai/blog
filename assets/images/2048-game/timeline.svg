<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="26" font-size="15" font-weight="700" fill="#1f2328">22분 동안 실제로 일어난 일 — 내가 넣은 프롬프트는 두 번뿐</text>
  <text x="24" y="48" font-size="12" fill="#57606a">파란 칸이 내가 한 것, 회색 칸은 AI가 스스로 돌린 검증 루프다.</text>

  <line x1="40" y1="96" x2="736" y2="96" stroke="#d0d7de" stroke-width="2"/>

  <!-- 1 -->
  <circle cx="70" cy="96" r="7" fill="#0969da"/>
  <text x="70" y="82" font-size="10" fill="#57606a" text-anchor="middle">17:14</text>
  <rect x="24" y="114" width="150" height="72" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="38" y="134" font-size="11.5" font-weight="700" fill="#1f2328">설계안 통째로 투입</text>
  <text x="38" y="152" font-size="10.5" fill="#57606a">화면·상태·규칙 8개·</text>
  <text x="38" y="167" font-size="10.5" fill="#57606a">모바일 주의사항까지</text>
  <text x="38" y="182" font-size="10.5" fill="#57606a">한 번에</text>

  <!-- 2 -->
  <circle cx="222" cy="96" r="6" fill="#8c959f"/>
  <text x="222" y="82" font-size="10" fill="#57606a" text-anchor="middle">17:18</text>
  <rect x="180" y="114" width="134" height="72" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="194" y="134" font-size="11.5" font-weight="700" fill="#1f2328">파일 생성</text>
  <text x="194" y="152" font-size="10.5" fill="#57606a">셸 heredoc으로 쓰다</text>
  <text x="194" y="167" font-size="10.5" fill="#57606a">깨짐 → 파일 쓰기</text>
  <text x="194" y="182" font-size="10.5" fill="#57606a">도구로 다시 작성</text>

  <!-- 3 -->
  <circle cx="380" cy="96" r="6" fill="#8c959f"/>
  <text x="380" y="82" font-size="10" fill="#57606a" text-anchor="middle">17:20~17:32</text>
  <rect x="320" y="114" width="150" height="72" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="334" y="134" font-size="11.5" font-weight="700" fill="#1f2328">스스로 검증</text>
  <text x="334" y="152" font-size="10.5" fill="#57606a">단위 테스트 17개 ·</text>
  <text x="334" y="167" font-size="10.5" fill="#57606a">랜덤 90수 불변식 ·</text>
  <text x="334" y="182" font-size="10.5" fill="#57606a">터치 스와이프</text>

  <!-- 4 -->
  <circle cx="530" cy="96" r="6" fill="#9a6700"/>
  <text x="530" y="82" font-size="10" fill="#57606a" text-anchor="middle">17:31</text>
  <rect x="476" y="114" width="140" height="72" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="490" y="134" font-size="11.5" font-weight="700" fill="#1f2328">눈으로 보고 수정</text>
  <text x="490" y="152" font-size="10.5" fill="#57606a">게임오버 글씨가</text>
  <text x="490" y="167" font-size="10.5" fill="#57606a">타일과 겹쳐 안 읽힘</text>
  <text x="490" y="182" font-size="10.5" fill="#57606a">→ 가운데 카드로</text>

  <!-- 5 -->
  <circle cx="686" cy="96" r="7" fill="#0969da"/>
  <text x="686" y="82" font-size="10" fill="#57606a" text-anchor="middle">17:33</text>
  <rect x="622" y="114" width="114" height="72" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="636" y="134" font-size="11.5" font-weight="700" fill="#1f2328">배포 결정</text>
  <text x="636" y="152" font-size="10.5" fill="#57606a">"push하고 Pages</text>
  <text x="636" y="167" font-size="10.5" fill="#57606a">켤까요?" →</text>
  <text x="636" y="182" font-size="10.5" fill="#57606a">켜기 선택</text>

  <rect x="24" y="212" width="712" height="64" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="40" y="234" font-size="12" font-weight="700" fill="#1f2328">왜 "다시 요청"이 한 번도 없었나</text>
  <text x="40" y="254" font-size="11.5" fill="#57606a">설계안에 "4 4 4 4는 8 8이 되어야 하고 16이 되면 버그다", "벽에 붙은 방향으로 밀어도 타일이 늘면 억울한 게임이 된다" 같은</text>
  <text x="40" y="270" font-size="11.5" fill="#57606a">문장을 미리 적어 뒀다. 이 문장들이 그대로 테스트 항목이 되어서, 고칠 거리가 만들어지기 전에 걸러졌다.</text>
</svg>
