<svg viewBox="0 0 760 336" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">다섯 단계 — 그리고 단계마다 남기는 되돌릴 지점</text>
  <text x="24" y="50" font-size="12" fill="#57606a">어디까지 갔는지가 그날의 성과다. 3단계에서 멈춰도 된다.</text>

  <!-- 1 -->
  <rect x="24" y="70" width="124" height="134" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <circle cx="44" cy="90" r="11" fill="#0969da"/>
  <text x="44" y="94.5" font-size="11.5" font-weight="700" fill="#ddf4ff" text-anchor="middle">1</text>
  <text x="62" y="94.5" font-size="12.5" font-weight="700" fill="#1f2328">PRD</text>
  <text x="38" y="122" font-size="11.5" fill="#1f2328">만들 것을</text>
  <text x="38" y="138" font-size="11.5" fill="#1f2328">한 장으로</text>
  <line x1="38" y1="152" x2="134" y2="152" stroke="#0969da" stroke-opacity="0.35"/>
  <text x="38" y="170" font-size="10" fill="#0969da">통과하면</text>
  <text x="38" y="186" font-size="11" fill="#57606a">AI에게 줄 설계도</text>

  <path d="M154 137 l7 6 l-7 6" fill="none" stroke="#57606a" stroke-width="1.5"/>

  <!-- 2 -->
  <rect x="171" y="70" width="124" height="134" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <circle cx="191" cy="90" r="11" fill="#0969da"/>
  <text x="191" y="94.5" font-size="11.5" font-weight="700" fill="#ddf4ff" text-anchor="middle">2</text>
  <text x="209" y="94.5" font-size="12.5" font-weight="700" fill="#1f2328">작업대</text>
  <text x="185" y="122" font-size="11.5" fill="#1f2328">하네스 고르고</text>
  <text x="185" y="138" font-size="11.5" fill="#1f2328">빈 프로젝트</text>
  <line x1="185" y1="152" x2="281" y2="152" stroke="#0969da" stroke-opacity="0.35"/>
  <text x="185" y="170" font-size="10" fill="#0969da">통과하면</text>
  <text x="185" y="186" font-size="11" fill="#57606a">프로젝트가 뜬다</text>

  <path d="M301 137 l7 6 l-7 6" fill="none" stroke="#57606a" stroke-width="1.5"/>

  <!-- 3 -->
  <rect x="318" y="70" width="124" height="134" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <circle cx="338" cy="90" r="11" fill="#0969da"/>
  <text x="338" y="94.5" font-size="11.5" font-weight="700" fill="#ddf4ff" text-anchor="middle">3</text>
  <text x="356" y="94.5" font-size="12.5" font-weight="700" fill="#1f2328">화면</text>
  <text x="332" y="122" font-size="11.5" fill="#1f2328">목업 값으로</text>
  <text x="332" y="138" font-size="11.5" fill="#1f2328">눈에 보이게</text>
  <line x1="332" y1="152" x2="428" y2="152" stroke="#0969da" stroke-opacity="0.35"/>
  <text x="332" y="170" font-size="10" fill="#0969da">통과하면</text>
  <text x="332" y="186" font-size="11" fill="#57606a">진짜처럼 보인다</text>

  <path d="M448 137 l7 6 l-7 6" fill="none" stroke="#57606a" stroke-width="1.5"/>

  <!-- 4 -->
  <rect x="465" y="70" width="124" height="134" rx="8" fill="#fbefff" stroke="#8250df"/>
  <circle cx="485" cy="90" r="11" fill="#8250df"/>
  <text x="485" y="94.5" font-size="11.5" font-weight="700" fill="#fbefff" text-anchor="middle">4</text>
  <text x="503" y="94.5" font-size="12.5" font-weight="700" fill="#1f2328">저장 + 규칙</text>
  <text x="479" y="122" font-size="11.5" fill="#1f2328">남게 하고</text>
  <text x="479" y="138" font-size="11.5" fill="#1f2328">규칙을 지키게</text>
  <line x1="479" y1="152" x2="575" y2="152" stroke="#8250df" stroke-opacity="0.35"/>
  <text x="479" y="170" font-size="10" fill="#8250df">오늘의 산</text>
  <text x="479" y="186" font-size="11" fill="#57606a">규칙이 안 뚫린다</text>

  <path d="M595 137 l7 6 l-7 6" fill="none" stroke="#57606a" stroke-width="1.5"/>

  <!-- 5 -->
  <rect x="612" y="70" width="124" height="134" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <circle cx="632" cy="90" r="11" fill="#0969da"/>
  <text x="632" y="94.5" font-size="11.5" font-weight="700" fill="#ddf4ff" text-anchor="middle">5</text>
  <text x="650" y="94.5" font-size="12.5" font-weight="700" fill="#1f2328">한 바퀴</text>
  <text x="626" y="122" font-size="11.5" fill="#1f2328">끝까지 돌리고</text>
  <text x="626" y="138" font-size="11.5" fill="#1f2328">내보내기</text>
  <line x1="626" y1="152" x2="722" y2="152" stroke="#0969da" stroke-opacity="0.35"/>
  <text x="626" y="170" font-size="10" fill="#0969da">통과하면</text>
  <text x="626" y="186" font-size="11" fill="#57606a">주소가 생긴다</text>

  <!-- commit line -->
  <text x="24" y="238" font-size="11" fill="#1a7f37">작동하면 저장 — 깨져도 마지막으로 정상이던 지점으로 돌아온다</text>
  <line x1="24" y1="262" x2="736" y2="262" stroke="#d0d7de" stroke-width="2"/>

  <circle cx="86" cy="262" r="11" fill="#dafbe1" stroke="#1a7f37"/>
  <path d="M81 262 l4 4 l6 -8" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <circle cx="233" cy="262" r="11" fill="#dafbe1" stroke="#1a7f37"/>
  <path d="M228 262 l4 4 l6 -8" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <circle cx="380" cy="262" r="11" fill="#dafbe1" stroke="#1a7f37"/>
  <path d="M375 262 l4 4 l6 -8" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <circle cx="527" cy="262" r="11" fill="#dafbe1" stroke="#1a7f37"/>
  <path d="M522 262 l4 4 l6 -8" fill="none" stroke="#1a7f37" stroke-width="2"/>
  <circle cx="674" cy="262" r="11" fill="#dafbe1" stroke="#1a7f37"/>
  <path d="M669 262 l4 4 l6 -8" fill="none" stroke="#1a7f37" stroke-width="2"/>

  <text x="86" y="290" font-size="10.5" fill="#1a7f37" text-anchor="middle">커밋</text>
  <text x="233" y="290" font-size="10.5" fill="#1a7f37" text-anchor="middle">커밋</text>
  <text x="380" y="290" font-size="10.5" fill="#1a7f37" text-anchor="middle">커밋</text>
  <text x="527" y="290" font-size="10.5" fill="#1a7f37" text-anchor="middle">커밋</text>
  <text x="674" y="290" font-size="10.5" fill="#1a7f37" text-anchor="middle">커밋</text>

  <text x="24" y="320" font-size="12" fill="#57606a">커밋 메시지는 '오후 작업'이 아니라 '신청이 저장된다'처럼 눈으로 확인한 결과로 쓴다.</text>
</svg>
