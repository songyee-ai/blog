<svg viewBox="0 0 760 424" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">MVP의 기준은 기능 수가 아니라 '끝까지 되는가'</text>
  <text x="24" y="50" font-size="12" fill="#57606a">작아도 한 사람이 한 가지 일을 처음부터 끝까지 해내면 MVP다. 부분만 완벽하면 아직 아무 일도 끝나지 않는다.</text>

  <!-- Row A -->
  <rect x="24" y="68" width="712" height="150" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="40" y="82" width="200" height="22" rx="11" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="140" y="97" font-size="11.5" fill="#1a7f37" text-anchor="middle">이렇게 — 매 단계 탈 수 있다</text>

  <rect x="186" y="146" width="68" height="7" rx="3.5" fill="#1a7f37"/>
  <circle cx="200" cy="161" r="6" fill="#1a7f37"/>
  <circle cx="240" cy="161" r="6" fill="#1a7f37"/>
  <text x="220" y="190" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">스케이트보드</text>
  <text x="220" y="207" font-size="11" fill="#1a7f37" text-anchor="middle">탈 수 있음</text>

  <line x1="280" y1="150" x2="330" y2="150" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="338,150 328,145 328,155" fill="#57606a"/>

  <circle cx="380" cy="154" r="14" fill="none" stroke="#1a7f37" stroke-width="3"/>
  <circle cx="420" cy="154" r="14" fill="none" stroke="#1a7f37" stroke-width="3"/>
  <path d="M380 154 L398 132 L420 154 M398 132 L402 154" fill="none" stroke="#1a7f37" stroke-width="2.5"/>
  <line x1="396" y1="130" x2="412" y2="128" stroke="#1a7f37" stroke-width="2.5"/>
  <text x="400" y="190" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">자전거</text>
  <text x="400" y="207" font-size="11" fill="#1a7f37" text-anchor="middle">탈 수 있음</text>

  <line x1="460" y1="150" x2="510" y2="150" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="518,150 508,145 508,155" fill="#57606a"/>

  <rect x="546" y="140" width="68" height="21" rx="6" fill="#1a7f37"/>
  <rect x="562" y="127" width="32" height="14" rx="5" fill="#1a7f37"/>
  <circle cx="562" cy="164" r="7" fill="#1f2328"/>
  <circle cx="598" cy="164" r="7" fill="#1f2328"/>
  <text x="580" y="190" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">자동차</text>
  <text x="580" y="207" font-size="11" fill="#1a7f37" text-anchor="middle">탈 수 있음</text>

  <!-- Row B -->
  <rect x="24" y="232" width="712" height="150" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="40" y="246" width="216" height="22" rx="11" fill="#fff8c5" stroke="#bc4c00"/>
  <text x="148" y="261" font-size="11.5" fill="#bc4c00" text-anchor="middle">이렇게 말고 — 완성 전엔 못 탄다</text>

  <circle cx="220" cy="312" r="17" fill="none" stroke="#57606a" stroke-width="9"/>
  <circle cx="220" cy="312" r="4.5" fill="#57606a"/>
  <text x="220" y="352" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">타이어</text>
  <text x="220" y="369" font-size="11" fill="#cf222e" text-anchor="middle">못 탐</text>

  <line x1="280" y1="312" x2="330" y2="312" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="338,312 328,307 328,317" fill="#57606a"/>

  <rect x="366" y="296" width="68" height="24" rx="4" fill="none" stroke="#57606a" stroke-width="3"/>
  <line x1="366" y1="308" x2="434" y2="308" stroke="#57606a" stroke-width="2"/>
  <circle cx="382" cy="326" r="7" fill="#1f2328"/>
  <circle cx="418" cy="326" r="7" fill="#1f2328"/>
  <text x="400" y="352" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">타이어 + 차체</text>
  <text x="400" y="369" font-size="11" fill="#cf222e" text-anchor="middle">못 탐</text>

  <line x1="460" y1="312" x2="510" y2="312" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="518,312 508,307 508,317" fill="#57606a"/>

  <rect x="546" y="302" width="68" height="21" rx="6" fill="#1a7f37"/>
  <rect x="562" y="289" width="32" height="14" rx="5" fill="#1a7f37"/>
  <circle cx="562" cy="326" r="7" fill="#1f2328"/>
  <circle cx="598" cy="326" r="7" fill="#1f2328"/>
  <text x="580" y="352" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">자동차</text>
  <text x="580" y="369" font-size="11" fill="#57606a" text-anchor="middle">완성해서야 탈 수 있음</text>

  <text x="24" y="406" font-size="12" fill="#57606a">첫 조각을 고를 때 묻는 것 — "이 기능을 빼도 사용자가 원한 결과를 끝까지 얻나?"</text>
</svg>
