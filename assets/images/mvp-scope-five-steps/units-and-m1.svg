<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">단위를 잘게 쪼갠 대가, 그리고 M1의 위치</text>
  <text x="24" y="50" font-size="12" fill="#57606a">쪼개기 자체는 규율이다. 다만 쪼개는 대상이 크면 단위 수만 늘어난다.</text>

  <rect x="24" y="70" width="154" height="46" rx="8" fill="#fff8c5" stroke="#bc4c00"/>
  <text x="101" y="98" font-size="12" fill="#1f2328" text-anchor="middle">범위가 넓다</text>
  <line x1="184" y1="93" x2="200" y2="93" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="206,93 196,88 196,98" fill="#57606a"/>

  <rect x="210" y="70" width="154" height="46" rx="8" fill="#fff8c5" stroke="#bc4c00"/>
  <text x="287" y="98" font-size="12" fill="#1f2328" text-anchor="middle">단위가 33개</text>
  <line x1="370" y1="93" x2="386" y2="93" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="392,93 382,88 382,98" fill="#57606a"/>

  <rect x="396" y="70" width="154" height="46" rx="8" fill="#fff8c5" stroke="#bc4c00"/>
  <text x="473" y="90" font-size="12" fill="#1f2328" text-anchor="middle">세션마다</text>
  <text x="473" y="107" font-size="12" fill="#1f2328" text-anchor="middle">문서를 다시 읽음</text>
  <line x1="556" y1="93" x2="572" y2="93" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="578,93 568,88 568,98" fill="#57606a"/>

  <rect x="582" y="70" width="154" height="46" rx="8" fill="#ffe3e3" stroke="#cf222e"/>
  <text x="659" y="98" font-size="12" font-weight="700" fill="#cf222e" text-anchor="middle">토큰 소모 가속</text>

  <text x="24" y="146" font-size="11.5" fill="#57606a">끊는 곳 — 명세는 저장소 밖에 두고, 다음 세션의 진입점을 상태 파일 하나로 줄인다.</text>

  <line x1="24" y1="170" x2="736" y2="170" stroke="#d0d7de"/>

  <text x="24" y="200" font-size="12.5" font-weight="700" fill="#1f2328">33단위와 마일스톤 — 쓸 수 있게 되는 지점은 끝이 아니다</text>

  <text x="260" y="248" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">지금 11 / 33</text>
  <line x1="260" y1="256" x2="260" y2="266" stroke="#0969da" stroke-width="1.5"/>
  <text x="480" y="248" font-size="11.5" fill="#8250df" text-anchor="middle">M2 · 요약서</text>
  <line x1="480" y1="256" x2="480" y2="266" stroke="#8250df" stroke-width="1.5"/>
  <text x="700" y="248" font-size="11.5" fill="#57606a" text-anchor="middle">U33 완료</text>
  <line x1="700" y1="256" x2="700" y2="266" stroke="#57606a" stroke-width="1.5"/>

  <line x1="60" y1="278" x2="700" y2="278" stroke="#d0d7de" stroke-width="6" stroke-linecap="round"/>
  <line x1="60" y1="278" x2="260" y2="278" stroke="#0969da" stroke-width="6" stroke-linecap="round"/>

  <circle cx="260" cy="278" r="7" fill="#0969da"/>
  <circle cx="380" cy="278" r="9" fill="#dafbe1" stroke="#1a7f37" stroke-width="2.5"/>
  <circle cx="480" cy="278" r="6" fill="#8250df"/>
  <circle cx="620" cy="278" r="6" fill="#8250df"/>
  <circle cx="700" cy="278" r="6" fill="#57606a"/>

  <text x="60" y="302" font-size="10.5" fill="#57606a">U01</text>

  <line x1="380" y1="290" x2="380" y2="300" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="380" y="318" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">M1 · U17 — 자기 사용 시작</text>
  <line x1="620" y1="290" x2="620" y2="300" stroke="#8250df" stroke-width="1.5"/>
  <text x="620" y="318" font-size="11.5" fill="#8250df" text-anchor="middle">M3 · 2인 공동 기록</text>

  <text x="24" y="356" font-size="12" fill="#57606a">33은 완성까지의 전체 목록이고, 매일 쓸 수 있게 되는 지점은 U17이다. 지금 위치에서 여섯 단위 남았다.</text>
</svg>
