<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">규칙은 화면이 아니라 DB에서 강제한다</text>
  <text x="24" y="50" font-size="12" fill="#57606a">정원 10명, 마지막 한 자리에 열 명이 동시에 신청을 누른다.</text>

  <!-- left panel -->
  <rect x="24" y="68" width="344" height="266" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="40" y="82" width="180" height="22" rx="11" fill="#ffe3e3" stroke="#cf222e"/>
  <text x="130" y="97" font-size="11.5" fill="#cf222e" text-anchor="middle">화면에서 세고 나서 저장</text>

  <circle cx="60" cy="130" r="7" fill="#57606a"/>
  <circle cx="78" cy="130" r="7" fill="#57606a"/>
  <circle cx="96" cy="130" r="7" fill="#57606a"/>
  <text x="112" y="134" font-size="11.5" fill="#57606a">… 동시에 10명</text>

  <line x1="60" y1="146" x2="60" y2="158" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="60,164 55,154 65,154" fill="#57606a"/>

  <rect x="40" y="166" width="312" height="32" rx="6" fill="none" stroke="#cf222e"/>
  <text x="52" y="186" font-size="11.5" fill="#1f2328">① 남은 자리를 센다 — "1자리 남았다"</text>

  <line x1="60" y1="198" x2="60" y2="210" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="60,216 55,206 65,206" fill="#57606a"/>

  <rect x="40" y="218" width="312" height="32" rx="6" fill="none" stroke="#cf222e"/>
  <text x="52" y="238" font-size="11.5" fill="#1f2328">② 신청을 넣는다</text>

  <text x="40" y="270" font-size="11.5" fill="#cf222e">①과 ② 사이에 다른 아홉 명도 ①을 통과한다</text>

  <rect x="40" y="282" width="312" height="38" rx="6" fill="#ffe3e3" stroke="#cf222e"/>
  <text x="196" y="306" font-size="13" font-weight="700" fill="#cf222e" text-anchor="middle">정원 10 → 11명. 규칙이 뚫린다</text>

  <!-- right panel -->
  <rect x="392" y="68" width="344" height="266" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="408" y="82" width="196" height="22" rx="11" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="506" y="97" font-size="11.5" fill="#1a7f37" text-anchor="middle">DB 함수 한 번에 조건부 저장</text>

  <circle cx="428" cy="130" r="7" fill="#57606a"/>
  <circle cx="446" cy="130" r="7" fill="#57606a"/>
  <circle cx="464" cy="130" r="7" fill="#57606a"/>
  <text x="480" y="134" font-size="11.5" fill="#57606a">… 동시에 10명</text>

  <line x1="428" y1="146" x2="428" y2="158" stroke="#57606a" stroke-width="1.5"/>
  <polygon points="428,164 423,154 433,154" fill="#57606a"/>

  <rect x="408" y="166" width="312" height="84" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="420" y="190" font-size="11.5" font-weight="700" fill="#1a7f37">DB 함수 안에서 한 번에</text>
  <text x="420" y="212" font-size="11.5" fill="#1f2328">"현재 신청 수 &lt; 정원 이면 넣는다"</text>
  <text x="420" y="234" font-size="11.5" fill="#57606a">세는 것과 넣는 것이 쪼개지지 않는다</text>

  <text x="408" y="270" font-size="11.5" fill="#1a7f37">신청은 무조건 이 함수를 거친다</text>

  <rect x="408" y="282" width="312" height="38" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="564" y="306" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle">1건 성공 · 9건 거절. 정원 10 유지</text>

  <text x="24" y="368" font-size="12" fill="#57606a">확인은 눈으로 한다 — AI에게 동시 신청 테스트를 만들어 돌리게 하고, 로그를 직접 읽는다.</text>
  <text x="24" y="388" font-size="12" fill="#57606a">관리자 권한도 같은 원리다. 화면에서 버튼을 숨기는 것은 보안이 아니다.</text>
</svg>
