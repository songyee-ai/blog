<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="표준이 없으면 연결이 M곱하기N개가 되지만 MCP를 따르면 M더하기N개로 줄어드는 구조" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#cf222e">표준이 없으면 — 전용 연결을 일일이 만든다</text>
  <text x="480" y="32" font-size="15" font-weight="700" fill="#1a7f37">MCP를 따르면 — 규격 하나만 맞추면 된다</text>

  <!-- 왼쪽: M x N -->
  <rect x="30" y="48" width="410" height="300" rx="10" fill="#f6f8fa" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="48" y="94" width="106" height="44" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="101" y="121" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">AI 도구 1</text>
  <rect x="48" y="176" width="106" height="44" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="101" y="203" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">AI 도구 2</text>
  <rect x="48" y="258" width="106" height="44" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="101" y="285" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">AI 도구 3</text>

  <rect x="306" y="76" width="118" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="100" font-size="10.5" fill="#1f2328" text-anchor="middle">내 DB</text>
  <rect x="306" y="130" width="118" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="154" font-size="10.5" fill="#1f2328" text-anchor="middle">파일시스템</text>
  <rect x="306" y="184" width="118" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="208" font-size="10.5" fill="#1f2328" text-anchor="middle">GitHub</text>
  <rect x="306" y="238" width="118" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="262" font-size="10.5" fill="#1f2328" text-anchor="middle">Notion</text>

  <g stroke="#cf222e" stroke-width="1" opacity="0.55">
    <line x1="158" y1="116" x2="302" y2="95"/><line x1="158" y1="116" x2="302" y2="149"/>
    <line x1="158" y1="116" x2="302" y2="203"/><line x1="158" y1="116" x2="302" y2="257"/>
    <line x1="158" y1="198" x2="302" y2="95"/><line x1="158" y1="198" x2="302" y2="149"/>
    <line x1="158" y1="198" x2="302" y2="203"/><line x1="158" y1="198" x2="302" y2="257"/>
    <line x1="158" y1="280" x2="302" y2="95"/><line x1="158" y1="280" x2="302" y2="149"/>
    <line x1="158" y1="280" x2="302" y2="203"/><line x1="158" y1="280" x2="302" y2="257"/>
  </g>

  <text x="235" y="324" font-size="13" font-weight="700" fill="#cf222e" text-anchor="middle">3 × 4 = 연결 12개를 각각 만들어야 한다</text>

  <!-- 오른쪽: M + N -->
  <rect x="470" y="48" width="400" height="300" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="488" y="94" width="100" height="44" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="538" y="121" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">AI 도구 1</text>
  <rect x="488" y="176" width="100" height="44" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="538" y="203" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">AI 도구 2</text>
  <rect x="488" y="258" width="100" height="44" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="538" y="285" font-size="11" font-weight="700" fill="#1f2328" text-anchor="middle">AI 도구 3</text>

  <rect x="628" y="86" width="66" height="224" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="661" y="186" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle" transform="rotate(-90 661 186)">MCP 규격</text>

  <rect x="736" y="76" width="118" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="795" y="100" font-size="10.5" fill="#1f2328" text-anchor="middle">내 DB</text>
  <rect x="736" y="130" width="118" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="795" y="154" font-size="10.5" fill="#1f2328" text-anchor="middle">파일시스템</text>
  <rect x="736" y="184" width="118" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="795" y="208" font-size="10.5" fill="#1f2328" text-anchor="middle">GitHub</text>
  <rect x="736" y="238" width="118" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="795" y="262" font-size="10.5" fill="#1f2328" text-anchor="middle">Notion</text>

  <g stroke="#1a7f37" stroke-width="1.5">
    <line x1="592" y1="116" x2="624" y2="140"/>
    <line x1="592" y1="198" x2="624" y2="198"/>
    <line x1="592" y1="280" x2="624" y2="256"/>
    <line x1="698" y1="140" x2="732" y2="95"/>
    <line x1="698" y1="170" x2="732" y2="149"/>
    <line x1="698" y1="212" x2="732" y2="203"/>
    <line x1="698" y1="250" x2="732" y2="257"/>
  </g>

  <text x="670" y="324" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle">3 + 4 = 구현 7개면 끝난다</text>

  <line x1="30" y1="366" x2="870" y2="366" stroke="#d0d7de"/>
  <text x="30" y="394" font-size="12" fill="#1f2328"><tspan font-weight="700">USB-C 비유가 여기서 나온다.</tspan> 예전엔 기기마다 충전기가 달랐지만, 규격을 통일하니 아무 기기나 아무 충전기에 꽂힌다.</text>
  <text x="30" y="420" font-size="12" fill="#bc4c00">다만 <tspan font-weight="700">플러그 모양이 같다고 모든 기기가 같은 권한을 갖는 것은 아니다.</tspan> MCP는 연결 규칙이지 안전 보장이 아니다.</text>
  <text x="30" y="442" font-size="12" fill="#57606a">그래서 처음에는 "읽기" 도구부터 연결하고, 쓰기·삭제처럼 되돌리기 어려운 권한에는 승인 과정을 둔다.</text>
  <text x="30" y="464" font-size="12" fill="#57606a">그리고 서버를 여러 개 붙일수록 설명서를 미리 읽어 두는 부담(토큰)이 커진다 — 이게 요즘 지적되는 단점이다.</text>
</svg>
