<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="내가 만든 explainer 스킬의 5단계 고정 출력과, 용어가 쌓이면 지도가 되는 구조" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="e-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
  </defs>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1f2328">내가 만든 스킬 — 단어 하나만 던지면 항상 같은 5단계로 돌아온다</text>

  <!-- 입력 -->
  <rect x="30" y="52" width="150" height="70" rx="8" fill="#1f2328"/>
  <text x="105" y="82" font-size="10" fill="#8b949e" text-anchor="middle">입력은 이것뿐</text>
  <text x="105" y="105" font-size="14" font-family="Consolas,monospace" fill="#7ee787" text-anchor="middle">스키마</text>

  <line x1="186" y1="87" x2="216" y2="87" stroke="#0969da" stroke-width="2" marker-end="url(#e-ar)"/>

  <!-- 5단계 -->
  <rect x="224" y="46" width="646" height="82" rx="8" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="240" y="68" font-size="11.5" font-weight="700" fill="#0969da">고정된 출력 구조</text>

  <rect x="240" y="78" width="118" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="299" y="95" font-size="10" font-weight="700" fill="#1f2328" text-anchor="middle">1. 한 줄 정의</text>
  <text x="299" y="110" font-size="9" fill="#57606a" text-anchor="middle">초등학생도 통하게</text>

  <rect x="366" y="78" width="118" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="425" y="95" font-size="10" font-weight="700" fill="#1f2328" text-anchor="middle">2. 비유</text>
  <text x="425" y="110" font-size="9" fill="#57606a" text-anchor="middle">저금통·충전기</text>

  <rect x="492" y="78" width="118" height="38" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="551" y="95" font-size="10" font-weight="700" fill="#1a7f37" text-anchor="middle">3. 이 분야에서는</text>
  <text x="551" y="110" font-size="9" fill="#57606a" text-anchor="middle">가장 길게 — 핵심</text>

  <rect x="618" y="78" width="118" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="677" y="95" font-size="10" font-weight="700" fill="#1f2328" text-anchor="middle">4. 예시</text>
  <text x="677" y="110" font-size="9" fill="#57606a" text-anchor="middle">한국어 주석 코드</text>

  <rect x="744" y="78" width="110" height="38" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="799" y="95" font-size="10" font-weight="700" fill="#1f2328" text-anchor="middle">5. 다른 뜻</text>
  <text x="799" y="110" font-size="9" fill="#57606a" text-anchor="middle">마지막에 짧게</text>

  <!-- 없앤 불편 -->
  <text x="30" y="164" font-size="13" font-weight="700" fill="#1f2328">이 구조가 없앤 불편</text>

  <rect x="30" y="180" width="270" height="70" rx="8" fill="none" stroke="#cf222e" stroke-width="1.5"/>
  <text x="165" y="204" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="middle">매번 같은 요청을 다시 타이핑</text>
  <text x="165" y="226" font-size="10" fill="#57606a" text-anchor="middle">"쉽게, 비유도, 예시도, 근데</text>
  <text x="165" y="242" font-size="10" fill="#57606a" text-anchor="middle">에이전트 쪽 의미로…"</text>

  <rect x="315" y="180" width="270" height="70" rx="8" fill="none" stroke="#cf222e" stroke-width="1.5"/>
  <text x="450" y="204" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="middle">답변 형식이 매번 다름</text>
  <text x="450" y="226" font-size="10" fill="#57606a" text-anchor="middle">어떤 날은 정의만 길게,</text>
  <text x="450" y="242" font-size="10" fill="#57606a" text-anchor="middle">어떤 날은 코드만 잔뜩</text>

  <rect x="600" y="180" width="270" height="70" rx="8" fill="none" stroke="#cf222e" stroke-width="1.5"/>
  <text x="735" y="204" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="middle">엉뚱한 분야로 튐</text>
  <text x="735" y="226" font-size="10" fill="#57606a" text-anchor="middle">"하네스"를 물으면</text>
  <text x="735" y="242" font-size="10" fill="#57606a" text-anchor="middle">등산 장비 이야기가 먼저</text>

  <line x1="30" y1="276" x2="870" y2="276" stroke="#d0d7de"/>

  <!-- 지도 -->
  <text x="30" y="304" font-size="15" font-weight="700" fill="#8250df">그리고 진짜 이유 — 낱개 단어가 아니라 지도가 남는다</text>
  <text x="30" y="326" font-size="11.5" fill="#57606a">같은 대화에서 앞서 설명한 용어를 기억해 새 용어와 이어 붙인다. 다섯 번째쯤 되면 이런 그림이 나온다.</text>

  <rect x="120" y="344" width="660" height="150" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
  <text x="140" y="368" font-size="11.5" font-weight="700" fill="#8250df">하네스 (전체 껍데기)</text>

  <rect x="160" y="382" width="130" height="40" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
  <text x="225" y="407" font-size="11" font-weight="700" fill="#0969da" text-anchor="middle">모델</text>

  <rect x="320" y="382" width="130" height="40" rx="6" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="385" y="407" font-size="11" font-weight="700" fill="#8250df" text-anchor="middle">루프</text>

  <rect x="480" y="382" width="130" height="40" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="545" y="407" font-size="11" font-weight="700" fill="#1a7f37" text-anchor="middle">도구 실행</text>

  <line x1="294" y1="402" x2="316" y2="402" stroke="#57606a" stroke-width="1.5"/>
  <line x1="454" y1="402" x2="476" y2="402" stroke="#57606a" stroke-width="1.5"/>

  <line x1="545" y1="426" x2="545" y2="442" stroke="#57606a" stroke-width="1.5"/>
  <rect x="460" y="446" width="170" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="545" y="468" font-size="10.5" fill="#1f2328" text-anchor="middle">MCP 서버 · CLI 명령</text>

  <rect x="650" y="382" width="112" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="706" y="407" font-size="10.5" fill="#1f2328" text-anchor="middle">스키마</text>

  <rect x="650" y="446" width="112" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="706" y="468" font-size="10.5" fill="#1f2328" text-anchor="middle">SQLite (기억)</text>

  <line x1="706" y1="426" x2="706" y2="442" stroke="#57606a" stroke-width="1.5"/>
  <line x1="614" y1="402" x2="646" y2="402" stroke="#57606a" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="30" y="524" font-size="12" fill="#1f2328">6회차의 <tspan font-weight="700">스키마·SQLite</tspan>, 7회차의 <tspan font-weight="700">하네스·MCP</tspan>가 따로 배운 단어가 아니라 한 그림에서 맞물린다는 것 — 이게 이 스킬을 만든 이유다.</text>
</svg>
