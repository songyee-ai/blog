<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="에이전트는 모델을 하네스가 감싼 구조이며, 계획 실행 관찰 반성 루프를 반복한다" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="h-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="h-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
  </defs>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1f2328">에이전트 = 모델 + 하네스</text>
  <text x="500" y="32" font-size="15" font-weight="700" fill="#8250df">그리고 하네스가 이 루프를 돌린다</text>

  <!-- 하네스 -->
  <rect x="30" y="48" width="430" height="308" rx="10" fill="#f6f8fa" stroke="#1f2328" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="46" y="70" font-size="12.5" font-weight="700" fill="#1f2328">하네스 — 지능을 감싸 실제로 일하게 만드는 껍데기</text>

  <rect x="120" y="84" width="250" height="72" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="245" y="112" font-size="13" font-weight="700" fill="#0969da" text-anchor="middle">모델 — 지능</text>
  <text x="245" y="133" font-size="10.5" fill="#57606a" text-anchor="middle">트랜스포머 구조로 언어·코드를 다룬다</text>
  <text x="245" y="149" font-size="10" fill="#57606a" text-anchor="middle">이것만으로는 아무것도 못 한다</text>

  <line x1="245" y1="160" x2="245" y2="182" stroke="#57606a" stroke-width="2" marker-end="url(#h-ar)"/>

  <rect x="48" y="190" width="190" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="143" y="213" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">파일 읽기·쓰기</text>
  <text x="143" y="232" font-size="10" fill="#57606a" text-anchor="middle">코드를 직접 고친다</text>

  <rect x="252" y="190" width="190" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="347" y="213" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">터미널 명령 실행</text>
  <text x="347" y="232" font-size="10" fill="#57606a" text-anchor="middle">돌려 보고 결과를 본다</text>

  <rect x="48" y="256" width="190" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="143" y="279" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">검색 · MCP 연결</text>
  <text x="143" y="298" font-size="10" fill="#57606a" text-anchor="middle">내 데이터에 닿는다</text>

  <rect x="252" y="256" width="190" height="56" rx="6" fill="#fff8c5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="347" y="279" font-size="11.5" font-weight="700" fill="#bc4c00" text-anchor="middle">권한 승인 · 안전장치</text>
  <text x="347" y="298" font-size="10" fill="#57606a" text-anchor="middle">사람이 멈출 수 있게</text>

  <text x="245" y="336" font-size="11" fill="#1f2328" text-anchor="middle">같은 모델이라도 <tspan font-weight="700">하네스에 따라 결과가 크게 달라진다</tspan></text>

  <!-- 루프 -->
  <rect x="530" y="48" width="290" height="52" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="675" y="70" font-size="12" font-weight="700" fill="#8250df" text-anchor="middle">계획 (Plan)</text>
  <text x="675" y="88" font-size="10" fill="#57606a" text-anchor="middle">큰 목표를 작은 일로 쪼갠다</text>

  <line x1="675" y1="104" x2="675" y2="116" stroke="#8250df" stroke-width="2" marker-end="url(#h-loop)"/>

  <rect x="530" y="120" width="290" height="52" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="675" y="142" font-size="12" font-weight="700" fill="#8250df" text-anchor="middle">실행 (Act)</text>
  <text x="675" y="160" font-size="10" fill="#57606a" text-anchor="middle">파일을 고치고 명령을 돌린다</text>

  <line x1="675" y1="176" x2="675" y2="188" stroke="#8250df" stroke-width="2" marker-end="url(#h-loop)"/>

  <rect x="530" y="192" width="290" height="52" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="675" y="214" font-size="12" font-weight="700" fill="#8250df" text-anchor="middle">관찰 (Observe)</text>
  <text x="675" y="232" font-size="10" fill="#57606a" text-anchor="middle">에러가 났나, 됐나 — 사실을 본다</text>

  <line x1="675" y1="248" x2="675" y2="260" stroke="#8250df" stroke-width="2" marker-end="url(#h-loop)"/>

  <rect x="530" y="264" width="290" height="52" rx="8" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="675" y="286" font-size="12" font-weight="700" fill="#8250df" text-anchor="middle">반성 (Reflect)</text>
  <text x="675" y="304" font-size="10" fill="#57606a" text-anchor="middle">됐는지 판단하고, 아니면 다시</text>

  <path d="M526,290 L500,290 L500,74 L526,74" fill="none" stroke="#8250df" stroke-width="2.5" marker-end="url(#h-loop)"/>
  <text x="675" y="340" font-size="11" fill="#1f2328" text-anchor="middle">목표를 이룰 때까지 반복 — <tspan font-weight="700">이 루프가 챗봇과의 결정적 차이</tspan></text>

  <line x1="30" y1="376" x2="870" y2="376" stroke="#d0d7de"/>
  <text x="30" y="404" font-size="12" fill="#1f2328">챗봇은 한 번 묻고 한 번 답하면 끝난다. 에이전트는 <tspan font-weight="700">결과를 보고 다음 수를 스스로 정하기를</tspan> 되풀이한다.</text>
  <text x="30" y="428" font-size="12" fill="#57606a">그래서 좋은 지시는 "고쳐 줘"에서 끝나지 않는다 — "먼저 오류를 확인하고, 수정 뒤에는 테스트를 돌려 결과를 보고해 줘"처럼</text>
  <text x="30" y="448" font-size="12" fill="#57606a">관찰 지점을 함께 요구한다. 추측을 검증 가능한 증거로 바꾸는 것이 이 루프의 핵심이다.</text>
</svg>
