<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="SKILL.md의 머리말과 본문 구조, 그리고 평소에는 머리말만 읽고 필요할 때만 본문을 펼치는 점진 공개" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="sk-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#1f2328">SKILL.md는 대시 세 개로 나뉜다</text>

  <!-- 파일 구조 -->
  <rect x="30" y="48" width="400" height="256" rx="8" fill="#1f2328"/>
  <text x="46" y="74" font-size="11.5" font-family="Consolas,monospace" fill="#ff7b72">---</text>
  <text x="46" y="98" font-size="11.5" font-family="Consolas,monospace" fill="#79c0ff">name:</text>
  <text x="106" y="98" font-size="11.5" font-family="Consolas,monospace" fill="#e6edf3">explainer</text>
  <text x="46" y="122" font-size="11.5" font-family="Consolas,monospace" fill="#79c0ff">description:</text>
  <text x="46" y="142" font-size="11.5" font-family="Consolas,monospace" fill="#e6edf3">  용어를 5단계로 설명할 때 사용...</text>
  <text x="46" y="166" font-size="11.5" font-family="Consolas,monospace" fill="#ff7b72">---</text>

  <line x1="46" y1="184" x2="414" y2="184" stroke="#484f58" stroke-dasharray="4 3"/>

  <text x="46" y="208" font-size="11.5" font-family="Consolas,monospace" fill="#8b949e"># 본문 — 실제 지시</text>
  <text x="46" y="230" font-size="11.5" font-family="Consolas,monospace" fill="#e6edf3">1. 한 줄 정의를 쓴다</text>
  <text x="46" y="250" font-size="11.5" font-family="Consolas,monospace" fill="#e6edf3">2. 비유로 이해시킨다</text>
  <text x="46" y="270" font-size="11.5" font-family="Consolas,monospace" fill="#e6edf3">3. ...</text>
  <text x="46" y="292" font-size="11" font-family="Consolas,monospace" fill="#8b949e">(길어도 상관없다)</text>

  <rect x="452" y="60" width="120" height="112" rx="6" fill="#fff8c5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="512" y="98" font-size="11.5" font-weight="700" fill="#bc4c00" text-anchor="middle">머리말</text>
  <text x="512" y="120" font-size="10" fill="#57606a" text-anchor="middle">이름과 설명</text>
  <text x="512" y="140" font-size="10" font-weight="700" fill="#bc4c00" text-anchor="middle">30~50 토큰</text>
  <text x="512" y="158" font-size="10" fill="#57606a" text-anchor="middle">항상 읽는다</text>

  <rect x="452" y="188" width="120" height="112" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="512" y="226" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">본문</text>
  <text x="512" y="248" font-size="10" fill="#57606a" text-anchor="middle">실제 지시 전체</text>
  <text x="512" y="268" font-size="10" font-weight="700" fill="#0969da" text-anchor="middle">필요할 때만</text>
  <text x="512" y="286" font-size="10" fill="#57606a" text-anchor="middle">펼쳐 읽는다</text>

  <!-- 점진 공개 -->
  <text x="600" y="32" font-size="15" font-weight="700" fill="#1a7f37">점진 공개 — 그래서 켜 둬도 거의 공짜다</text>

  <rect x="600" y="60" width="270" height="108" rx="8" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="616" y="84" font-size="12" font-weight="700" fill="#1f2328">평소</text>
  <text x="616" y="106" font-size="10.5" fill="#57606a">스킬 20개를 켜 둬도</text>
  <text x="616" y="124" font-size="10.5" fill="#57606a">이름과 한 줄 설명만 훑고 있다</text>
  <text x="616" y="148" font-size="11" font-weight="700" fill="#1a7f37">→ 느려지지 않는다</text>

  <line x1="735" y1="174" x2="735" y2="198" stroke="#1a7f37" stroke-width="2" marker-end="url(#sk-ar)"/>
  <text x="748" y="190" font-size="10" fill="#1a7f37">지금 하는 일과 맞으면</text>

  <rect x="600" y="204" width="270" height="96" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="616" y="228" font-size="12" font-weight="700" fill="#1a7f37">그때</text>
  <text x="616" y="250" font-size="10.5" fill="#57606a">본문 전체를 읽어 온다</text>
  <text x="616" y="270" font-size="10.5" fill="#57606a">필요한 스킬 하나만</text>
  <text x="616" y="292" font-size="11" font-weight="700" fill="#1a7f37">→ 그 순간에만 비용이 든다</text>

  <line x1="30" y1="324" x2="870" y2="324" stroke="#d0d7de"/>

  <rect x="30" y="342" width="840" height="66" rx="8" fill="#fff8c5" stroke="#bc4c00" stroke-width="2"/>
  <text x="450" y="368" font-size="13" font-weight="700" fill="#bc4c00" text-anchor="middle">그래서 description을 잘 쓰는 것이 스킬의 절반이다</text>
  <text x="450" y="392" font-size="11.5" fill="#57606a" text-anchor="middle">AI는 이 한 줄만 보고 "지금 이 스킬을 꺼낼까"를 판단한다. 여기가 부실하면 스킬이 있어도 발동하지 않는다.</text>

  <text x="30" y="440" font-size="12" fill="#1f2328"><tspan font-weight="700">규칙 파일</tspan>(AGENTS.md · CLAUDE.md)과는 다르다 — 규칙 파일은 대화를 시작할 때 <tspan font-weight="700">항상</tspan> 읽히는 상시 안내문이고,</text>
  <text x="30" y="462" font-size="12" fill="#1f2328">스킬은 선반에 얹어 두고 <tspan font-weight="700">필요할 때 꺼내 쓰는</tspan> 방법서다. 경쟁이 아니라 함께 쓴다.</text>
  <text x="30" y="486" font-size="12" fill="#57606a">주의: 스킬은 결국 'AI에게 주는 지시문'이라, 출처가 불분명한 것을 켜면 위험하다. 남의 스킬은 열어 보고 쓴다.</text>
</svg>
