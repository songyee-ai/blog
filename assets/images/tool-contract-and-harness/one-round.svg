<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">도구 호출 한 바퀴 — 모델은 요청만 쓰고, 실행은 하네스가 한다</text>
  <text x="24" y="50" font-size="12" fill="#57606a">빨간 글씨는 그 단계에서 생길 수 있는 실패. 예시는 실습 2의 재고 조회.</text>

  <g font-size="12">
    <rect x="24" y="74" width="220" height="112" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="40" y="98" font-size="14" font-weight="700" fill="#0969da">[1] 모델 — 요청 쓰기</text>
    <text x="40" y="120" fill="#1f2328">도구 설명을 읽고 고른다</text>
    <text x="40" y="140" fill="#57606a">get_inventory(</text>
    <text x="40" y="156" fill="#57606a">  A-17, BUSAN-02)</text>
    <text x="40" y="176" fill="#cf222e" font-weight="700">잘못 고름 (도구·인자)</text>

    <rect x="270" y="74" width="220" height="112" rx="10" fill="#fff8c5" stroke="#9a6700"/>
    <text x="286" y="98" font-size="14" font-weight="700" fill="#9a6700">[2] 하네스 — 확인·실행</text>
    <text x="286" y="120" fill="#1f2328">허용 목록? 인자 모양?</text>
    <text x="286" y="140" fill="#57606a">통과하면 실제로 실행하고</text>
    <text x="286" y="156" fill="#57606a">결과를 모델에게 돌려준다</text>
    <text x="286" y="176" fill="#57606a">{ 재고 7, 확인 시각 }</text>

    <rect x="516" y="74" width="220" height="112" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="532" y="98" font-size="14" font-weight="700" fill="#1a7f37">[3] 모델 — 결과 읽고 답</text>
    <text x="532" y="120" fill="#1f2328">돌아온 값을 근거로 쓴다</text>
    <text x="532" y="140" fill="#57606a">"부산 창고 A-17은</text>
    <text x="532" y="156" fill="#57606a">  7개입니다"</text>
    <text x="532" y="176" fill="#cf222e" font-weight="700">잘못 읽음 (수량·창고·시각)</text>

    <line x1="244" y1="130" x2="268" y2="130" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="490" y1="130" x2="514" y2="130" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="24" y="216" width="712" height="104" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="5 4"/>
    <text x="40" y="240" font-size="14" font-weight="700" fill="#1f2328">한 바퀴가 끝난 뒤 — 기록과 판정</text>
    <text x="40" y="264" fill="#1f2328">요청·인자·결과·답을 트레이스로 남기고, 실패했으면 다음 행동(질문·재시도 한 번·중단)을 정해 둔다</text>
    <text x="40" y="288" fill="#cf222e" font-weight="700">같은 실수 반복</text>
    <text x="150" y="288" fill="#57606a">— 기록도 멈출 조건도 없으면 같은 잘못된 요청을 또 보낸다</text>
    <text x="40" y="310" fill="#57606a">연쇄 호출: 결과를 읽고 다시 [1]로 돌아가 다음 요청을 쓸 수도 있다</text>
  </g>
</svg>
