<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">오류 없이 지나간 실패 — 설명문 한 문장이 호출을 바꿨다</text>
  <text x="24" y="50" font-size="12" fill="#57606a">qwen3.5:2b · temperature 0 · 같은 요청 "대구 창고의 A-17 재고를 알려 줘". 바뀐 것은 인자 설명 한 문장뿐.</text>

  <g font-size="12">
    <rect x="24" y="68" width="348" height="276" rx="12" fill="#ffebe9" stroke="#cf222e"/>
    <text x="40" y="94" font-size="14" font-weight="700" fill="#cf222e">원본 설명문 (trace-06)</text>
    <text x="40" y="114" fill="#57606a">"warehouse_id에는 SEOUL-01 또는</text>
    <text x="40" y="130" fill="#57606a">  BUSAN-02만 넣습니다"</text>

    <text x="40" y="164" font-weight="700" fill="#1f2328">[1] warehouse_id = BUSAN-02</text>
    <text x="40" y="182" fill="#57606a">대구를 목록 안의 값으로 바꿈</text>
    <text x="40" y="212" font-weight="700" fill="#1f2328">[2] 하네스 검사 통과 → 재고 7</text>
    <text x="40" y="230" fill="#57606a">값이 목록 안이라 막을 이유가 없다</text>
    <text x="40" y="260" font-weight="700" fill="#1f2328">[3] "가용 재고는 7개입니다"</text>
    <text x="40" y="278" fill="#57606a">대구를 물었는데 부산 재고로 답함</text>

    <text x="40" y="314" font-weight="700" fill="#1a7f37">스키마 준수 O</text>
    <text x="160" y="314" font-weight="700" fill="#cf222e">의미 일치 X</text>
    <text x="40" y="334" fill="#cf222e">그럴듯하지만 쓸 수 없는 답</text>

    <rect x="388" y="68" width="348" height="276" rx="12" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="404" y="94" font-size="14" font-weight="700" fill="#1a7f37">목록을 뺀 설명문 (trace-08)</text>
    <text x="404" y="114" fill="#57606a">"warehouse_id에는 사용자가 말한</text>
    <text x="404" y="130" fill="#57606a">  창고 코드를 넣습니다"</text>

    <text x="404" y="164" font-weight="700" fill="#1f2328">[1] warehouse_id = 대구창고</text>
    <text x="404" y="182" fill="#57606a">말한 그대로 넣음</text>
    <text x="404" y="212" font-weight="700" fill="#1f2328">[2] WAREHOUSE_NOT_ALLOWED</text>
    <text x="404" y="230" fill="#57606a">하네스가 막는다</text>
    <text x="404" y="260" font-weight="700" fill="#1f2328">[3] 확인할 수 없다며 되물음</text>
    <text x="404" y="278" fill="#57606a">수량을 지어내지 않음</text>

    <text x="404" y="314" font-weight="700" fill="#cf222e">스키마 준수 X</text>
    <text x="524" y="314" font-weight="700" fill="#1a7f37">의미 일치 O</text>
    <text x="404" y="334" fill="#1a7f37">막혔지만 안전한 답</text>
  </g>
</svg>
