<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="동기와 비동기의 시간 흐름 비교">
  <defs>
    <marker id="s-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <pattern id="wait" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#f6f8fa"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d0d7de" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="900" height="420" fill="none"/>

  <!-- 동기 -->
  <text x="30" y="46" font-size="15" font-weight="700" fill="#cf222e">동기 — 결과가 올 때까지 멈춰 서 있다</text>

  <rect x="30" y="66" width="150" height="58" rx="6" fill="#ffe3e3" stroke="#cf222e" stroke-width="1.5"/>
  <text x="105" y="92" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">주문한다</text>
  <text x="105" y="110" font-size="10" fill="#57606a" text-anchor="middle">(요청 보냄)</text>

  <rect x="186" y="66" width="330" height="58" rx="6" fill="url(#wait)" stroke="#cf222e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="200" y="74" width="302" height="42" rx="5" fill="#ffffff" opacity="0.88"/>
  <text x="351" y="92" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="middle">카운터 앞에서 기다린다</text>
  <text x="351" y="110" font-size="10" fill="#57606a" text-anchor="middle">이 시간 동안 아무 일도 못 한다</text>

  <rect x="522" y="66" width="150" height="58" rx="6" fill="#ffe3e3" stroke="#cf222e" stroke-width="1.5"/>
  <text x="597" y="92" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">커피를 받는다</text>
  <text x="597" y="110" font-size="10" fill="#57606a" text-anchor="middle">(응답 처리)</text>

  <rect x="678" y="66" width="192" height="58" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="774" y="99" font-size="11.5" fill="#57606a" text-anchor="middle">그제야 다음 일을 한다</text>

  <line x1="30" y1="152" x2="870" y2="152" stroke="#d0d7de"/>

  <!-- 비동기 -->
  <text x="30" y="196" font-size="15" font-weight="700" fill="#1a7f37">비동기 — 맡겨 두고 다른 일을 한다</text>

  <rect x="30" y="216" width="150" height="58" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="105" y="242" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">주문하고</text>
  <text x="105" y="260" font-size="10" fill="#57606a" text-anchor="middle">진동벨을 받는다</text>

  <rect x="186" y="216" width="160" height="58" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="266" y="249" font-size="11.5" fill="#1f2328" text-anchor="middle">자리에 앉아 일한다</text>

  <rect x="352" y="216" width="164" height="58" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="434" y="249" font-size="11.5" fill="#1f2328" text-anchor="middle">또 다른 일도 한다</text>

  <rect x="522" y="216" width="150" height="58" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="597" y="242" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">벨이 울리면</text>
  <text x="597" y="260" font-size="10" fill="#57606a" text-anchor="middle">그때 받으러 간다</text>

  <rect x="678" y="216" width="192" height="58" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="774" y="249" font-size="11.5" fill="#57606a" text-anchor="middle">계속 이어서 일한다</text>

  <!-- 대신 기다리는 주체 -->
  <path d="M180,290 L180,308 L522,308 L522,290" fill="none" stroke="#8250df" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="351" y="328" font-size="11" font-weight="700" fill="#8250df" text-anchor="middle">기다리는 일은 다른 쪽(브라우저·운영체제)이 대신 맡는다</text>

  <!-- 시간축 -->
  <line x1="30" y1="356" x2="860" y2="356" stroke="#57606a" stroke-width="1.5" marker-end="url(#s-ar)"/>
  <text x="30" y="376" font-size="11" fill="#57606a">시간 →</text>

  <text x="30" y="404" font-size="12" fill="#1f2328">핵심: 비동기라고 커피가 빨리 나오는 게 아니다. <tspan font-weight="700">기다리는 동안 멈춰 있지 않은 것</tspan>이다.</text>
</svg>
