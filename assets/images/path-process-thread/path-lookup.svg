<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="PATH에 등록된 폴더를 순서대로 탐색해 실행 파일을 찾는 과정">
  <defs>
    <marker id="p-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="p-ar-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <marker id="p-ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="none"/>

  <!-- 1. 명령 입력 -->
  <text x="30" y="70" font-size="12.5" font-weight="700" fill="#57606a">① 명령을 입력하면</text>
  <rect x="30" y="84" width="205" height="86" rx="8" fill="#1f2328"/>
  <text x="46" y="120" font-size="14" font-family="Consolas,monospace" fill="#7ee787">&gt; node -v</text>
  <text x="46" y="146" font-size="11" font-family="Consolas,monospace" fill="#8b949e">_</text>
  <text x="132" y="192" font-size="11" fill="#57606a" text-anchor="middle">셸은 'node'가</text>
  <text x="132" y="208" font-size="11" fill="#57606a" text-anchor="middle">어디 있는지 모른다</text>

  <line x1="240" y1="127" x2="278" y2="127" stroke="#57606a" stroke-width="2" marker-end="url(#p-ar)"/>

  <!-- 2. PATH 탐색 -->
  <text x="290" y="70" font-size="12.5" font-weight="700" fill="#57606a">② PATH에 적힌 폴더를 위에서부터 순서대로 뒤진다</text>
  <rect x="290" y="84" width="320" height="252" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 4"/>

  <rect x="304" y="100" width="292" height="42" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="316" y="119" font-size="11" font-family="Consolas,monospace" fill="#1f2328">C:\Windows\system32</text>
  <text x="316" y="135" font-size="10" fill="#57606a">여기엔 없다 → 다음 줄로</text>

  <rect x="304" y="152" width="292" height="52" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="316" y="172" font-size="11" font-family="Consolas,monospace" fill="#1f2328">C:\Program Files\nodejs\</text>
  <text x="316" y="190" font-size="10.5" font-weight="700" fill="#1a7f37">node.exe 발견 — 탐색 끝</text>
  <text x="584" y="167" font-size="9.5" fill="#57606a" text-anchor="end">시스템 변수</text>

  <rect x="304" y="214" width="292" height="46" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="316" y="233" font-size="11" font-family="Consolas,monospace" fill="#1f2328">C:\Users\...\AppData\Roaming\npm</text>
  <text x="316" y="250" font-size="10" fill="#57606a">npm 명령은 이 줄에서 찾아진다</text>
  <text x="584" y="228" font-size="9.5" fill="#57606a" text-anchor="end">사용자 변수</text>

  <text x="316" y="284" font-size="11" fill="#8b949e">…그 밖의 폴더들</text>
  <text x="304" y="316" font-size="10.5" fill="#57606a">사용자 변수와 시스템 변수는 합쳐져서 하나의 목록처럼 탐색된다.</text>

  <!-- 결과 -->
  <line x1="616" y1="178" x2="672" y2="178" stroke="#1a7f37" stroke-width="2" marker-end="url(#p-ar-g)"/>
  <rect x="680" y="140" width="190" height="76" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="775" y="168" font-size="12.5" font-weight="700" fill="#1a7f37" text-anchor="middle">찾으면 실행</text>
  <text x="775" y="192" font-size="11" font-family="Consolas,monospace" fill="#1f2328" text-anchor="middle">v22.x.x</text>

  <line x1="616" y1="290" x2="672" y2="290" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#p-ar-r)"/>
  <rect x="680" y="252" width="190" height="76" rx="8" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
  <text x="775" y="278" font-size="12.5" font-weight="700" fill="#cf222e" text-anchor="middle">끝까지 없으면</text>
  <text x="775" y="300" font-size="10.5" fill="#57606a" text-anchor="middle">"용어가 인식되지 않습니다"</text>
  <text x="775" y="317" font-size="10.5" fill="#57606a" text-anchor="middle">= 설치 실패가 아닐 수도 있다</text>

  <line x1="30" y1="358" x2="870" y2="358" stroke="#d0d7de"/>
  <text x="30" y="384" font-size="12" fill="#1f2328">PATH는 터미널이 <tspan font-weight="700">켜질 때 한 번</tspan> 읽힌다. 그래서 설치 직후에는 창을 새로 열어야 인식된다.</text>
</svg>
