<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="왼쪽은 에이전트 하나가 컨텍스트 하나에 모든 것을 쌓아 처음 질문이 밀리는 모습, 오른쪽은 리드가 두 워커에게 나눠 맡기고 결과만 받는 모습이다. 아래에 나누면 얻는 것과 커지는 것이 적혀 있다">
  <defs>
    <marker id="ma-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="ma-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
  </defs>
  <text x="20" y="34" font-size="16" font-weight="700" fill="#0969da">일을 나누면 컨텍스트가 여러 개가 된다</text>

  <!-- 왼쪽: 에이전트 하나 -->
  <rect x="20" y="56" width="340" height="256" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="190" y="84" font-size="15" font-weight="700" fill="#0969da" text-anchor="middle">에이전트 하나 · 컨텍스트 하나</text>
  <rect x="44" y="100" width="292" height="30" rx="6" fill="#ffffff" stroke="#d0d7de" opacity="0.55"/>
  <text x="190" y="120" font-size="13" fill="#57606a" text-anchor="middle" opacity="0.8">처음 질문 (점점 위로 밀린다)</text>
  <rect x="44" y="136" width="292" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="190" y="156" font-size="13" fill="#1f2328" text-anchor="middle">검색 결과 1</text>
  <rect x="44" y="172" width="292" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="190" y="192" font-size="13" fill="#1f2328" text-anchor="middle">중간 판단</text>
  <rect x="44" y="208" width="292" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="190" y="228" font-size="13" fill="#1f2328" text-anchor="middle">검색 결과 2</text>
  <rect x="44" y="244" width="292" height="30" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="190" y="264" font-size="13" fill="#1f2328" text-anchor="middle">검색 결과 3 …</text>
  <text x="190" y="298" font-size="13" fill="#0969da" text-anchor="middle">모든 것이 한곳에 쌓인다</text>

  <!-- 오른쪽: 여러 에이전트 -->
  <rect x="400" y="56" width="340" height="256" rx="10" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.5"/>
  <text x="570" y="84" font-size="15" font-weight="700" fill="#57606a" text-anchor="middle">여러 에이전트 · 컨텍스트 여러 개</text>
  <rect x="480" y="100" width="180" height="48" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="570" y="122" font-size="14" font-weight="700" fill="#bc4c00" text-anchor="middle">리드</text>
  <text x="570" y="140" font-size="13" fill="#bc4c00" text-anchor="middle">나누고 합친다</text>

  <rect x="420" y="206" width="140" height="74" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="490" y="234" font-size="14" font-weight="700" fill="#0969da" text-anchor="middle">워커 1</text>
  <text x="490" y="258" font-size="13" fill="#0969da" text-anchor="middle">자기 컨텍스트</text>
  <rect x="580" y="206" width="140" height="74" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="650" y="234" font-size="14" font-weight="700" fill="#0969da" text-anchor="middle">워커 2</text>
  <text x="650" y="258" font-size="13" fill="#0969da" text-anchor="middle">자기 컨텍스트</text>

  <line x1="530" y1="150" x2="474" y2="202" stroke="#0969da" stroke-width="2" marker-end="url(#ma-blue)"/>
  <line x1="610" y1="150" x2="666" y2="202" stroke="#0969da" stroke-width="2" marker-end="url(#ma-blue)"/>
  <line x1="510" y1="204" x2="552" y2="154" stroke="#6e7781" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ma-gray)"/>
  <line x1="630" y1="204" x2="588" y2="154" stroke="#6e7781" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ma-gray)"/>
  <text x="570" y="190" font-size="13" fill="#57606a" text-anchor="middle">결과만</text>
  <text x="570" y="298" font-size="13" fill="#57606a" text-anchor="middle">파란선: 맡김 · 회색 점선: 결과</text>

  <!-- 아래: 얻는 것과 커지는 것 -->
  <rect x="20" y="332" width="720" height="56" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="40" y="366" font-size="14" font-weight="700" fill="#1a7f37">얻는 것</text>
  <text x="120" y="366" font-size="14" fill="#1a7f37">병렬 탐색 · 관심사 분리 · 전문화</text>
  <rect x="20" y="398" width="720" height="56" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="40" y="432" font-size="14" font-weight="700" fill="#bc4c00">커지는 것</text>
  <text x="120" y="432" font-size="14" fill="#bc4c00">중복 · 누락 · 오류 전파 · 토큰 비용</text>
</svg>
