<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="OCR은 네 정거장을 한 방향으로 지난다. 전처리는 기울기를 바로잡고 흑백으로 정리하고, 검출은 글자가 있는 곳에 상자를 치고, 인식은 상자 속 그림을 문자열로 바꾸고, 레이아웃 분석은 문자열을 표와 문단 같은 구조로 묶는다. 뒤 정거장은 앞 정거장의 실수를 되돌리지 못한다">
  <defs>
    <marker id="ocr-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker>
  </defs>

  <!-- 입력 -->
  <text x="20" y="34" font-size="15" font-weight="700" fill="#0969da">스캔한 종이 사진 (픽셀뿐)</text>
  <text x="740" y="34" font-size="15" font-weight="700" fill="#1a7f37" text-anchor="end">구조가 있는 결과</text>

  <!-- 정거장 4개 -->
  <g>
    <rect x="20" y="56" width="160" height="220" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="40" y="84" font-size="13" fill="#57606a">1번 정거장</text>
    <text x="40" y="108" font-size="16" font-weight="700" fill="#0969da">전처리</text>
    <text x="40" y="140" font-size="13" fill="#57606a">삐뚤어진 걸</text>
    <text x="40" y="160" font-size="13" fill="#57606a">바로 세우고</text>
    <text x="40" y="180" font-size="13" fill="#57606a">흑백으로 정리,</text>
    <text x="40" y="200" font-size="13" fill="#57606a">얼룩 지우기</text>
    <text x="40" y="250" font-size="13" font-weight="700" fill="#1f2328">→ 깨끗한 흑백</text>
  </g>
  <g>
    <rect x="206" y="56" width="160" height="220" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="226" y="84" font-size="13" fill="#57606a">2번 정거장</text>
    <text x="226" y="108" font-size="16" font-weight="700" fill="#0969da">검출</text>
    <text x="226" y="140" font-size="13" fill="#57606a">글자가 어디</text>
    <text x="226" y="160" font-size="13" fill="#57606a">있는지 찾아</text>
    <text x="226" y="180" font-size="13" fill="#57606a">줄마다 상자</text>
    <text x="226" y="200" font-size="13" fill="#57606a">치기</text>
    <text x="226" y="250" font-size="13" font-weight="700" fill="#1f2328">→ 좌표 상자들</text>
  </g>
  <g>
    <rect x="392" y="56" width="160" height="220" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="412" y="84" font-size="13" fill="#57606a">3번 정거장</text>
    <text x="412" y="108" font-size="16" font-weight="700" fill="#0969da">인식</text>
    <text x="412" y="140" font-size="13" fill="#57606a">상자 속 그림이</text>
    <text x="412" y="160" font-size="13" fill="#57606a">무슨 글자인지</text>
    <text x="412" y="180" font-size="13" fill="#57606a">알아보기</text>
    <text x="412" y="250" font-size="13" font-weight="700" fill="#1f2328">→ 문자열+점수</text>
  </g>
  <g>
    <rect x="578" y="56" width="162" height="220" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="598" y="84" font-size="13" fill="#57606a">4번 정거장</text>
    <text x="598" y="108" font-size="16" font-weight="700" fill="#1a7f37">레이아웃 분석</text>
    <text x="598" y="140" font-size="13" fill="#57606a">흩어진 글자를</text>
    <text x="598" y="160" font-size="13" fill="#57606a">제목·표·항목-값</text>
    <text x="598" y="180" font-size="13" fill="#57606a">으로 묶기</text>
    <text x="598" y="250" font-size="13" font-weight="700" fill="#1f2328">→ 표·문단</text>
  </g>

  <!-- 화살표 -->
  <line x1="182" y1="166" x2="203" y2="166" stroke="#0969da" stroke-width="2" marker-end="url(#ocr-ar)"/>
  <line x1="368" y1="166" x2="389" y2="166" stroke="#0969da" stroke-width="2" marker-end="url(#ocr-ar)"/>
  <line x1="554" y1="166" x2="575" y2="166" stroke="#0969da" stroke-width="2" marker-end="url(#ocr-ar)"/>

  <!-- 오류 전파 -->
  <rect x="20" y="300" width="720" height="84" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="40" y="328" font-size="14" font-weight="700" fill="#bc4c00">화살표는 한 방향 — 뒤 정거장은 앞의 실수를 되돌리지 못한다</text>
  <text x="40" y="352" font-size="13" fill="#57606a">정거장마다 98%씩 성공한다고 치면 네 번 곱해 0.98⁴ ≈ 92.2%</text>
  <text x="40" y="372" font-size="13" fill="#57606a">(설명용 가정이지 실제로 잰 성능이 아니다)</text>
</svg>
