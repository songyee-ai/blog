<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">다음 행동은 누가 정하나 — 같은 "알림 보냄", 다른 확인 장소</text>
  <text x="24" y="50" font-size="12" fill="#57606a">예: 고객 문의를 분류해 담당 팀에 알리는 일</text>

  <g font-size="12">
    <rect x="24" y="72" width="224" height="210" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="40" y="96" font-size="14" font-weight="700" fill="#1f2328">사람이 직접 지시</text>
    <text x="40" y="118" fill="#57606a">정하는 쪽: 사람</text>
    <text x="40" y="146" fill="#1f2328">메일을 읽고 기준을 대어</text>
    <text x="40" y="164" fill="#1f2328">한 건씩 알림을 보낸다</text>
    <line x1="40" y1="200" x2="232" y2="200" stroke="#d0d7de"/>
    <text x="40" y="222" font-weight="700" fill="#cf222e">문제가 생기면 볼 곳</text>
    <text x="40" y="244" fill="#1f2328">입력, 판단 기준</text>

    <rect x="268" y="72" width="224" height="210" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="284" y="96" font-size="14" font-weight="700" fill="#0969da">워크플로</text>
    <text x="284" y="118" fill="#57606a">정하는 쪽: 미리 이은 그래프</text>
    <text x="284" y="146" fill="#1f2328">받기 → 분류 → 팀 찾기 → 알림</text>
    <text x="284" y="164" fill="#1f2328">조건마다 갈 길이 정해져 있다</text>
    <line x1="284" y1="200" x2="476" y2="200" stroke="#b6e3ff"/>
    <text x="284" y="222" font-weight="700" fill="#cf222e">문제가 생기면 볼 곳</text>
    <text x="284" y="244" fill="#1f2328">어느 조건에서 다른 길로 갔나</text>

    <rect x="512" y="72" width="224" height="210" rx="10" fill="#fff8c5" stroke="#9a6700"/>
    <text x="528" y="96" font-size="14" font-weight="700" fill="#9a6700">에이전트</text>
    <text x="528" y="118" fill="#57606a">정하는 쪽: 결과를 읽은 모델</text>
    <text x="528" y="146" fill="#1f2328">모호하면 조회할지, 되물을지</text>
    <text x="528" y="164" fill="#1f2328">모델이 고르고 결과 보고 또 고름</text>
    <line x1="528" y1="200" x2="720" y2="200" stroke="#eac54f"/>
    <text x="528" y="222" font-weight="700" fill="#cf222e">문제가 생기면 볼 곳</text>
    <text x="528" y="244" fill="#1f2328">쥐여 준 도구, 도구 결과,</text>
    <text x="528" y="262" fill="#1f2328">반복 한도, 승인 규칙</text>

    <line x1="40" y1="316" x2="716" y2="316" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="40" y="344" fill="#57606a">오른쪽으로 갈수록 다음 행동을 모델이 고르는 몫이 커진다</text>
    <text x="40" y="364" fill="#57606a">→ 예외에는 강해지지만, 모델 호출이 늘고 열어 볼 곳도 늘어난다</text>
  </g>
</svg>
