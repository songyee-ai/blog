<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">한 워크플로 안의 규칙과 판단</text>
  <text x="24" y="50" font-size="12" fill="#57606a">파란 칸은 늘 같은 결과를 내는 규칙, 노란 칸 하나만 모델이 판단한다.</text>

  <g font-size="12">
    <rect x="24" y="80" width="140" height="70" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="40" y="106" font-size="13" font-weight="700" fill="#0969da">Manual Trigger</text>
    <text x="40" y="128" fill="#57606a">버튼을 누르면 시작</text>

    <rect x="188" y="80" width="150" height="70" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="204" y="106" font-size="13" font-weight="700" fill="#0969da">HTTP Request</text>
    <text x="204" y="128" fill="#57606a">위키백과 요약 받기</text>

    <rect x="362" y="80" width="166" height="76" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="378" y="106" font-size="13" font-weight="700" fill="#0969da">IF (신호등)</text>
    <text x="378" y="122" fill="#57606a">title과 description이</text>
    <text x="378" y="138" fill="#57606a">둘 다 있나?</text>

    <line x1="164" y1="115" x2="186" y2="115" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <line x1="338" y1="115" x2="360" y2="115" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>

    <line x1="528" y1="100" x2="566" y2="100" stroke="#1a7f37" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="532" y="92" font-weight="700" fill="#1a7f37">true</text>
    <rect x="568" y="72" width="168" height="70" rx="10" fill="#fff8c5" stroke="#9a6700"/>
    <text x="584" y="98" font-size="13" font-weight="700" fill="#9a6700">AI Agent (길 묻기)</text>
    <text x="584" y="120" fill="#57606a">한 문장으로 요약</text>

    <path d="M445,156 L445,196 L566,196" fill="none" stroke="#cf222e" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="454" y="186" font-weight="700" fill="#cf222e">false</text>
    <rect x="568" y="166" width="168" height="58" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="584" y="190" font-size="13" font-weight="700" fill="#1f2328">확인 필요 기록</text>
    <text x="584" y="210" fill="#57606a">비워 두지 않는다</text>

    <rect x="24" y="252" width="712" height="128" rx="10" fill="#fff8c5" fill-opacity="0.45" stroke="#9a6700" stroke-dasharray="5 4"/>
    <text x="40" y="276" font-size="14" font-weight="700" fill="#9a6700">AI Agent에 도구를 붙일 때</text>
    <rect x="40" y="290" width="324" height="74" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="54" y="312" font-weight="700" fill="#1a7f37">읽기 도구 — 처음엔 이것만</text>
    <text x="54" y="332" fill="#1f2328">공개 데이터 조회, 문서 읽기</text>
    <text x="54" y="350" fill="#57606a">호출 횟수와 범위를 작게</text>
    <rect x="396" y="290" width="324" height="74" rx="8" fill="#ffebe9" stroke="#cf222e"/>
    <text x="410" y="312" font-weight="700" fill="#cf222e">바꾸는 도구 — 앞에 관문을</text>
    <text x="410" y="332" fill="#1f2328">보내기·고치기·지우기</text>
    <text x="410" y="350" fill="#57606a">사람 승인(HITL) 또는 IF 조건 통과 뒤에만</text>
  </g>
</svg>
