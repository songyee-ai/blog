<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="서버형 데이터베이스는 따로 찾아가야 하는 은행이고 SQLite는 가방에 넣고 다니는 저금통이다">
  <defs>
    <marker id="sq-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>

  <text x="30" y="30" font-size="15" font-weight="700" fill="#1f2328">찾아가야 하는 은행과, 들고 다니는 저금통</text>

  <!-- 서버형 DB -->
  <rect x="30" y="50" width="400" height="196" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="76" font-size="13" font-weight="700" fill="#57606a">은행</text>
  <text x="50" y="96" font-size="11.5" font-weight="700" fill="#1f2328">서버형 DB — PostgreSQL · MySQL</text>

  <rect x="60" y="114" width="110" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="115" y="138" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">내 프로그램</text>
  <text x="115" y="157" font-size="10" fill="#57606a" text-anchor="middle">여기서 요청</text>

  <line x1="170" y1="142" x2="286" y2="142" stroke="#57606a" stroke-width="1.5" marker-end="url(#sq-ar)"/>
  <text x="228" y="134" font-size="9.5" fill="#57606a" text-anchor="middle">접속해서</text>

  <rect x="288" y="106" width="112" height="72" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="344" y="132" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">DB 서버</text>
  <text x="344" y="150" font-size="10" fill="#57606a" text-anchor="middle">따로 띄워 둔</text>
  <text x="344" y="166" font-size="10" fill="#57606a" text-anchor="middle">프로그램</text>

  <text x="50" y="202" font-size="11" fill="#1a7f37">＋ 여러 명이 동시에 써도 버틴다</text>
  <text x="50" y="224" font-size="11" fill="#cf222e">－ 띄우고 설정하고 관리해야 한다</text>

  <!-- SQLite -->
  <rect x="470" y="50" width="400" height="196" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
  <text x="490" y="76" font-size="13" font-weight="700" fill="#57606a">책가방 속 저금통</text>
  <text x="490" y="96" font-size="11.5" font-weight="700" fill="#1a7f37">SQLite</text>

  <rect x="500" y="110" width="340" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="518" y="131" font-size="10.5" fill="#57606a">내 프로젝트 폴더</text>

  <rect x="518" y="140" width="150" height="32" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="593" y="161" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">todo.db</text>

  <text x="690" y="154" font-size="10.5" fill="#1f2328">← 이 파일 하나가</text>
  <text x="690" y="170" font-size="10.5" fill="#1f2328">　 데이터베이스 전부</text>

  <text x="490" y="202" font-size="11" fill="#1a7f37">＋ 설치도 서버도 없다. USB에 복사하면 끝</text>
  <text x="490" y="224" font-size="11" fill="#cf222e">－ 여러 명이 동시에 쓰기엔 약하다</text>

  <!-- 하단 -->
  <line x1="30" y1="266" x2="870" y2="266" stroke="#d0d7de" stroke-width="1"/>
  <text x="30" y="294" font-size="11.5" font-weight="700" fill="#1f2328">흔한 흐름</text>
  <text x="120" y="294" font-size="11.5" fill="#57606a">저금통으로 시작해서, 사람이 많아지면 은행으로 옮긴다</text>
  <text x="30" y="318" font-size="10.5" fill="#57606a">한계는 "작다"가 아니라 "여러 명이 동시에 쓰기"다. 읽기만 많으면 꽤 큰 규모까지 버틴다.</text>
</svg>
