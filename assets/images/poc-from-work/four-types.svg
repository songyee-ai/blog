<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">업무 유형 넷 — 유형이 정해지면 병목도 정해진다</text>
  <text x="24" y="50" font-size="12" fill="#57606a">어느 칸인지 먼저 정해야 무엇으로 좋아졌다고 말할지가 정해진다.</text>

  <g font-size="12">
    <rect x="24" y="66" width="170" height="210" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="40" y="90" font-size="13.5" font-weight="700" fill="#0969da">검색</text>
    <text x="40" y="112" fill="#1f2328">자료는 있는데</text>
    <text x="40" y="128" fill="#1f2328">못 찾는다</text>
    <text x="40" y="158" font-weight="700" fill="#0969da">병목</text>
    <text x="40" y="176" fill="#1f2328">자료에 붙은</text>
    <text x="40" y="192" fill="#1f2328">설명이 없다</text>
    <text x="40" y="222" font-weight="700" fill="#57606a">붙는 도구</text>
    <text x="40" y="240" fill="#57606a">임베딩 검색</text>

    <rect x="204" y="66" width="170" height="210" rx="10" fill="#fff8c5" stroke="#9a6700"/>
    <text x="220" y="90" font-size="13.5" font-weight="700" fill="#9a6700">검사와 판독</text>
    <text x="220" y="112" fill="#1f2328">사람이 보고</text>
    <text x="220" y="128" fill="#1f2328">합격·등급을 정한다</text>
    <text x="220" y="158" font-weight="700" fill="#9a6700">병목</text>
    <text x="220" y="176" fill="#1f2328">일관성과</text>
    <text x="220" y="192" fill="#1f2328">지속 시간 (정확도 X)</text>
    <text x="220" y="222" font-weight="700" fill="#57606a">붙는 도구</text>
    <text x="220" y="240" fill="#57606a">탐지·분할·자세 추정</text>

    <rect x="384" y="66" width="170" height="210" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="400" y="90" font-size="13.5" font-weight="700" fill="#1a7f37">분류와 배분</text>
    <text x="400" y="112" fill="#1f2328">들어온 것을 나눠</text>
    <text x="400" y="128" fill="#1f2328">담당자에게 보낸다</text>
    <text x="400" y="158" font-weight="700" fill="#1a7f37">병목</text>
    <text x="400" y="176" fill="#1f2328">건당은 쉬운데</text>
    <text x="400" y="192" fill="#1f2328">판단의 총량이 크다</text>
    <text x="400" y="222" font-weight="700" fill="#57606a">붙는 도구</text>
    <text x="400" y="240" fill="#57606a">분류 모델, 구조화 출력</text>

    <rect x="564" y="66" width="172" height="210" rx="10" fill="#fbefff" stroke="#8250df"/>
    <text x="580" y="90" font-size="13.5" font-weight="700" fill="#8250df">입력과 전사</text>
    <text x="580" y="112" fill="#1f2328">한 형식을 다른</text>
    <text x="580" y="128" fill="#1f2328">형식으로 옮겨 적는다</text>
    <text x="580" y="158" font-weight="700" fill="#8250df">병목</text>
    <text x="580" y="176" fill="#1f2328">판단이 아니라 손</text>
    <text x="580" y="192" fill="#1f2328">(틀려도 잘 안 보임)</text>
    <text x="580" y="222" font-weight="700" fill="#57606a">붙는 도구</text>
    <text x="580" y="240" fill="#57606a">OCR, 음성 인식</text>
  </g>
  <text x="24" y="294" font-size="11.5" fill="#57606a">내 과제(상품 누끼)는 "입력과 전사"에 가장 가깝다고 봤다 — 옮기는 대상이 글자가 아니라 픽셀 영역이라 딱 맞지는 않는다.</text>
</svg>
