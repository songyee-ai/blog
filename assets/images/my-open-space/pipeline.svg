<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">폰 영상 한 편이 주소 하나가 되기까지</text>
  <text x="24" y="50" font-size="12" fill="#57606a">무거운 계산은 코랩 T4에서, 나머지는 WSL 우분투 안의 내 작업 폴더에서.</text>

  <g font-size="11.5">
    <rect x="24" y="66" width="130" height="112" rx="10" fill="#f6f8fa" stroke="#57606a"/>
    <text x="89" y="90" text-anchor="middle" font-weight="700" fill="#1f2328">① 폰 영상</text>
    <text x="89" y="112" text-anchor="middle" fill="#1f2328">추모관 12.81초</text>
    <text x="89" y="130" text-anchor="middle" fill="#1f2328">→ 사진 24장</text>
    <text x="89" y="150" text-anchor="middle" fill="#57606a">번진 장 0장</text>

    <text x="160" y="126" font-size="16" fill="#57606a">→</text>
    <rect x="178" y="66" width="140" height="112" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="248" y="90" text-anchor="middle" font-weight="700" fill="#0969da">② 점으로 (코랩)</text>
    <text x="248" y="112" text-anchor="middle" fill="#1f2328">MapAnything · fp16</text>
    <text x="248" y="130" text-anchor="middle" fill="#1f2328">10.0초 · 6.74GB</text>
    <text x="248" y="150" text-anchor="middle" fill="#57606a">퍼짐 0.1699 통과</text>

    <text x="324" y="126" font-size="16" fill="#57606a">→</text>
    <rect x="342" y="66" width="130" height="112" rx="10" fill="#fff8c5" stroke="#9a6700"/>
    <text x="407" y="90" text-anchor="middle" font-weight="700" fill="#9a6700">③ 알갱이로</text>
    <text x="407" y="112" text-anchor="middle" fill="#1f2328">337만 개 · K=0.5</text>
    <text x="407" y="130" text-anchor="middle" fill="#1f2328">.ply 219 MiB</text>
    <text x="407" y="150" text-anchor="middle" fill="#57606a">알갱이당 68바이트</text>

    <text x="478" y="126" font-size="16" fill="#57606a">→</text>
    <rect x="496" y="66" width="110" height="112" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="551" y="90" text-anchor="middle" font-weight="700" fill="#1a7f37">④ 줄이기</text>
    <text x="551" y="112" text-anchor="middle" fill="#1f2328">.sog</text>
    <text x="551" y="130" text-anchor="middle" fill="#1f2328">13.89 MiB</text>
    <text x="551" y="150" text-anchor="middle" fill="#57606a">15.8배</text>

    <text x="612" y="126" font-size="16" fill="#57606a">→</text>
    <rect x="630" y="66" width="106" height="112" rx="10" fill="#f6f8fa" stroke="#57606a"/>
    <text x="683" y="90" text-anchor="middle" font-weight="700" fill="#1f2328">⑤ 공개</text>
    <text x="683" y="112" text-anchor="middle" fill="#1f2328">GitHub Pages</text>
    <text x="683" y="130" text-anchor="middle" fill="#1f2328">three.js</text>
    <text x="683" y="150" text-anchor="middle" fill="#1f2328">+ Spark</text>
  </g>

  <rect x="24" y="196" width="712" height="88" rx="10" fill="none" stroke="#8c959f" stroke-dasharray="4 4"/>
  <text x="40" y="220" font-size="12.5" font-weight="700" fill="#1f2328">내가 눈으로 정한 것</text>
  <text x="40" y="242" font-size="11.5" fill="#1f2328">· 장소: 갤러리 영상은 작품이 많이 찍혀 저작권이 걱정돼 버리고, 공개 추모 공간인 청주동물원 추모관으로 바꿨다</text>
  <text x="40" y="262" font-size="11.5" fill="#1f2328">· 알갱이 크기 K: 1.4에서 시작해 여러 값을 나란히 보고 0.5로 — 글씨가 읽히면서 겹쳐 보이지 않는 자리</text>
</svg>
