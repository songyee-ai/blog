<svg viewBox="0 0 760 450" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="ComfyUI에서는 블록 모양의 노드를 선으로 이어 이미지 생성 과정을 조립한다. 모델을 불러오는 UnetLoaderGGUF, 프롬프트를 숫자로 바꾸는 CLIPTextEncode, 참조 그림을 압축하는 VAEEncode와 그것을 조건으로 붙이는 ReferenceLatent가 KSampler로 모이고, KSampler가 그림을 만든 뒤 VAEDecode가 사람이 볼 수 있는 이미지로 풀어낸다">
  <!-- 연결선 (노드 뒤에 깔림) -->
  <g fill="none" stroke-width="2.5">
    <path d="M200 78 C 320 78, 330 160, 460 160" stroke="#0969da"/>
    <path d="M200 188 C 320 188, 330 196, 460 196" stroke="#bc4c00"/>
    <path d="M200 318 C 230 318, 220 318, 250 318" stroke="#bc4c00"/>
    <path d="M420 318 C 440 318, 430 232, 460 232" stroke="#bc4c00"/>
    <path d="M560 250 L 560 330" stroke="#1a7f37"/>
  </g>

  <!-- 노드: UnetLoaderGGUF -->
  <rect x="30" y="40" width="170" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <rect x="30" y="40" width="170" height="8" rx="4" fill="#0969da"/>
  <text x="46" y="72" font-size="14" font-weight="700" fill="#0969da">UnetLoaderGGUF</text>
  <text x="46" y="94" font-size="13" fill="#57606a">생성 모델 불러오기</text>
  <circle cx="200" cy="78" r="6" fill="#0969da"/>

  <!-- 노드: CLIPTextEncode -->
  <rect x="30" y="150" width="170" height="70" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <rect x="30" y="150" width="170" height="8" rx="4" fill="#bc4c00"/>
  <text x="46" y="182" font-size="14" font-weight="700" fill="#bc4c00">CLIPTextEncode</text>
  <text x="46" y="204" font-size="13" fill="#57606a">프롬프트 → 숫자</text>
  <circle cx="200" cy="188" r="6" fill="#bc4c00"/>

  <!-- 노드: VAEEncode -->
  <rect x="30" y="280" width="170" height="70" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <rect x="30" y="280" width="170" height="8" rx="4" fill="#bc4c00"/>
  <text x="46" y="312" font-size="14" font-weight="700" fill="#bc4c00">VAEEncode</text>
  <text x="46" y="334" font-size="13" fill="#57606a">참조 그림 압축</text>
  <circle cx="200" cy="318" r="6" fill="#bc4c00"/>

  <!-- 노드: ReferenceLatent -->
  <rect x="250" y="280" width="170" height="70" rx="8" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <rect x="250" y="280" width="170" height="8" rx="4" fill="#bc4c00"/>
  <text x="266" y="312" font-size="14" font-weight="700" fill="#bc4c00">ReferenceLatent</text>
  <text x="266" y="334" font-size="13" fill="#57606a">"이걸 참고해" 붙이기</text>
  <circle cx="250" cy="318" r="6" fill="#bc4c00"/>
  <circle cx="420" cy="318" r="6" fill="#bc4c00"/>

  <!-- 노드: KSampler -->
  <rect x="460" y="130" width="160" height="120" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <rect x="460" y="130" width="160" height="8" rx="4" fill="#1a7f37"/>
  <text x="476" y="164" font-size="14" font-weight="700" fill="#1a7f37">KSampler</text>
  <text x="476" y="186" font-size="13" fill="#57606a">잡음에서 그림을</text>
  <text x="476" y="206" font-size="13" fill="#57606a">조금씩 걷어 냄</text>
  <text x="476" y="232" font-size="12" fill="#57606a">시드 · 스텝 · cfg</text>
  <circle cx="460" cy="160" r="6" fill="#0969da"/>
  <circle cx="460" cy="196" r="6" fill="#bc4c00"/>
  <circle cx="460" cy="232" r="6" fill="#bc4c00"/>
  <circle cx="560" cy="250" r="6" fill="#1a7f37"/>

  <!-- 노드: VAEDecode -->
  <rect x="480" y="330" width="160" height="70" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <rect x="480" y="330" width="160" height="8" rx="4" fill="#1a7f37"/>
  <text x="496" y="362" font-size="14" font-weight="700" fill="#1a7f37">VAEDecode</text>
  <text x="496" y="384" font-size="13" fill="#57606a">볼 수 있는 이미지로</text>
  <circle cx="560" cy="330" r="6" fill="#1a7f37"/>

  <!-- 결과 -->
  <text x="660" y="362" font-size="14" font-weight="700" fill="#57606a">→ 결과</text>
  <text x="660" y="384" font-size="13" fill="#57606a">PNG 한 장</text>

  <!-- 범례 -->
  <g font-size="13" fill="#57606a">
    <rect x="250" y="40" width="14" height="14" rx="3" fill="#0969da"/><text x="272" y="52">불러오기</text>
    <rect x="350" y="40" width="14" height="14" rx="3" fill="#bc4c00"/><text x="372" y="52">조건 만들기</text>
    <rect x="470" y="40" width="14" height="14" rx="3" fill="#1a7f37"/><text x="492" y="52">그림 계산</text>
  </g>
  <text x="380" y="432" font-size="14" fill="#57606a" text-anchor="middle">블록(노드)마다 한 가지 일만 한다. 선은 "앞 블록의 결과를 이 블록에 넘긴다"는 뜻이다</text>
</svg>
