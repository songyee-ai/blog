<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="왼쪽의 빈 신청서 양식이 스키마이고 오른쪽의 채워진 종이가 데이터이며, 양식에 맞지 않는 값은 걸러진다">
  <defs>
    <marker id="sc-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="30" y="30" font-size="15" font-weight="700" fill="#1f2328">스키마는 빈 양식, 데이터는 채워진 종이</text>

  <!-- 스키마 -->
  <rect x="30" y="52" width="280" height="200" rx="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/>
  <text x="48" y="78" font-size="12.5" font-weight="700" fill="#8250df">스키마 — 참가 신청서 양식</text>
  <line x1="48" y1="90" x2="292" y2="90" stroke="#d0d7de" stroke-width="1"/>

  <text x="48" y="118" font-size="11.5" fill="#1f2328">이름</text>
  <rect x="120" y="104" width="170" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="205" y="120" font-size="10.5" fill="#57606a" text-anchor="middle">글자로 쓰기</text>

  <text x="48" y="158" font-size="11.5" fill="#1f2328">나이</text>
  <rect x="120" y="144" width="170" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="205" y="160" font-size="10.5" fill="#57606a" text-anchor="middle">숫자로 쓰기</text>

  <text x="48" y="198" font-size="11.5" fill="#1f2328">참가</text>
  <rect x="120" y="184" width="170" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="205" y="200" font-size="10.5" fill="#57606a" text-anchor="middle">예 / 아니오 중 하나</text>

  <text x="48" y="234" font-size="10" fill="#57606a">채우는 법을 알려주는 안내판. 내용은 아직 없다.</text>

  <!-- 검사관 -->
  <line x1="310" y1="152" x2="352" y2="152" stroke="#57606a" stroke-width="1.5" marker-end="url(#sc-ar)"/>
  <rect x="352" y="112" width="150" height="80" rx="8" fill="#fff8c5" stroke="#bc4c00" stroke-width="2"/>
  <text x="427" y="140" font-size="12" font-weight="700" fill="#bc4c00" text-anchor="middle">검사관</text>
  <text x="427" y="162" font-size="10.5" fill="#57606a" text-anchor="middle">양식에 맞는지</text>
  <text x="427" y="179" font-size="10.5" fill="#57606a" text-anchor="middle">채우기 전에 확인</text>
  <line x1="502" y1="152" x2="544" y2="152" stroke="#57606a" stroke-width="1.5" marker-end="url(#sc-ar)"/>

  <!-- 데이터 -->
  <rect x="544" y="52" width="280" height="200" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="562" y="78" font-size="12.5" font-weight="700" fill="#1a7f37">데이터 — 실제로 채운 종이</text>
  <line x1="562" y1="90" x2="806" y2="90" stroke="#d0d7de" stroke-width="1"/>

  <text x="562" y="118" font-size="11.5" fill="#1f2328">이름</text>
  <rect x="634" y="104" width="170" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
  <text x="719" y="120" font-size="11" fill="#1f2328" text-anchor="middle">홍길동</text>

  <text x="562" y="158" font-size="11.5" fill="#1f2328">나이</text>
  <rect x="634" y="144" width="170" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
  <text x="719" y="160" font-size="11" fill="#1f2328" text-anchor="middle">12</text>

  <text x="562" y="198" font-size="11.5" fill="#1f2328">참가</text>
  <rect x="634" y="184" width="170" height="22" rx="4" fill="#dafbe1" stroke="#1a7f37" stroke-width="1"/>
  <text x="719" y="200" font-size="11" fill="#1f2328" text-anchor="middle">예</text>

  <text x="562" y="234" font-size="10" fill="#57606a">양식을 따랐으므로 통과.</text>

  <!-- 반례 -->
  <rect x="30" y="278" width="794" height="52" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text x="52" y="300" font-size="11.5" font-weight="700" fill="#cf222e">나이 칸에 "코끼리"</text>
  <text x="52" y="320" font-size="10.5" fill="#57606a">양식이 "숫자"라고 정해 두었기 때문에, 저장되기 전에 걸러진다. 스키마가 검사관 역할을 하는 자리가 여기다.</text>
</svg>
