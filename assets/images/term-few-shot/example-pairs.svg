<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="프롬프트 안에 3월 5일은 2026-03-05, 12월 25일은 2026-12-25, 10월 9일은 2026-10-09라는 예시 짝 세 개를 먼저 넣고, 마지막에 7월 1일을 물으면 모델이 같은 꼴로 2026-07-01이라고 답한다. 이때 모델 속 숫자는 바뀌지 않는다">
  <defs>
    <marker id="fs-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker>
  </defs>

  <text x="24" y="30" font-size="16" font-weight="700" fill="#0969da">예시 짝을 먼저 보여 주면, 새 입력에도 같은 꼴로 답한다</text>

  <!-- 프롬프트 -->
  <rect x="16" y="52" width="420" height="292" rx="12" fill="#8c959f" fill-opacity="0.08" stroke="#8c959f" stroke-width="1.5"/>
  <text x="36" y="80" font-size="14" font-weight="700" fill="#8c959f">프롬프트 (한 번에 보내는 입력)</text>

  <g font-size="14">
    <rect x="36" y="96" width="380" height="40" rx="8" fill="#ddf4ff" fill-opacity="0.35" stroke="#0969da" stroke-width="1.2"/>
    <text x="54" y="121" fill="#0969da" font-weight="700">예시 1</text>
    <text x="130" y="121" fill="#8c959f">3월 5일</text>
    <text x="230" y="121" fill="#8c959f">→</text>
    <text x="262" y="121" fill="#0969da">2026-03-05</text>

    <rect x="36" y="146" width="380" height="40" rx="8" fill="#ddf4ff" fill-opacity="0.35" stroke="#0969da" stroke-width="1.2"/>
    <text x="54" y="171" fill="#0969da" font-weight="700">예시 2</text>
    <text x="130" y="171" fill="#8c959f">12월 25일</text>
    <text x="230" y="171" fill="#8c959f">→</text>
    <text x="262" y="171" fill="#0969da">2026-12-25</text>

    <rect x="36" y="196" width="380" height="40" rx="8" fill="#ddf4ff" fill-opacity="0.35" stroke="#0969da" stroke-width="1.2"/>
    <text x="54" y="221" fill="#0969da" font-weight="700">예시 3</text>
    <text x="130" y="221" fill="#8c959f">10월 9일</text>
    <text x="230" y="221" fill="#8c959f">→</text>
    <text x="262" y="221" fill="#0969da">2026-10-09</text>

    <line x1="36" y1="256" x2="416" y2="256" stroke="#8c959f" stroke-width="1" stroke-dasharray="4 4"/>

    <rect x="36" y="272" width="380" height="40" rx="8" fill="#fff1e5" fill-opacity="0.35" stroke="#bc4c00" stroke-width="1.2"/>
    <text x="54" y="297" fill="#bc4c00" font-weight="700">새 입력</text>
    <text x="130" y="297" fill="#8c959f">7월 1일</text>
    <text x="230" y="297" fill="#8c959f">→</text>
    <text x="262" y="297" fill="#bc4c00" font-weight="700">?</text>
  </g>
  <text x="36" y="334" font-size="12.5" fill="#8c959f">꼴을 말로 설명하는 대신, 짝을 보여 준다</text>

  <!-- 화살표 → 모델 -->
  <line x1="440" y1="198" x2="474" y2="198" stroke="#8c959f" stroke-width="1.5" marker-end="url(#fs-ar)"/>

  <rect x="480" y="158" width="116" height="80" rx="40" fill="#8c959f" fill-opacity="0.08" stroke="#8c959f" stroke-width="1.5"/>
  <text x="538" y="196" font-size="15" font-weight="700" fill="#8c959f" text-anchor="middle">모델</text>
  <text x="538" y="216" font-size="12" fill="#8c959f" text-anchor="middle">학습 없음</text>
  <text x="538" y="266" font-size="12" fill="#8c959f" text-anchor="middle">모델 속 숫자는 그대로</text>

  <!-- 화살표 → 답 -->
  <line x1="600" y1="198" x2="626" y2="198" stroke="#8c959f" stroke-width="1.5" marker-end="url(#fs-ar)"/>

  <rect x="632" y="164" width="112" height="68" rx="10" fill="#dafbe1" fill-opacity="0.35" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="688" y="190" font-size="12.5" fill="#1a7f37" text-anchor="middle">모델의 답</text>
  <text x="688" y="216" font-size="14" font-weight="700" fill="#1a7f37" text-anchor="middle">2026-07-01</text>
</svg>
