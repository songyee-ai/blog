<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="gw-ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
  </defs>
  <text x="24" y="28" font-size="16" font-weight="700" fill="#57606a">Gateway는 이 컴퓨터 안쪽에만 문을 낸 접수처다</text>
  <text x="24" y="50" font-size="13" fill="#6e7781">실습 기본값: 127.0.0.1(loopback)의 18789번 문에서만 연결을 받는다.</text>

  <!-- 컴퓨터 안 경계 -->
  <rect x="24" y="70" width="530" height="320" rx="14" fill="none" stroke="#0969da" stroke-dasharray="6 5"/>
  <text x="44" y="96" font-size="14" font-weight="700" fill="#0969da">이 컴퓨터 안 (WSL)</text>

  <rect x="44" y="116" width="170" height="56" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="62" y="142" font-size="14" font-weight="700" fill="#0969da">터미널 채팅 화면</text>
  <text x="62" y="162" font-size="13" fill="#57606a">TUI</text>
  <rect x="44" y="192" width="170" height="56" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="62" y="218" font-size="14" font-weight="700" fill="#0969da">WebChat</text>
  <text x="62" y="238" font-size="13" fill="#57606a">브라우저 화면</text>

  <line x1="218" y1="144" x2="256" y2="160" stroke="#6e7781" stroke-width="2" marker-end="url(#gw-ah)"/>
  <line x1="218" y1="220" x2="256" y2="204" stroke="#6e7781" stroke-width="2" marker-end="url(#gw-ah)"/>

  <rect x="260" y="112" width="274" height="140" rx="12" fill="#fff1e5" stroke="#bc4c00"/>
  <text x="280" y="140" font-size="15" font-weight="700" fill="#bc4c00">Gateway</text>
  <text x="280" y="162" font-size="13" fill="#bc4c00" font-family="monospace">127.0.0.1:18789</text>
  <text x="280" y="190" font-size="13" fill="#57606a">① 채널 연결을 붙잡고 있다</text>
  <text x="280" y="212" font-size="13" fill="#57606a">② 받을 세션·에이전트를 고른다</text>
  <text x="280" y="234" font-size="13" fill="#57606a">③ 에이전트 런타임에 넘긴다</text>

  <line x1="397" y1="256" x2="397" y2="292" stroke="#6e7781" stroke-width="2" marker-end="url(#gw-ah)"/>

  <rect x="260" y="296" width="274" height="74" rx="12" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="280" y="324" font-size="15" font-weight="700" fill="#1a7f37">에이전트 런타임</text>
  <text x="280" y="348" font-size="13" fill="#57606a">모델 호출 + 도구 실행</text>

  <!-- 바깥 -->
  <rect x="580" y="112" width="156" height="72" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="596" y="140" font-size="14" font-weight="700" fill="#0969da">Telegram</text>
  <text x="596" y="162" font-size="13" fill="#57606a">채널 하나</text>
  <line x1="576" y1="150" x2="538" y2="150" stroke="#6e7781" stroke-width="2" marker-end="url(#gw-ah)" marker-start="url(#gw-ah)"/>

  <rect x="580" y="226" width="156" height="72" rx="10" fill="none" stroke="#6e7781"/>
  <text x="596" y="254" font-size="14" font-weight="700" fill="#57606a">다른 기기의</text>
  <text x="596" y="276" font-size="14" font-weight="700" fill="#57606a">브라우저</text>
  <line x1="576" y1="262" x2="540" y2="262" stroke="#bc4c00" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="554" y="268" font-size="18" font-weight="700" fill="#bc4c00" text-anchor="middle">✕</text>
  <text x="580" y="324" font-size="13" fill="#57606a">기본값에선</text>
  <text x="580" y="344" font-size="13" fill="#57606a">18789번 문으로</text>
  <text x="580" y="364" font-size="13" fill="#57606a">들어오지 못한다</text>

  <text x="24" y="420" font-size="13" fill="#57606a">openclaw doctor --lint의 경고 gateway.bind는 "loopback에만 열려 있다"는 안내였다.</text>
  <text x="24" y="442" font-size="13" fill="#57606a">다른 기기를 붙일 계획이 없어서 그대로 두었다. 경고(warning)는 오류(error)가 아니다.</text>
</svg>
