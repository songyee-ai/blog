<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">같은 대화, 모델마다 다른 포장</text>
  <text x="24" y="50" font-size="12" fill="#57606a">앱은 역할표가 붙은 메시지 목록을 넘긴다. 모델이 실제로 읽는 건 그 목록을 감싼 긴 글자열이다.</text>

  <rect x="220" y="68" width="320" height="92" rx="10" fill="#f6f8fa" stroke="#57606a"/>
  <text x="380" y="92" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1f2328">메시지 목록 (앱이 보내는 것)</text>
  <g font-family="Consolas,'D2Coding','Malgun Gothic',monospace" font-size="12.5" fill="#1f2328">
    <text x="244" y="118">system: 짧게 답한다</text>
    <text x="244" y="140">user:   우산 챙길까?</text>
  </g>

  <line x1="300" y1="160" x2="200" y2="204" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="160" x2="560" y2="204" stroke="#8c959f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="380" y="190" font-size="12" text-anchor="middle" fill="#57606a">채팅 템플릿을 씌운다</text>

  <rect x="24" y="208" width="340" height="150" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="40" y="232" font-size="13.5" font-weight="700" fill="#0969da">예시 형태 A — ChatML 계열</text>
  <g font-family="Consolas,'D2Coding','Malgun Gothic',monospace" font-size="12" fill="#1f2328">
    <text x="40" y="256">&lt;|im_start|&gt;system</text>
    <text x="40" y="274">짧게 답한다&lt;|im_end|&gt;</text>
    <text x="40" y="292">&lt;|im_start|&gt;user</text>
    <text x="40" y="310">우산 챙길까?&lt;|im_end|&gt;</text>
    <text x="40" y="328">&lt;|im_start|&gt;assistant</text>
  </g>
  <text x="40" y="348" font-size="11.5" fill="#57606a">마지막 줄: "이제 네 차례" 자리를 열어 둔다</text>

  <rect x="384" y="208" width="352" height="150" rx="10" fill="#fff8c5" stroke="#9a6700"/>
  <text x="400" y="232" font-size="13.5" font-weight="700" fill="#9a6700">예시 형태 B — Llama 3 계열</text>
  <g font-family="Consolas,'D2Coding','Malgun Gothic',monospace" font-size="11" fill="#1f2328">
    <text x="400" y="256">&lt;|start_header_id|&gt;system&lt;|end_header_id|&gt;</text>
    <text x="400" y="274">짧게 답한다&lt;|eot_id|&gt;</text>
    <text x="400" y="292">&lt;|start_header_id|&gt;user&lt;|end_header_id|&gt;</text>
    <text x="400" y="310">우산 챙길까?&lt;|eot_id|&gt;</text>
    <text x="400" y="328">&lt;|start_header_id|&gt;assistant&lt;|end_header_id|&gt;</text>
  </g>
  <text x="400" y="348" font-size="11.5" fill="#57606a">역할을 감싸는 표시도, 끝 표시도 A와 다르다</text>

  <text x="24" y="390" font-size="12.5" fill="#1f2328">모델이 학습 때 본 포장과 다르게 싸면, 내용이 같아도 모델에게는 낯선 입력이 된다.</text>
  <text x="24" y="412" font-size="11.5" fill="#57606a">줄바꿈과 앞뒤 일부 토큰은 생략한 예시 형태다. 실제 모양은 각 모델의 tokenizer 설정에 든 템플릿이 정한다.</text>
</svg>
