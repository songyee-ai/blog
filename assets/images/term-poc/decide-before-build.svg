<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="PoC는 네 단계로 진행한다. 만들기 전에 지금 사람 수준을 근거로 숫자 기준을 적고, 실행 위치와 라이선스로 후보를 거르며 현행 방식도 후보에 넣고, 모델을 돌리기 전에 정답 규칙을 확정한다. 만든 뒤에는 같은 샘플에 나란히 돌려 채점한다. 적어 둔 기준과 비교해 넘으면 제대로 구축하고, 못 넘으면 그 이유가 결과물이 된다. 둘 다 판단이 선 것이다">
  <defs>
    <marker id="poc-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>

  <text x="380" y="30" font-size="16" font-weight="700" fill="#0969da" text-anchor="middle">PoC — 만들기 전에 정하고, 만든 뒤에 판단한다</text>

  <!-- 만들기 전 묶음 -->
  <rect x="14" y="50" width="552" height="160" rx="12" fill="#ddf4ff" fill-opacity="0.45" stroke="#0969da" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="30" y="72" font-size="13" font-weight="700" fill="#0969da">만들기 전</text>

  <rect x="28" y="84" width="164" height="108" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/>
  <text x="44" y="112" font-size="15" font-weight="700" fill="#1f2328">① 기준 먼저</text>
  <text x="44" y="140" font-size="13" fill="#57606a">지금 사람 수준을</text>
  <text x="44" y="162" font-size="13" fill="#57606a">근거로 숫자 적기</text>

  <rect x="208" y="84" width="164" height="108" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/>
  <text x="224" y="112" font-size="15" font-weight="700" fill="#1f2328">② 후보 거르기</text>
  <text x="224" y="140" font-size="13" fill="#57606a">실행 위치·라이선스</text>
  <text x="224" y="162" font-size="13" fill="#57606a">현행 방식도 후보로</text>

  <rect x="388" y="84" width="164" height="108" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.2"/>
  <text x="404" y="112" font-size="15" font-weight="700" fill="#1f2328">③ 정답 먼저</text>
  <text x="404" y="140" font-size="13" fill="#57606a">모델을 돌리기 전에</text>
  <text x="404" y="162" font-size="13" fill="#57606a">합격 규칙 확정</text>

  <!-- 만든 뒤 -->
  <rect x="584" y="50" width="162" height="160" rx="12" fill="#f6f8fa" fill-opacity="0.5" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="600" y="72" font-size="13" font-weight="700" fill="#57606a">만든 뒤</text>
  <rect x="596" y="84" width="138" height="108" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.2"/>
  <text x="610" y="112" font-size="15" font-weight="700" fill="#1f2328">④ 작게 재기</text>
  <text x="610" y="140" font-size="13" fill="#57606a">같은 샘플에</text>
  <text x="610" y="162" font-size="13" fill="#57606a">나란히 채점</text>

  <line x1="192" y1="138" x2="206" y2="138" stroke="#57606a" stroke-width="1.5" marker-end="url(#poc-ar)"/>
  <line x1="372" y1="138" x2="386" y2="138" stroke="#57606a" stroke-width="1.5" marker-end="url(#poc-ar)"/>
  <line x1="552" y1="138" x2="594" y2="138" stroke="#57606a" stroke-width="1.5" marker-end="url(#poc-ar)"/>

  <!-- 비교 -->
  <line x1="665" y1="210" x2="665" y2="232" stroke="#57606a" stroke-width="1.5"/>
  <line x1="665" y1="232" x2="380" y2="232" stroke="#57606a" stroke-width="1.5"/>
  <line x1="380" y1="232" x2="380" y2="246" stroke="#57606a" stroke-width="1.5" marker-end="url(#poc-ar)"/>
  <rect x="250" y="248" width="260" height="46" rx="23" fill="#ffffff" stroke="#57606a" stroke-width="1.2"/>
  <text x="380" y="277" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">①에 적어 둔 기준과 비교</text>

  <line x1="300" y1="294" x2="200" y2="326" stroke="#57606a" stroke-width="1.5" marker-end="url(#poc-ar)"/>
  <line x1="460" y1="294" x2="560" y2="326" stroke="#57606a" stroke-width="1.5" marker-end="url(#poc-ar)"/>

  <rect x="40" y="330" width="320" height="64" rx="10" fill="#dafbe1" fill-opacity="0.6" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="200" y="356" font-size="14" font-weight="700" fill="#1a7f37" text-anchor="middle">넘었다</text>
  <text x="200" y="379" font-size="13" fill="#1f2328" text-anchor="middle">제대로 만들 가치가 있다 → 구축</text>

  <rect x="400" y="330" width="320" height="64" rx="10" fill="#fff1e5" fill-opacity="0.6" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="560" y="356" font-size="14" font-weight="700" fill="#bc4c00" text-anchor="middle">못 넘었다</text>
  <text x="560" y="379" font-size="13" fill="#1f2328" text-anchor="middle">왜 못 넘었는지가 결과물</text>

  <text x="380" y="424" font-size="13" font-weight="700" fill="#57606a" text-anchor="middle">어느 쪽이든 "만들까 말까" 판단이 섰다</text>
</svg>
