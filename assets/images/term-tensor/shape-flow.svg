<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="안녕 세상이라는 문장이 토큰화 임베딩 배치 로짓 소프트맥스를 거쳐 토큰 하나로 나오기까지 그릇의 모양이 벡터 행렬 텐서 벡터 스칼라로 바뀐다">
  <defs>
    <marker id="tf-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>

  <text x="30" y="30" font-size="15" font-weight="700" fill="#1f2328">"안녕 세상" 이 글자가 되어 나오기까지</text>
  <text x="30" y="50" font-size="10.5" fill="#57606a">같은 데이터인데 단계마다 담기는 그릇의 모양이 바뀐다. 오른쪽 두 칸이 그 모양이다.</text>

  <text x="34" y="80" font-size="10.5" font-weight="700" fill="#57606a">단계</text>
  <text x="388" y="80" font-size="10.5" font-weight="700" fill="#57606a">shape</text>
  <text x="592" y="80" font-size="10.5" font-weight="700" fill="#57606a">그릇</text>

  <line x1="30" y1="88" x2="870" y2="88" stroke="#d0d7de" stroke-width="1"/>

  <line x1="46" y1="96" x2="46" y2="356" stroke="#d0d7de" stroke-width="1.5" marker-end="url(#tf-ar)"/>

  <rect x="60" y="96" width="300" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="76" y="114" font-size="11.5" font-weight="700" fill="#1f2328">① 토큰화</text>
  <text x="76" y="130" font-size="10" fill="#57606a">[15043, 8291] — 토큰 2개의 ID 번호</text>
  <rect x="384" y="96" width="180" height="40" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="474" y="121" font-size="12" font-family="monospace" fill="#1f2328" text-anchor="middle">(2,)</text>
  <rect x="588" y="96" width="282" height="40" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="606" y="121" font-size="12" font-weight="700" fill="#0969da">벡터</text>
  <text x="664" y="121" font-size="10.5" fill="#57606a">숫자를 한 줄로</text>

  <rect x="60" y="148" width="300" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="76" y="166" font-size="11.5" font-weight="700" fill="#1f2328">② 임베딩 변환</text>
  <text x="76" y="182" font-size="10" fill="#57606a">토큰마다 숫자 768개를 붙인다</text>
  <rect x="384" y="148" width="180" height="40" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="474" y="173" font-size="12" font-family="monospace" fill="#1f2328" text-anchor="middle">(2, 768)</text>
  <rect x="588" y="148" width="282" height="40" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="606" y="173" font-size="12" font-weight="700" fill="#1a7f37">행렬</text>
  <text x="664" y="173" font-size="10.5" fill="#57606a">벡터를 여러 줄 쌓으면</text>

  <rect x="60" y="200" width="300" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="76" y="218" font-size="11.5" font-weight="700" fill="#1f2328">③ 배치로 묶어 계산</text>
  <text x="76" y="234" font-size="10" fill="#57606a">문장 32개를 한꺼번에 처리한다</text>
  <rect x="384" y="200" width="180" height="40" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="474" y="225" font-size="12" font-family="monospace" fill="#1f2328" text-anchor="middle">(32, 2, 768)</text>
  <rect x="588" y="200" width="282" height="40" rx="6" fill="#fff8c5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="606" y="225" font-size="12" font-weight="700" fill="#bc4c00">텐서</text>
  <text x="664" y="225" font-size="10.5" fill="#57606a">텐서가 필요한 가장 흔한 이유</text>

  <rect x="60" y="252" width="300" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="76" y="270" font-size="11.5" font-weight="700" fill="#1f2328">④ 로짓</text>
  <text x="76" y="286" font-size="10" fill="#57606a">모든 단어에 점수를 매긴다</text>
  <rect x="384" y="252" width="180" height="40" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="474" y="277" font-size="12" font-family="monospace" fill="#1f2328" text-anchor="middle">(100000,)</text>
  <rect x="588" y="252" width="282" height="40" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="606" y="277" font-size="12" font-weight="700" fill="#0969da">벡터</text>
  <text x="664" y="277" font-size="10.5" fill="#57606a">다시 한 줄로 납작해진다</text>

  <rect x="60" y="304" width="300" height="40" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="76" y="322" font-size="11.5" font-weight="700" fill="#1f2328">⑤ 소프트맥스</text>
  <text x="76" y="338" font-size="10" fill="#57606a">확률로 바꾼다. 다 더하면 1</text>
  <rect x="384" y="304" width="180" height="40" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="474" y="329" font-size="12" font-family="monospace" fill="#1f2328" text-anchor="middle">(100000,)</text>
  <rect x="588" y="304" width="282" height="40" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="606" y="329" font-size="12" font-weight="700" fill="#0969da">벡터</text>
  <text x="664" y="329" font-size="10.5" fill="#57606a">길이는 같고 값만 확률로</text>

  <rect x="60" y="356" width="300" height="40" rx="6" fill="#f6f8fa" stroke="#8250df" stroke-width="1.8"/>
  <text x="76" y="374" font-size="11.5" font-weight="700" fill="#1f2328">⑥ 하나 고르기</text>
  <text x="76" y="390" font-size="10" fill="#57606a">14523 — "좋은"이라는 토큰 하나</text>
  <rect x="384" y="356" width="180" height="40" rx="6" fill="#ffffff" stroke="#8250df" stroke-width="1.8"/>
  <text x="474" y="381" font-size="12" font-family="monospace" fill="#1f2328" text-anchor="middle">( )</text>
  <rect x="588" y="356" width="282" height="40" rx="6" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <text x="606" y="381" font-size="12" font-weight="700" fill="#8250df">스칼라</text>
  <text x="676" y="381" font-size="10.5" fill="#57606a">이 하나가 화면에 글자로 찍힌다</text>

  <text x="30" y="422" font-size="11" fill="#1f2328"><tspan font-weight="700">벡터 → 행렬 → 텐서 → 벡터 → 스칼라.</tspan> 그릇이 커졌다 작아진다. 이게 LLM이 글을 쓰는 전 과정이다.</text>
</svg>
