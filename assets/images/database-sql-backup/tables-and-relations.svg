<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="한 덩어리 데이터를 표로 나누고 번호로 잇는 방식, 그리고 일대다와 다대다 관계" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="t1-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <marker id="t1-key" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8250df"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="15" font-weight="700" fill="#1f2328">1. 같은 걸 두 번 적지 않기 — 표로 나누고, 번호로 가리킨다</text>

  <!-- 왼쪽: 한 덩어리 -->
  <rect x="30" y="54" width="376" height="206" rx="10" fill="#ffffff" stroke="#cf222e" stroke-width="1.5"/>
  <text x="46" y="78" font-size="12.5" font-weight="700" fill="#cf222e">한 줄에 다 적으면</text>

  <rect x="46" y="90" width="344" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="112" font-size="10.5" fill="#1f2328">홍길동 · <tspan fill="#cf222e" font-weight="700">서울시 …</tspan> · 초코케이크 · 12,000 · 3/2</text>

  <rect x="46" y="130" width="344" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="152" font-size="10.5" fill="#1f2328">홍길동 · <tspan fill="#cf222e" font-weight="700">서울시 …</tspan> · 아메리카노 · 4,500 · 3/5</text>

  <rect x="46" y="170" width="344" height="34" rx="5" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="192" font-size="10.5" fill="#1f2328">홍길동 · <tspan fill="#cf222e" font-weight="700">서울시 …</tspan> · 딸기케이크 · 13,000 · 3/9</text>

  <text x="218" y="226" font-size="11" fill="#cf222e" text-anchor="middle">주문이 100건이면 같은 주소가 100번 적힌다</text>
  <text x="218" y="245" font-size="11" fill="#cf222e" text-anchor="middle">이사 가면 100군데를 다 고쳐야 한다</text>

  <line x1="414" y1="157" x2="456" y2="157" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#t1-ar)"/>

  <!-- 오른쪽: 표로 나누기 -->
  <rect x="466" y="54" width="404" height="206" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="482" y="78" font-size="12.5" font-weight="700" fill="#1a7f37">성격이 다른 것끼리 표를 나누면</text>

  <rect x="482" y="90" width="372" height="38" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="494" y="105" font-size="10" font-weight="700" fill="#57606a">회원</text>
  <text x="494" y="121" font-size="10.5" fill="#1f2328"><tspan font-weight="700" fill="#8250df">1번</tspan> · 홍길동 · 서울시 … (한 번만 적힌다)</text>

  <rect x="482" y="134" width="372" height="38" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="494" y="149" font-size="10" font-weight="700" fill="#57606a">상품</text>
  <text x="494" y="165" font-size="10.5" fill="#1f2328"><tspan font-weight="700" fill="#8250df">7번</tspan> · 초코케이크 · 12,000원</text>

  <rect x="482" y="178" width="372" height="38" rx="5" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <text x="494" y="193" font-size="10" font-weight="700" fill="#57606a">주문</text>
  <text x="494" y="209" font-size="10.5" fill="#1f2328">55번 · <tspan font-weight="700" fill="#8250df">1번 회원</tspan> · <tspan font-weight="700" fill="#8250df">7번 상품</tspan> · 2개 · 3/2</text>

  <text x="668" y="228" font-size="11" fill="#1a7f37" text-anchor="middle">주문 표는 <tspan font-weight="700">번호로만 가리킨다</tspan></text>
  <text x="668" y="251" font-size="11" fill="#57606a" text-anchor="middle">이 번호가 <tspan font-weight="700">키(key)</tspan> — 표와 표를 잇는 고리</text>

  <line x1="30" y1="286" x2="870" y2="286" stroke="#d0d7de"/>

  <!-- 2. 관계의 두 모양 -->
  <text x="30" y="320" font-size="15" font-weight="700" fill="#1f2328">2. 표는 두 가지 모양으로 이어진다</text>

  <!-- 1:N -->
  <rect x="30" y="342" width="400" height="222" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
  <text x="46" y="366" font-size="13" font-weight="700" fill="#0969da">일대다 (1 : N) — 한쪽만 여러 개</text>

  <rect x="52" y="392" width="120" height="60" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="112" y="418" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">회원</text>
  <text x="112" y="437" font-size="10" fill="#57606a" text-anchor="middle">홍길동 1명</text>

  <rect x="252" y="374" width="150" height="36" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="327" y="397" font-size="10.5" fill="#1f2328" text-anchor="middle">주문 55번</text>
  <rect x="252" y="416" width="150" height="36" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="327" y="439" font-size="10.5" fill="#1f2328" text-anchor="middle">주문 61번</text>
  <rect x="252" y="458" width="150" height="36" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="327" y="481" font-size="10.5" fill="#1f2328" text-anchor="middle">주문 72번</text>

  <line x1="178" y1="422" x2="246" y2="392" stroke="#8250df" stroke-width="1.5" marker-end="url(#t1-key)"/>
  <line x1="178" y1="422" x2="246" y2="434" stroke="#8250df" stroke-width="1.5" marker-end="url(#t1-key)"/>
  <line x1="178" y1="422" x2="246" y2="476" stroke="#8250df" stroke-width="1.5" marker-end="url(#t1-key)"/>

  <text x="230" y="522" font-size="10.5" fill="#57606a" text-anchor="middle">주문 표에 "누구의 주문인지" 칸 하나만 넣으면 끝</text>
  <text x="230" y="542" font-size="10.5" fill="#57606a" text-anchor="middle">글 1개 ↔ 댓글 여러 개도 같은 모양</text>

  <!-- N:M -->
  <rect x="450" y="342" width="420" height="222" rx="10" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/>
  <text x="466" y="366" font-size="13" font-weight="700" fill="#8250df">다대다 (N : M) — 양쪽 다 여러 개</text>

  <rect x="466" y="386" width="106" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="519" y="408" font-size="10.5" fill="#1f2328" text-anchor="middle">학생 A</text>
  <rect x="466" y="428" width="106" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="519" y="450" font-size="10.5" fill="#1f2328" text-anchor="middle">학생 B</text>

  <rect x="608" y="386" width="106" height="76" rx="6" fill="#fbefff" stroke="#8250df" stroke-width="2"/>
  <text x="661" y="412" font-size="11" font-weight="700" fill="#8250df" text-anchor="middle">수강신청</text>
  <text x="661" y="430" font-size="9.5" fill="#57606a" text-anchor="middle">연결 표</text>
  <text x="661" y="448" font-size="9.5" fill="#57606a" text-anchor="middle">학생번호+수업번호</text>

  <rect x="750" y="386" width="106" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="803" y="408" font-size="10.5" fill="#1f2328" text-anchor="middle">수업 1</text>
  <rect x="750" y="428" width="106" height="34" rx="5" fill="#ffffff" stroke="#d0d7de"/>
  <text x="803" y="450" font-size="10.5" fill="#1f2328" text-anchor="middle">수업 2</text>

  <line x1="578" y1="403" x2="602" y2="412" stroke="#8250df" stroke-width="1.5"/>
  <line x1="578" y1="445" x2="602" y2="436" stroke="#8250df" stroke-width="1.5"/>
  <line x1="720" y1="412" x2="744" y2="403" stroke="#8250df" stroke-width="1.5"/>
  <line x1="720" y1="436" x2="744" y2="445" stroke="#8250df" stroke-width="1.5"/>

  <text x="660" y="500" font-size="10.5" fill="#57606a" text-anchor="middle">한 칸에 여러 개를 욱여넣으면 검색이 깨진다.</text>
  <text x="660" y="520" font-size="10.5" fill="#57606a" text-anchor="middle">가운데 연결 표를 하나 두면</text>
  <text x="660" y="540" font-size="10.5" font-weight="700" fill="#8250df" text-anchor="middle">N:M이 1:N 두 개로 풀린다</text>

  <text x="30" y="588" font-size="12" fill="#1f2328">판단 기준 하나면 된다 — <tspan font-weight="700">"A 하나가 B 여럿을, 동시에 B 하나도 A 여럿을 갖나?"</tspan> 그렇다면 가운데 표가 필요하다.</text>
</svg>
