<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="백업의 3-2-1 규칙과 개인이 실천하는 예" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <text x="30" y="34" font-size="15" font-weight="700" fill="#1f2328">백업의 3-2-1 규칙 — "했다"가 아니라 "복구된다"가 중요하다</text>

  <rect x="30" y="56" width="266" height="120" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="163" y="90" font-size="22" font-weight="700" fill="#0969da" text-anchor="middle">3벌</text>
  <text x="163" y="118" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">원본 1 + 사본 2</text>
  <text x="163" y="141" font-size="10.5" fill="#57606a" text-anchor="middle">한 벌이 망가져도</text>
  <text x="163" y="159" font-size="10.5" fill="#57606a" text-anchor="middle">아직 두 벌이 남는다</text>

  <rect x="317" y="56" width="266" height="120" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="450" y="90" font-size="22" font-weight="700" fill="#1a7f37" text-anchor="middle">2종</text>
  <text x="450" y="118" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">서로 다른 매체 두 곳에</text>
  <text x="450" y="141" font-size="10.5" fill="#57606a" text-anchor="middle">한 종류가 통째로 망가져도</text>
  <text x="450" y="159" font-size="10.5" fill="#57606a" text-anchor="middle">다른 쪽은 살아남게</text>

  <rect x="604" y="56" width="266" height="120" rx="10" fill="#fff8c5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="737" y="90" font-size="22" font-weight="700" fill="#bc4c00" text-anchor="middle">1벌</text>
  <text x="737" y="118" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">다른 장소에</text>
  <text x="737" y="141" font-size="10.5" fill="#57606a" text-anchor="middle">화재·도난·랜섬웨어처럼</text>
  <text x="737" y="159" font-size="10.5" fill="#57606a" text-anchor="middle">한 장소를 통째로 잃을 때</text>

  <line x1="30" y1="206" x2="870" y2="206" stroke="#d0d7de"/>

  <text x="30" y="234" font-size="13" font-weight="700" fill="#1f2328">개인이 실천하면 이 세 개면 자동으로 충족된다</text>

  <rect x="30" y="250" width="266" height="76" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="163" y="278" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">노트북의 원본</text>
  <text x="163" y="302" font-size="10.5" fill="#57606a" text-anchor="middle">지금 작업하는 것</text>

  <rect x="317" y="250" width="266" height="76" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="450" y="278" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">외장하드 사본</text>
  <text x="450" y="302" font-size="10.5" fill="#57606a" text-anchor="middle">다른 매체 (2종 충족)</text>

  <rect x="604" y="250" width="266" height="76" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="737" y="278" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">클라우드 한 벌</text>
  <text x="737" y="302" font-size="10.5" fill="#57606a" text-anchor="middle">다른 장소 (off-site 충족)</text>

  <rect x="30" y="348" width="840" height="52" rx="8" fill="#ffe3e3" stroke="#cf222e" stroke-width="2"/>
  <text x="450" y="372" font-size="13" font-weight="700" fill="#cf222e" text-anchor="middle">그리고 가장 중요한 것 — 복구가 진짜 되는지 가끔 확인한다.</text>
  <text x="450" y="391" font-size="11" fill="#57606a" text-anchor="middle">픽사도 GitLab도 "백업이 있다"고 믿었지만, 정작 그때 백업은 고장 나 있었다.</text>
</svg>
