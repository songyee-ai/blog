<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="계좌 이체가 반쪽만 실행되는 문제와, 트랜잭션으로 묶어 막는 방식, 그리고 ACID 네 가지" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a2-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- 위험 -->
  <text x="30" y="34" font-size="15" font-weight="700" fill="#cf222e">묶지 않으면 — 반쪽만 실행될 수 있다</text>

  <rect x="30" y="54" width="200" height="76" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="82" font-size="12" font-weight="700" fill="#1f2328" text-anchor="middle">① A에서 만 원 빼기</text>
  <text x="130" y="106" font-size="11" fill="#1a7f37" text-anchor="middle">완료됨</text>

  <line x1="236" y1="92" x2="278" y2="92" stroke="#57606a" stroke-width="2" marker-end="url(#a2-r)"/>

  <rect x="284" y="54" width="200" height="76" rx="8" fill="#ffe3e3" stroke="#cf222e" stroke-width="2"/>
  <text x="384" y="82" font-size="12" font-weight="700" fill="#cf222e" text-anchor="middle">정전 · 오류</text>
  <text x="384" y="106" font-size="11" fill="#57606a" text-anchor="middle">여기서 멈춘다</text>

  <line x1="490" y1="92" x2="532" y2="92" stroke="#cf222e" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="511" y="82" font-size="16" font-weight="700" fill="#cf222e" text-anchor="middle">✕</text>

  <rect x="540" y="54" width="200" height="76" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="640" y="82" font-size="12" font-weight="700" fill="#57606a" text-anchor="middle">② B에 만 원 넣기</text>
  <text x="640" y="106" font-size="11" fill="#cf222e" text-anchor="middle">실행되지 않음</text>

  <text x="30" y="156" font-size="13" font-weight="700" fill="#cf222e">→ A의 돈은 사라졌는데 B는 못 받았다. 만 원이 증발한다.</text>

  <line x1="30" y1="180" x2="870" y2="180" stroke="#d0d7de"/>

  <!-- 안전 -->
  <text x="30" y="214" font-size="15" font-weight="700" fill="#1a7f37">묶으면 — 전부 되거나, 전부 안 되거나</text>

  <rect x="30" y="234" width="500" height="116" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="2"/>
  <text x="46" y="258" font-size="12.5" font-weight="700" fill="#1a7f37">트랜잭션 — 하나의 묶음으로 처리</text>

  <rect x="52" y="272" width="210" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="157" y="298" font-size="11.5" fill="#1f2328" text-anchor="middle">① A에서 빼기</text>
  <text x="157" y="317" font-size="10" fill="#57606a" text-anchor="middle">아직 확정 아님</text>

  <rect x="290" y="272" width="222" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="401" y="298" font-size="11.5" fill="#1f2328" text-anchor="middle">② B에 넣기</text>
  <text x="401" y="317" font-size="10" fill="#57606a" text-anchor="middle">아직 확정 아님</text>

  <text x="560" y="272" font-size="12" fill="#1f2328">둘 다 성공하면 → <tspan font-weight="700" fill="#1a7f37">확정</tspan></text>
  <text x="560" y="298" font-size="12" fill="#1f2328">하나라도 실패하면 → <tspan font-weight="700" fill="#bc4c00">전부 취소</tspan></text>
  <text x="560" y="330" font-size="11" fill="#57606a">중간에 반쪽만 남는 상태는</text>
  <text x="560" y="348" font-size="11" fill="#57606a">아예 존재하지 않는다.</text>

  <line x1="30" y1="378" x2="870" y2="378" stroke="#d0d7de"/>

  <!-- ACID -->
  <text x="30" y="406" font-size="13" font-weight="700" fill="#1f2328">이 성질을 포함한 네 가지 약속을 묶어 ACID라고 부른다</text>

  <rect x="30" y="420" width="198" height="80" rx="8" fill="none" stroke="#0969da" stroke-width="1.5"/>
  <text x="129" y="444" font-size="12.5" font-weight="700" fill="#0969da" text-anchor="middle">A · 원자성</text>
  <text x="129" y="466" font-size="10.5" fill="#57606a" text-anchor="middle">반쪽 실행은 없다</text>
  <text x="129" y="484" font-size="10.5" fill="#57606a" text-anchor="middle">전부 아니면 전부 취소</text>

  <rect x="244" y="420" width="198" height="80" rx="8" fill="none" stroke="#0969da" stroke-width="1.5"/>
  <text x="343" y="444" font-size="12.5" font-weight="700" fill="#0969da" text-anchor="middle">C · 일관성</text>
  <text x="343" y="466" font-size="10.5" fill="#57606a" text-anchor="middle">규칙에 어긋난 상태로</text>
  <text x="343" y="484" font-size="10.5" fill="#57606a" text-anchor="middle">끝나지 않는다</text>

  <rect x="458" y="420" width="198" height="80" rx="8" fill="none" stroke="#0969da" stroke-width="1.5"/>
  <text x="557" y="444" font-size="12.5" font-weight="700" fill="#0969da" text-anchor="middle">I · 고립성</text>
  <text x="557" y="466" font-size="10.5" fill="#57606a" text-anchor="middle">여러 명이 동시에 만져도</text>
  <text x="557" y="484" font-size="10.5" fill="#57606a" text-anchor="middle">서로 꼬이지 않는다</text>

  <rect x="672" y="420" width="198" height="80" rx="8" fill="none" stroke="#0969da" stroke-width="1.5"/>
  <text x="771" y="444" font-size="12.5" font-weight="700" fill="#0969da" text-anchor="middle">D · 지속성</text>
  <text x="771" y="466" font-size="10.5" fill="#57606a" text-anchor="middle">됐다고 하면 정전이 나도</text>
  <text x="771" y="484" font-size="10.5" fill="#57606a" text-anchor="middle">남아 있다</text>
</svg>
