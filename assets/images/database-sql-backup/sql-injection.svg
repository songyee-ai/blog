<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="사용자 입력을 명령문에 이어 붙이면 명령으로 실행되는 문제와, 파라미터화 쿼리로 막는 방식" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="s3-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cf222e"/>
    </marker>
    <marker id="s3-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <!-- 위험 -->
  <text x="30" y="34" font-size="15" font-weight="700" fill="#cf222e">위험 — 명령과 입력을 한 줄로 이어 붙이면</text>

  <rect x="30" y="52" width="230" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="145" y="76" font-size="11.5" font-weight="700" fill="#1f2328" text-anchor="middle">사용자가 이름 칸에 입력</text>
  <text x="145" y="100" font-size="10" font-family="Consolas,monospace" fill="#cf222e" text-anchor="middle">Robert'); DROP TABLE ...</text>

  <line x1="266" y1="88" x2="304" y2="88" stroke="#cf222e" stroke-width="2" marker-end="url(#s3-bad)"/>

  <rect x="310" y="52" width="290" height="72" rx="8" fill="#ffe3e3" stroke="#cf222e" stroke-width="2"/>
  <text x="455" y="76" font-size="11.5" font-weight="700" fill="#cf222e" text-anchor="middle">명령 문장에 그대로 이어 붙임</text>
  <text x="455" y="100" font-size="10" font-family="Consolas,monospace" fill="#1f2328" text-anchor="middle">... WHERE name = '입력값'</text>

  <line x1="606" y1="88" x2="644" y2="88" stroke="#cf222e" stroke-width="2" marker-end="url(#s3-bad)"/>

  <rect x="650" y="52" width="220" height="72" rx="8" fill="#1f2328"/>
  <text x="760" y="78" font-size="11.5" font-weight="700" fill="#ff7b72" text-anchor="middle">DB가 명령으로 실행</text>
  <text x="760" y="102" font-size="10.5" fill="#8b949e" text-anchor="middle">표가 통째로 지워진다</text>

  <text x="30" y="152" font-size="12" fill="#cf222e">DB가 <tspan font-weight="700">어디까지가 명령이고 어디부터가 데이터인지</tspan> 구분하지 못하는 것이 문제의 뿌리다.</text>

  <line x1="30" y1="176" x2="870" y2="176" stroke="#d0d7de"/>

  <!-- 안전 -->
  <text x="30" y="210" font-size="15" font-weight="700" fill="#1a7f37">안전 — 명령과 입력을 다른 통로로 보내면</text>

  <rect x="30" y="228" width="230" height="76" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="145" y="252" font-size="11.5" font-weight="700" fill="#0969da" text-anchor="middle">① 자리표만 비운 명령</text>
  <text x="145" y="276" font-size="10" font-family="Consolas,monospace" fill="#1f2328" text-anchor="middle">... WHERE name = ?</text>
  <text x="145" y="294" font-size="9.5" fill="#57606a" text-anchor="middle">모양이 먼저 고정된다</text>

  <rect x="30" y="316" width="230" height="76" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="145" y="340" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">② 입력값은 따로</text>
  <text x="145" y="364" font-size="10" font-family="Consolas,monospace" fill="#1f2328" text-anchor="middle">"Robert'); DROP..."</text>
  <text x="145" y="382" font-size="9.5" fill="#57606a" text-anchor="middle">별도 통로로 건넨다</text>

  <line x1="266" y1="266" x2="320" y2="296" stroke="#1a7f37" stroke-width="2" marker-end="url(#s3-ok)"/>
  <line x1="266" y1="354" x2="320" y2="324" stroke="#1a7f37" stroke-width="2" marker-end="url(#s3-ok)"/>

  <rect x="330" y="272" width="270" height="76" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <text x="465" y="298" font-size="12" font-weight="700" fill="#1a7f37" text-anchor="middle">DB가 입력을 데이터로만 취급</text>
  <text x="465" y="320" font-size="10.5" fill="#57606a" text-anchor="middle">명령으로 실행하지 않는다</text>
  <text x="465" y="338" font-size="10.5" fill="#57606a" text-anchor="middle">파라미터화 쿼리</text>

  <line x1="606" y1="310" x2="644" y2="310" stroke="#1a7f37" stroke-width="2" marker-end="url(#s3-ok)"/>

  <rect x="650" y="272" width="220" height="76" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="760" y="300" font-size="11.5" font-weight="700" fill="#1a7f37" text-anchor="middle">그런 이름을 찾을 뿐</text>
  <text x="760" y="324" font-size="10.5" fill="#57606a" text-anchor="middle">아무 일도 일어나지 않는다</text>

  <line x1="30" y1="422" x2="870" y2="422" stroke="#d0d7de"/>

  <text x="30" y="452" font-size="13" font-weight="700" fill="#1f2328">핵심 한 줄 — 레시피(명령)와 재료(입력)를 섞지 않는다.</text>
  <text x="30" y="478" font-size="12" fill="#57606a">AI에게 요구할 문장: "DB에 넣는 값은 문자열로 이어 붙이지 말고 파라미터화 쿼리로 처리해 줘."</text>
  <text x="30" y="500" font-size="12" fill="#57606a">25년 넘게 보안 위협 1위권을 지키는 공격인데, 막는 법은 이 한 줄로 끝난다.</text>
</svg>
