<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="8GB VRAM을 책상에 비유하면 짧은 대화는 모델 가중치와 KV 캐시가 모두 책상 위에 들어가지만, 32K 컨텍스트를 가득 채우면 8.8GB가 되어 넘친 부분이 시스템 RAM이라는 사물함으로 밀려나고 속도가 초당 한 자릿수 토큰으로 떨어진다">
  <text x="24" y="30" font-size="16" font-weight="700" fill="#57606a">책상(VRAM) 위에 다 펼쳐야 빠르다</text>
  <text x="24" y="52" font-size="13" fill="#57606a">예시: 8GB 그래픽카드에 8B 모델(4비트, 가중치 4.6GB)을 올릴 때</text>

  <!-- zones -->
  <rect x="200" y="70" width="440" height="190" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="420" y="92" font-size="13.5" font-weight="700" fill="#0550ae" text-anchor="middle">책상 = VRAM 8GB</text>
  <rect x="640" y="70" width="100" height="190" rx="6" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="690" y="92" font-size="13.5" font-weight="700" fill="#953800" text-anchor="middle">사물함</text>
  <text x="690" y="110" font-size="12" fill="#953800" text-anchor="middle">= 시스템 RAM</text>

  <!-- row 1 -->
  <text x="24" y="146" font-size="14" font-weight="700" fill="#57606a">짧은 대화 (4K)</text>
  <text x="24" y="165" font-size="12.5" fill="#57606a">합계 약 5.1GB</text>
  <rect x="210" y="130" width="253" height="34" rx="4" fill="#0969da"/>
  <text x="336" y="152" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">가중치 4.6GB</text>
  <rect x="463" y="130" width="29" height="34" rx="4" fill="#1a7f37"/>
  <text x="502" y="152" font-size="12.5" fill="#1f2328">KV 캐시 0.52GB</text>

  <!-- row 2 -->
  <text x="24" y="208" font-size="14" font-weight="700" fill="#57606a">32K를 가득 채움</text>
  <text x="24" y="227" font-size="12.5" fill="#57606a">합계 약 8.8GB</text>
  <rect x="210" y="192" width="253" height="34" rx="4" fill="#0969da"/>
  <text x="336" y="214" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">가중치 4.6GB</text>
  <rect x="463" y="192" width="177" height="34" fill="#1a7f37"/>
  <text x="551" y="214" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">KV 캐시 4.19GB</text>
  <rect x="640" y="192" width="44" height="34" rx="4" fill="#bc4c00"/>
  <text x="690" y="246" font-size="12" font-weight="700" fill="#953800" text-anchor="middle">넘친 만큼</text>

  <!-- result cards -->
  <rect x="20" y="284" width="352" height="112" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="38" y="312" font-size="14.5" font-weight="700" fill="#116329">전부 책상 위 — 100% GPU</text>
  <text x="38" y="338" font-size="13" fill="#1f2328">필요한 책이 손 닿는 곳에 다 있다</text>
  <text x="38" y="362" font-size="13" fill="#1f2328">초당 수십~백 토큰</text>
  <text x="38" y="384" font-size="12.5" fill="#57606a">ollama ps 에 100% GPU로 찍힌다</text>

  <rect x="388" y="284" width="352" height="112" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="406" y="312" font-size="14.5" font-weight="700" fill="#953800">일부가 사물함 — CPU 오프로딩</text>
  <text x="406" y="338" font-size="13" fill="#1f2328">한 글자 쓸 때마다 복도를 왕복한다</text>
  <text x="406" y="362" font-size="13" fill="#1f2328">초당 한 자릿수 토큰으로 주저앉는다</text>
  <text x="406" y="384" font-size="12.5" fill="#57606a">48%/52% CPU/GPU 처럼 찍힌다</text>

  <text x="24" y="424" font-size="13" fill="#57606a">책상 칸은 가중치만의 자리가 아니다. 가중치와 KV 캐시가 함께 들어가야 한다.</text>
  <text x="24" y="448" font-size="12.5" fill="#57606a">KV 캐시 수치는 8B급 GQA 모델을 16비트 캐시로 돌린 값(수업 자료)</text>
</svg>
