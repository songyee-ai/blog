<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">같은 "읽어 줘", 다른 모양의 답</text>
  <text x="24" y="50" font-size="12" fill="#57606a">답의 모양(자료형)이 다르면 필요한 도구도, 맞았는지 확인하는 방법도 다르다.</text>

  <!-- 입력 -->
  <rect x="24" y="72" width="130" height="92" rx="10" fill="#f6f8fa" stroke="#57606a"/>
  <text x="89" y="104" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">스캔한 계약서</text>
  <text x="89" y="124" font-size="10.5" fill="#57606a" text-anchor="middle">"금액만 뽑아 줘"</text>
  <text x="89" y="148" font-size="10.5" fill="#57606a" text-anchor="middle">받아쓰기 시험</text>

  <rect x="24" y="190" width="130" height="92" rx="10" fill="#f6f8fa" stroke="#57606a"/>
  <text x="89" y="222" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="middle">공장 사진 한 장</text>
  <text x="89" y="242" font-size="10.5" fill="#57606a" text-anchor="middle">"분석해 줘"</text>
  <text x="89" y="266" font-size="10.5" fill="#57606a" text-anchor="middle">숨은그림찾기 · 색칠공부</text>

  <g stroke="#57606a" stroke-width="1.5" fill="none">
    <path d="M156 118 L196 118"/>
    <path d="M156 236 C176 236 176 176 196 176"/>
    <path d="M156 236 L196 236"/>
    <path d="M156 236 C176 236 176 296 196 296"/>
  </g>

  <!-- 출력 -->
  <rect x="200" y="96" width="536" height="44" rx="8" fill="#ddf4ff" stroke="#0969da"/>
  <text x="216" y="116" font-size="12" font-weight="700" fill="#0969da">값</text>
  <text x="262" y="116" font-size="11" fill="#1f2328">계약 금액 32,000,000 — OCR로 글자를 꺼내고 항목과 짝짓는다</text>
  <text x="262" y="132" font-size="10.5" fill="#57606a">확인: 검산할 수 있다 (부가세가 10분의 1인가, 합계가 맞나)</text>

  <rect x="200" y="154" width="536" height="44" rx="8" fill="#fff8c5" stroke="#9a6700"/>
  <text x="216" y="174" font-size="12" font-weight="700" fill="#9a6700">위치</text>
  <text x="262" y="174" font-size="11" fill="#1f2328">"흠집은 여기" 사각형 좌표 + 이름 + 점수 — 객체 탐지</text>
  <text x="262" y="190" font-size="10.5" fill="#57606a">확인: 정답 상자와 얼마나 겹치나 (IoU)</text>

  <rect x="200" y="212" width="536" height="44" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="216" y="232" font-size="12" font-weight="700" fill="#1a7f37">경계</text>
  <text x="262" y="232" font-size="11" fill="#1f2328">"마모는 여기까지" 픽셀마다 칠한 지도 → 면적 — 세그멘테이션</text>
  <text x="262" y="248" font-size="10.5" fill="#57606a">확인: 정답 마스크와의 겹침, 특히 가장자리</text>

  <rect x="200" y="270" width="536" height="44" rx="8" fill="#ffe3e3" stroke="#cf222e"/>
  <text x="216" y="290" font-size="12" font-weight="700" fill="#cf222e">새 그림</text>
  <text x="274" y="290" font-size="11" fill="#1f2328">"비슷한 분위기로 한 장" — 원본에 없던 걸 만든다 (다음 수업)</text>
  <text x="274" y="306" font-size="10.5" fill="#57606a">확인: 대조할 원본 정답이 없다</text>
</svg>
