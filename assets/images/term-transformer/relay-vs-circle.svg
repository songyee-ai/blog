<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="옛 RNN은 귓속말 전달처럼 한 단어씩 차례로 넘기며 앞 말이 흐려지고, 트랜스포머는 둘러앉아 모든 토큰이 모든 토큰을 동시에 본다. 같은 뼈대에서 BERT, GPT, ViT와 Whisper가 갈라져 나왔다">
  <defs>
    <marker id="tf-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  </defs>

  <!-- 왼쪽: RNN -->
  <rect x="20" y="20" width="350" height="230" rx="10" fill="#fff8f0" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="40" y="50" font-size="16" font-weight="700" fill="#bc4c00">옛 방식(RNN) — 귓속말 전달</text>

  <circle cx="60" cy="130" r="26" fill="#bc4c00" opacity="0.95"/>
  <circle cx="125" cy="130" r="26" fill="#bc4c00" opacity="0.75"/>
  <circle cx="190" cy="130" r="26" fill="#bc4c00" opacity="0.55"/>
  <circle cx="255" cy="130" r="26" fill="#bc4c00" opacity="0.4"/>
  <circle cx="320" cy="130" r="26" fill="#bc4c00" opacity="0.28"/>
  <text x="60" y="135" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">나는</text>
  <text x="125" y="135" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">어제</text>
  <text x="190" y="135" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">도서관</text>
  <text x="255" y="135" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="700">책을</text>
  <text x="320" y="135" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="700">빌렸다</text>
  <line x1="87" y1="130" x2="97" y2="130" stroke="#bc4c00" stroke-width="2" marker-end="url(#tf-ar)"/>
  <line x1="152" y1="130" x2="162" y2="130" stroke="#bc4c00" stroke-width="2" marker-end="url(#tf-ar)"/>
  <line x1="217" y1="130" x2="227" y2="130" stroke="#bc4c00" stroke-width="2" marker-end="url(#tf-ar)"/>
  <line x1="282" y1="130" x2="292" y2="130" stroke="#bc4c00" stroke-width="2" marker-end="url(#tf-ar)"/>

  <text x="40" y="195" font-size="14" fill="#1f2328">앞 단어가 끝나야 다음 차례가 온다</text>
  <text x="40" y="222" font-size="14" fill="#1f2328">뒤로 갈수록 "나는"이 흐려진다</text>

  <!-- 오른쪽: 트랜스포머 -->
  <rect x="390" y="20" width="350" height="230" rx="10" fill="#eef6ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="410" y="50" font-size="16" font-weight="700" fill="#0969da">트랜스포머 — 둘러앉아 서로 보기</text>

  <g stroke="#0969da" stroke-width="1.3" opacity="0.55">
    <line x1="565" y1="85" x2="622" y2="126"/>
    <line x1="565" y1="85" x2="600" y2="194"/>
    <line x1="565" y1="85" x2="530" y2="194"/>
    <line x1="565" y1="85" x2="508" y2="126"/>
    <line x1="622" y1="126" x2="600" y2="194"/>
    <line x1="622" y1="126" x2="530" y2="194"/>
    <line x1="622" y1="126" x2="508" y2="126"/>
    <line x1="600" y1="194" x2="530" y2="194"/>
    <line x1="600" y1="194" x2="508" y2="126"/>
    <line x1="530" y1="194" x2="508" y2="126"/>
  </g>
  <g fill="#0969da">
    <circle cx="565" cy="85" r="24"/>
    <circle cx="622" cy="126" r="24"/>
    <circle cx="600" cy="194" r="24"/>
    <circle cx="530" cy="194" r="24"/>
    <circle cx="508" cy="126" r="24"/>
  </g>
  <g font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700">
    <text x="565" y="90">나는</text>
    <text x="622" y="131">어제</text>
    <text x="600" y="199">도서관</text>
    <text x="530" y="199">책을</text>
    <text x="508" y="131">빌렸다</text>
  </g>
  <text x="410" y="238" font-size="14" fill="#1f2328">모두가 모두를 한꺼번에 → GPU로 병렬 계산</text>

  <!-- 아래: 갈래 -->
  <text x="20" y="284" font-size="15" font-weight="700" fill="#57606a">같은 뼈대에서 갈라져 나온 것들</text>

  <rect x="20" y="298" width="230" height="106" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="38" y="326" font-size="15" font-weight="700" fill="#0969da">인코더만 → BERT</text>
  <text x="38" y="354" font-size="14" fill="#1f2328">빈칸 채우기</text>
  <text x="38" y="380" font-size="13" fill="#57606a">앞뒤 보고 가린 말 맞히기</text>

  <rect x="265" y="298" width="230" height="106" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="283" y="326" font-size="15" font-weight="700" fill="#0969da">디코더만 → GPT</text>
  <text x="283" y="354" font-size="14" fill="#1f2328">이어 쓰기</text>
  <text x="283" y="380" font-size="13" fill="#57606a">다음 토큰을 하나씩 예측</text>

  <rect x="510" y="298" width="230" height="106" rx="10" fill="#effaf2" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="528" y="326" font-size="15" font-weight="700" fill="#1a7f37">언어 밖으로</text>
  <text x="528" y="354" font-size="14" fill="#1f2328">ViT(이미지) · Whisper(소리)</text>
  <text x="528" y="380" font-size="13" fill="#57606a">토큰으로 자르면 무엇이든</text>
</svg>
