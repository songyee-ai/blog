<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">모델 바깥에서 고칠 수 있는 네 곳</text>
  <text x="24" y="50" font-size="12" fill="#57606a">결과가 이상하면 문구만 다시 쓰기 전에, 네 곳 중 무엇이 빠졌는지부터 본다. 한 번에 하나씩 바꾼다.</text>

  <rect x="300" y="146" width="160" height="70" rx="35" fill="#f6f8fa" stroke="#57606a"/>
  <text x="380" y="176" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2328">모델</text>
  <text x="380" y="196" font-size="11.5" text-anchor="middle" fill="#57606a">읽고 판단해 다음을 고른다</text>

  <g font-size="12">
    <rect x="24" y="70" width="250" height="100" rx="10" fill="#ddf4ff" stroke="#0969da"/>
    <text x="40" y="94" font-size="13.5" font-weight="700" fill="#0969da">지시 — 무엇을 어떻게</text>
    <text x="40" y="116" fill="#1f2328">해 달라는 일, 결과 모양, 넘으면 안 되는 선</text>
    <text x="40" y="136" fill="#57606a">이럴 때 손본다: 길이·형식이 어긋날 때</text>
    <text x="40" y="156" fill="#57606a">예: "공백 포함 300자 안으로"</text>

    <rect x="486" y="70" width="250" height="100" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="502" y="94" font-size="13.5" font-weight="700" fill="#1a7f37">맥락 — 무엇을 읽게</text>
    <text x="502" y="116" fill="#1f2328">같이 건네는 자료와 앞 대화</text>
    <text x="502" y="136" fill="#57606a">이럴 때 손본다: 사실이 틀리거나 빠질 때</text>
    <text x="502" y="156" fill="#57606a">예: 상품 사양표를 함께 넣기</text>

    <rect x="24" y="200" width="250" height="100" rx="10" fill="#fff8c5" stroke="#9a6700"/>
    <text x="40" y="224" font-size="13.5" font-weight="700" fill="#9a6700">도구 — 무엇을 할 수 있게</text>
    <text x="40" y="246" fill="#1f2328">부를 수 있는 기능과 허락 범위</text>
    <text x="40" y="266" fill="#57606a">이럴 때 손본다: 직접 확인할 값이 있을 때</text>
    <text x="40" y="286" fill="#57606a">예: 재고 조회 기능을 붙인다</text>

    <rect x="486" y="200" width="250" height="100" rx="10" fill="#fbefff" stroke="#8250df"/>
    <text x="502" y="224" font-size="13.5" font-weight="700" fill="#8250df">루프 — 언제 검사·반복</text>
    <text x="502" y="246" fill="#1f2328">답이 나온 뒤 맞춰 보고 다시 할지</text>
    <text x="502" y="266" fill="#57606a">이럴 때 손본다: 틀린 답이 그대로 나갈 때</text>
    <text x="502" y="286" fill="#57606a">예: 쓴 글을 사양표와 대조하기</text>
  </g>
  <line x1="274" y1="130" x2="304" y2="160" stroke="#8c959f"/>
  <line x1="486" y1="130" x2="456" y2="160" stroke="#8c959f"/>
  <line x1="274" y1="240" x2="304" y2="204" stroke="#8c959f"/>
  <line x1="486" y1="240" x2="456" y2="204" stroke="#8c959f"/>
  <text x="380" y="318" font-size="11" text-anchor="middle" fill="#57606a">예시는 상품 설명을 쓰게 하는 경우로 바꿔 든 것이다</text>
</svg>
