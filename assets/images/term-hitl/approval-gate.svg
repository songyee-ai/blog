<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="사람 승인 지점이 있는 흐름. 에이전트가 wf.json 초안을 만들어 노드와 연결을 보여 주면 흐름이 멈추고 사람이 읽는다. 확인했다고 답하면 워크플로 생성으로 넘어가고, 고칠 곳이 있으면 초안 만들기로 돌아간다">
  <defs>
    <marker id="hl-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="hl-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
    <marker id="hl-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
  </defs>

  <!-- 1. 초안 -->
  <rect x="20" y="40" width="200" height="130" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="38" y="70" font-size="15" font-weight="700" fill="#0969da">① 에이전트가 준비</text>
  <rect x="34" y="86" width="172" height="68" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="48" y="112" font-size="13" fill="#1f2328">wf.json 초안을 쓰고</text>
  <text x="48" y="136" font-size="13" fill="#1f2328">노드와 연결을 보여 줌</text>

  <!-- 2. 멈춤 -->
  <rect x="280" y="40" width="200" height="130" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="2.5"/>
  <text x="298" y="70" font-size="15" font-weight="700" fill="#bc4c00">② 여기서 멈춤</text>
  <rect x="294" y="86" width="172" height="68" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="308" y="112" font-size="13" fill="#1f2328">사람이 이름·URL·</text>
  <text x="308" y="136" font-size="13" fill="#1f2328">연결을 읽고 판단</text>

  <!-- 3. 실행 -->
  <rect x="540" y="40" width="200" height="130" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="558" y="70" font-size="15" font-weight="700" fill="#1a7f37">③ 그때 실행</text>
  <rect x="554" y="86" width="172" height="68" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="568" y="112" font-size="13" fill="#1f2328">workflow create로</text>
  <text x="568" y="136" font-size="13" fill="#1f2328">서버에 실제로 만듦</text>

  <!-- 화살표 -->
  <line x1="222" y1="120" x2="276" y2="120" stroke="#0969da" stroke-width="2" marker-end="url(#hl-blue)"/>
  <line x1="482" y1="120" x2="536" y2="120" stroke="#1a7f37" stroke-width="2" marker-end="url(#hl-green)"/>
  <text x="509" y="108" font-size="13" fill="#1a7f37" text-anchor="middle">허락</text>
  <path d="M380,172 L380,214 L120,214 L120,176" fill="none" stroke="#bc4c00" stroke-width="2" marker-end="url(#hl-orange)"/>
  <text x="250" y="236" font-size="13" fill="#bc4c00" text-anchor="middle">고칠 곳이 있으면 초안으로 되돌림</text>

  <!-- 아래 설명 -->
  <rect x="20" y="258" width="720" height="66" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="1"/>
  <text x="38" y="286" font-size="14" font-weight="700" fill="#bc4c00">멈춤 지점은 되돌리기 어려운 일 바로 앞에 둔다</text>
  <text x="38" y="310" font-size="13" fill="#bc4c00">만들기 · 보내기 · 고치기 · 지우기처럼 바깥 상태를 바꾸는 단계. 읽기만 하는 단계는 그냥 지나간다</text>
</svg>
