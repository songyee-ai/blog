<svg viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">만들기 전에 적은 기준 셋, 만든 뒤 나온 결과</text>
  <text x="24" y="50" font-size="12" fill="#57606a">정답과 판정 규칙(R1 그림자 제외 · R2 판매 상품만 · R3 여러 개면 전부)은 모델을 돌리기 전에 확정했다.</text>

  <g font-size="12">
    <rect x="24" y="66" width="712" height="62" rx="10" fill="#ffebe9" stroke="#cf222e"/>
    <text x="40" y="90" font-weight="700" fill="#cf222e">A. 품질 — 12장 중 9장 이상 합격</text>
    <text x="40" y="112" fill="#1f2328">U²-Net 7/12 · SAM 0/12</text>
    <text x="720" y="100" text-anchor="end" font-weight="700" fill="#cf222e" font-size="14">미달</text>

    <rect x="24" y="138" width="712" height="62" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="40" y="162" font-weight="700" fill="#57606a">B. 시간 — 현행 수작업의 1/3 이하</text>
    <text x="40" y="184" fill="#1f2328">포토샵이 없어 현행을 못 쟀고, 공개 수치는 판매사 자료뿐이라 쓰지 않았다</text>
    <text x="720" y="172" text-anchor="end" font-weight="700" fill="#57606a" font-size="14">판정 불가</text>

    <rect x="24" y="210" width="712" height="62" rx="10" fill="#fff8c5" stroke="#9a6700"/>
    <text x="40" y="234" font-weight="700" fill="#9a6700">C. 신뢰도 — 불합격할 장을 미리 표시</text>
    <text x="40" y="256" fill="#1f2328">5건 중 4건 표시, 오탐 0건 (단, 임계값은 결과를 보고 정해 새 사진에서 재검증 필요)</text>
    <text x="720" y="244" text-anchor="end" font-weight="700" fill="#9a6700" font-size="14">부분 달성</text>
  </g>
</svg>
