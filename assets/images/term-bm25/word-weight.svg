<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="질문 낱말 커튼과 시험성적서로 짧은 글 4개를 BM25로 채점했다. 커튼은 4개 중 3개에 나와 무게 0.36, 시험성적서는 1개에만 나와 무게 1.20이다. 점수는 D2 1.70, D1 0.52, D4 0.39, D3 0.00 순서이고, D1은 커튼이 세 번 나와도 조금만 오른다">
  <!-- 질문 -->
  <rect x="20" y="20" width="720" height="60" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="36" y="56" font-size="15" font-weight="700" fill="#0969da">질문 낱말</text>
  <rect x="128" y="36" width="64" height="28" rx="6" fill="#ffffff" stroke="#0969da"/>
  <text x="160" y="55" font-size="14" fill="#1f2328" text-anchor="middle">커튼</text>
  <rect x="202" y="36" width="96" height="28" rx="6" fill="#ffffff" stroke="#0969da"/>
  <text x="250" y="55" font-size="14" fill="#1f2328" text-anchor="middle">시험성적서</text>
  <text x="312" y="55" font-size="13" fill="#1f2328">로 짧은 글 4개(D1~D4)를 채점한다</text>

  <!-- 낱말 무게 -->
  <rect x="20" y="96" width="250" height="284" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="36" y="124" font-size="15" font-weight="700" fill="#1f2328">① 낱말마다 무게</text>
  <text x="36" y="158" font-size="14" font-weight="700" fill="#1f2328">커튼</text>
  <text x="36" y="180" font-size="13" fill="#57606a">4개 중 3개에 나온다</text>
  <rect x="36" y="190" width="43" height="14" rx="3" fill="#bc4c00" fill-opacity="0.7"/>
  <text x="88" y="202" font-size="13" fill="#1f2328">무게 0.36</text>
  <text x="36" y="238" font-size="14" font-weight="700" fill="#1f2328">시험성적서</text>
  <text x="36" y="260" font-size="13" fill="#57606a">4개 중 1개에만 나온다</text>
  <rect x="36" y="270" width="144" height="14" rx="3" fill="#1a7f37"/>
  <text x="188" y="282" font-size="13" fill="#1f2328">무게 1.20</text>
  <text x="36" y="330" font-size="13" fill="#1f2328">흔한 낱말은 가볍고</text>
  <text x="36" y="352" font-size="13" fill="#1f2328">드문 낱말은 무겁다</text>

  <!-- 글마다 점수 -->
  <rect x="286" y="96" width="454" height="284" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="302" y="124" font-size="15" font-weight="700" fill="#1f2328">② 글마다 점수 (높은 순)</text>

  <text x="302" y="156" font-size="13" fill="#1f2328"><tspan font-weight="700">D2</tspan>  커튼 · 시험성적서 · 제출</text>
  <rect x="302" y="164" width="255" height="14" rx="3" fill="#1a7f37"/>
  <text x="565" y="176" font-size="13" font-weight="700" fill="#1a7f37">1.70</text>
  <text x="606" y="176" font-size="13" fill="#57606a">드문 낱말 덕분</text>

  <text x="302" y="214" font-size="13" fill="#1f2328"><tspan font-weight="700">D1</tspan>  커튼 · 커튼 · 커튼 · 색상 · 안내</text>
  <rect x="302" y="222" width="78" height="14" rx="3" fill="#bc4c00" fill-opacity="0.7"/>
  <text x="388" y="234" font-size="13" font-weight="700" fill="#1f2328">0.52</text>
  <text x="430" y="234" font-size="13" fill="#57606a">세 번 나와도 조금만 오른다</text>

  <text x="302" y="272" font-size="13" fill="#1f2328"><tspan font-weight="700">D4</tspan>  커튼 · 세탁 · 방법</text>
  <rect x="302" y="280" width="58" height="14" rx="3" fill="#bc4c00" fill-opacity="0.7"/>
  <text x="368" y="292" font-size="13" font-weight="700" fill="#1f2328">0.39</text>

  <text x="302" y="330" font-size="13" fill="#1f2328"><tspan font-weight="700">D3</tspan>  침구 · 세탁 · 방법 · 안내</text>
  <text x="302" y="354" font-size="13" font-weight="700" fill="#1f2328">0.00</text>
  <text x="344" y="354" font-size="13" fill="#57606a">질문 낱말이 하나도 없다</text>
</svg>
