<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="420" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="word2vec이 만든 단어 지도. 같이 쓰이는 단어끼리 가까이 모이고, 왕에서 여왕으로 가는 방향이 남자에서 여자로 가는 방향과 나란하다. 뜻은 달라도 자주 함께 쓰인 버그가 바다 근처에 끼어 있다">
  <defs>
    <marker id="wv-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/></marker>
  </defs>

  <rect x="20" y="20" width="720" height="380" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="50" font-size="16" font-weight="700" fill="#1f2328">단어 지도 — 같이 쓰이는 단어끼리 모인다</text>
  <text x="40" y="74" font-size="13" fill="#57606a">실제로는 방향이 아주 많은 공간. 여기선 두 방향만 남겨 그렸다</text>

  <!-- 바다 무리 -->
  <ellipse cx="170" cy="200" rx="120" ry="80" fill="#0969da" opacity="0.08" stroke="#0969da" stroke-width="1.2"/>
  <g font-size="14" fill="#0969da">
    <circle cx="150" cy="185" r="5" fill="#0969da"/><text x="160" y="190" font-weight="700">바다</text>
    <circle cx="110" cy="220" r="4" fill="#0969da"/><text x="118" y="225">해변</text>
    <circle cx="200" cy="225" r="4" fill="#0969da"/><text x="208" y="230">파도</text>
    <circle cx="100" cy="160" r="4" fill="#0969da"/><text x="108" y="165">항구</text>
    <circle cx="215" cy="160" r="4" fill="#0969da"/><text x="223" y="165">모래</text>
  </g>
  <circle cx="300" cy="275" r="5" fill="#bc4c00"/>
  <text x="310" y="280" font-size="14" font-weight="700" fill="#bc4c00">버그 ?</text>
  <text x="200" y="308" font-size="13" fill="#bc4c00">뜻은 멀어도 쓰임이 겹쳐 가깝다</text>

  <!-- 커피 무리 -->
  <ellipse cx="170" cy="355" rx="95" ry="30" fill="#1a7f37" opacity="0.08" stroke="#1a7f37" stroke-width="1.2"/>
  <g font-size="14" fill="#1a7f37">
    <circle cx="110" cy="355" r="4" fill="#1a7f37"/><text x="118" y="360">커피</text>
    <circle cx="180" cy="348" r="4" fill="#1a7f37"/><text x="188" y="353">우유</text>
  </g>

  <!-- 왕 / 여왕 평행사변형 -->
  <g stroke="#bc4c00" stroke-width="2" fill="none">
    <line x1="470" y1="300" x2="610" y2="300" marker-end="url(#wv-ar)"/>
    <line x1="470" y1="160" x2="610" y2="160" marker-end="url(#wv-ar)"/>
  </g>
  <g stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="460" y1="170" x2="460" y2="290"/>
    <line x1="620" y1="170" x2="620" y2="290"/>
  </g>
  <g font-size="15" font-weight="700" fill="#1f2328">
    <circle cx="460" cy="160" r="6" fill="#1f2328"/><text x="420" y="145">왕</text>
    <circle cx="620" cy="160" r="6" fill="#1f2328"/><text x="630" y="145">여왕</text>
    <circle cx="460" cy="300" r="6" fill="#1f2328"/><text x="410" y="330">남자</text>
    <circle cx="620" cy="300" r="6" fill="#1f2328"/><text x="630" y="330">여자</text>
  </g>
  <text x="540" y="235" font-size="13" fill="#bc4c00" text-anchor="middle">두 화살표가 나란하다</text>
  <text x="440" y="378" font-size="14" fill="#1f2328">왕 − 남자 + 여자 ≈ <tspan font-weight="700" fill="#bc4c00">여왕</tspan></text>
</svg>
