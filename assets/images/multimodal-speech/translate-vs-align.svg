<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">번역하기 vs 같은 지도에 놓기</text>
  <text x="24" y="50" font-size="12" fill="#57606a">그림을 먼저 글로 옮기면, 글로 옮기지 못한 단서는 거기서 사라진다.</text>

  <rect x="24" y="66" width="712" height="104" rx="10" fill="#fff8c5" stroke="#9a6700"/>
  <text x="40" y="90" font-size="13" font-weight="700" fill="#9a6700">① 번역 — 그림을 설명문으로 바꾼 뒤 언어 모델에 넘긴다</text>
  <rect x="40" y="104" width="130" height="50" rx="8" fill="none" stroke="#9a6700"/>
  <text x="105" y="126" font-size="12" text-anchor="middle" fill="#1f2328">설비 사진</text>
  <text x="105" y="143" font-size="10.5" text-anchor="middle" fill="#57606a">녹슨 위치·배선</text>
  <text x="182" y="134" font-size="16" fill="#9a6700">→</text>
  <rect x="206" y="104" width="190" height="50" rx="8" fill="none" stroke="#9a6700"/>
  <text x="301" y="126" font-size="12" text-anchor="middle" fill="#1f2328">"기계 사진입니다"</text>
  <text x="301" y="143" font-size="10.5" text-anchor="middle" fill="#57606a">한 줄 설명문</text>
  <text x="408" y="134" font-size="16" fill="#9a6700">→</text>
  <rect x="432" y="104" width="120" height="50" rx="8" fill="none" stroke="#9a6700"/>
  <text x="492" y="134" font-size="12" text-anchor="middle" fill="#1f2328">언어 모델</text>
  <text x="574" y="126" font-size="11.5" fill="#9a6700" font-weight="700">녹슨 위치는</text>
  <text x="574" y="143" font-size="11.5" fill="#9a6700" font-weight="700">이미 사라졌다</text>

  <rect x="24" y="182" width="712" height="160" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="40" y="206" font-size="13" font-weight="700" fill="#0969da">② 정렬 — 그림과 글을 각자 숫자로 바꿔 같은 지도 위에 놓는다</text>
  <rect x="40" y="222" width="120" height="40" rx="8" fill="none" stroke="#0969da"/>
  <text x="100" y="247" font-size="12" text-anchor="middle" fill="#1f2328">개 사진</text>
  <rect x="40" y="284" width="120" height="40" rx="8" fill="none" stroke="#0969da"/>
  <text x="100" y="309" font-size="12" text-anchor="middle" fill="#1f2328">"개 사진"</text>
  <text x="170" y="247" font-size="11" fill="#57606a">그림 인코더 →</text>
  <text x="170" y="309" font-size="11" fill="#57606a">글 인코더 →</text>
  <rect x="270" y="218" width="300" height="112" rx="8" fill="none" stroke="#0969da" stroke-dasharray="4 4"/>
  <text x="420" y="236" font-size="11" text-anchor="middle" fill="#57606a">같은 지도(임베딩 공간)</text>
  <circle cx="330" cy="272" r="7" fill="#0969da"/>
  <circle cx="352" cy="288" r="7" fill="none" stroke="#0969da" stroke-width="2.5"/>
  <text x="340" y="318" font-size="11" text-anchor="middle" fill="#0969da" font-weight="700">가깝다</text>
  <circle cx="510" cy="262" r="7" fill="none" stroke="#57606a" stroke-width="2.5"/>
  <text x="510" y="292" font-size="11" text-anchor="middle" fill="#57606a">"고양이 사진"</text>
  <text x="510" y="308" font-size="11" text-anchor="middle" fill="#57606a">멀다</text>
  <text x="590" y="258" font-size="11" fill="#1f2328">● 그림</text>
  <text x="590" y="278" font-size="11" fill="#1f2328">○ 글</text>
  <text x="590" y="306" font-size="10.5" fill="#57606a">거리를 숫자로</text>
  <text x="590" y="321" font-size="10.5" fill="#57606a">잴 수 있다</text>
</svg>
