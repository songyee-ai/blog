<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="검색어를 들고 책등 제목을 훑어 점수를 매기고 그 비율만큼 책 내용을 섞어 오는 구조이며 그것이라는 대명사가 사과의 뜻을 85퍼센트 흡수하는 과정도 같다">
  <defs>
    <marker id="qk-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>

  <text x="30" y="30" font-size="15" font-weight="700" fill="#1f2328">도서관에서 책 찾기</text>
  <text x="30" y="50" font-size="10.5" fill="#57606a">한 권만 빌리는 게 아니다. 점수만큼 비율을 매겨 여러 권의 내용을 겹쳐 읽는다.</text>

  <rect x="30" y="66" width="200" height="70" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="48" y="90" font-size="12" font-weight="700" fill="#0969da">Q — 찾는 것</text>
  <text x="48" y="110" font-size="10.5" fill="#1f2328">"공룡에 대해</text>
  <text x="48" y="126" font-size="10.5" fill="#1f2328">　알고 싶어"</text>

  <line x1="234" y1="101" x2="270" y2="101" stroke="#57606a" stroke-width="1.5" marker-end="url(#qk-ar)"/>
  <text x="252" y="93" font-size="9" fill="#57606a" text-anchor="middle">훑는다</text>

  <text x="290" y="82" font-size="11" font-weight="700" fill="#8250df">K — 책등 제목</text>
  <text x="530" y="82" font-size="11" font-weight="700" fill="#bc4c00">점수 → 비율</text>
  <text x="660" y="82" font-size="11" font-weight="700" fill="#1a7f37">V — 펼치면 나오는 내용</text>

  <rect x="286" y="90" width="216" height="30" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/>
  <text x="300" y="110" font-size="11" fill="#1f2328">『공룡백과』</text>
  <rect x="524" y="90" width="106" height="30" rx="5" fill="#fff8c5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="577" y="110" font-size="11.5" font-weight="700" fill="#bc4c00" text-anchor="middle">70%</text>
  <rect x="652" y="90" width="218" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="666" y="110" font-size="10.5" fill="#1f2328">티라노사우루스는…</text>

  <rect x="286" y="126" width="216" height="30" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/>
  <text x="300" y="146" font-size="11" fill="#1f2328">『파충류 도감』</text>
  <rect x="524" y="126" width="106" height="30" rx="5" fill="#fff8c5" stroke="#bc4c00" stroke-width="1.5" opacity="0.6"/>
  <text x="577" y="146" font-size="11.5" font-weight="700" fill="#bc4c00" text-anchor="middle">20%</text>
  <rect x="652" y="126" width="218" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" opacity="0.6"/>
  <text x="666" y="146" font-size="10.5" fill="#1f2328">비늘과 변온성은…</text>

  <rect x="286" y="162" width="216" height="30" rx="5" fill="#f6f8fa" stroke="#8250df" stroke-width="1.5"/>
  <text x="300" y="182" font-size="11" fill="#1f2328">『집밥 요리책』</text>
  <rect x="524" y="162" width="106" height="30" rx="5" fill="#fff8c5" stroke="#bc4c00" stroke-width="1.5" opacity="0.25"/>
  <text x="577" y="182" font-size="11.5" font-weight="700" fill="#bc4c00" text-anchor="middle">1%</text>
  <rect x="652" y="162" width="218" height="30" rx="5" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5" opacity="0.25"/>
  <text x="666" y="182" font-size="10.5" fill="#1f2328">간장을 두 큰술…</text>

  <text x="286" y="214" font-size="10.5" fill="#57606a">제목은 <tspan font-weight="700">찾기 좋게</tspan> 짧고, 내용은 <tspan font-weight="700">실제로 쓸모 있다</tspan>. 찾는 용도(K)와 쓰는 용도(V)를 나눈 것이 핵심이다.</text>

  <line x1="30" y1="240" x2="870" y2="240" stroke="#d0d7de" stroke-width="1"/>
  <text x="30" y="266" font-size="12.5" font-weight="700" fill="#1f2328">문장에서도 똑같이 벌어진다</text>
  <text x="30" y="288" font-size="11.5" fill="#1f2328">"민수가 사과를 떨어뜨렸는데, <tspan font-weight="700" fill="#0969da">그것</tspan>이 굴러갔다."</text>
  <text x="30" y="308" font-size="10.5" fill="#57606a">"그것"의 Q — 굴러갈 수 있는 물체를 찾는다</text>

  <rect x="30" y="320" width="186" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="46" y="340" font-size="11" fill="#1f2328">민수</text>
  <text x="46" y="357" font-size="10" fill="#57606a">사람, 주어</text>
  <rect x="46" y="368" width="6" height="12" rx="2" fill="#0969da" opacity="0.3"/>
  <text x="60" y="378" font-size="10.5" fill="#57606a">0.05</text>

  <rect x="228" y="320" width="186" height="44" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="244" y="340" font-size="11" font-weight="700" fill="#0969da">사과</text>
  <text x="244" y="357" font-size="10" fill="#57606a">물체, 둥글고 작다</text>
  <rect x="244" y="368" width="102" height="12" rx="2" fill="#0969da"/>
  <text x="406" y="378" font-size="10.5" font-weight="700" fill="#0969da" text-anchor="end">0.85</text>

  <rect x="426" y="320" width="186" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.3"/>
  <text x="442" y="340" font-size="11" fill="#1f2328">떨어뜨리다</text>
  <text x="442" y="357" font-size="10" fill="#57606a">동사, 행위</text>
  <rect x="442" y="368" width="12" height="12" rx="2" fill="#0969da" opacity="0.4"/>
  <text x="462" y="378" font-size="10.5" fill="#57606a">0.10</text>

  <rect x="636" y="312" width="234" height="68" rx="8" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <text x="652" y="334" font-size="11" font-weight="700" fill="#8250df">"그것"의 새 뜻</text>
  <text x="652" y="354" font-size="10.5" fill="#1f2328">0.85×사과 + 0.10×떨어뜨</text>
  <text x="652" y="371" font-size="10.5" fill="#1f2328">+ 0.05×민수</text>
</svg>
