<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="학습 신호가 출력에서 앞쪽 층으로 거슬러 가며 층마다 0.5씩 곱해져 1, 0.5, 0.25, 0.125, 0.06으로 줄어든다. 지름길을 놓으면 신호가 1 그대로 앞쪽까지 간다">
  <defs>
    <marker id="vg-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="vg-arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>

  <!-- 위: 그냥 쌓은 경우 -->
  <rect x="20" y="20" width="720" height="190" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="40" y="48" font-size="15" font-weight="700" fill="#bc4c00">그냥 쌓으면 — 층을 지날 때마다 × 0.5</text>
  <text x="720" y="48" font-size="13" fill="#57606a" text-anchor="end">신호는 오른쪽(출력)에서 왼쪽(앞쪽 층)으로 간다</text>

  <g font-size="13" text-anchor="middle">
    <rect x="45" y="70" width="110" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="100" y="97" fill="#1f2328">1층 (앞쪽)</text>
    <rect x="185" y="70" width="110" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="240" y="97" fill="#1f2328">2층</text>
    <rect x="325" y="70" width="110" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="380" y="97" fill="#1f2328">3층</text>
    <rect x="465" y="70" width="110" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="520" y="97" fill="#1f2328">4층</text>
    <rect x="605" y="70" width="110" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="660" y="97" fill="#1f2328">출력 · 오차</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="603" y1="92" x2="579" y2="92" marker-end="url(#vg-ar)"/>
    <line x1="463" y1="92" x2="439" y2="92" marker-end="url(#vg-ar)"/>
    <line x1="323" y1="92" x2="299" y2="92" marker-end="url(#vg-ar)"/>
    <line x1="183" y1="92" x2="159" y2="92" marker-end="url(#vg-ar)"/>
  </g>
  <!-- 신호 막대 (최대 높이 50, 바닥 y=190) -->
  <rect x="640" y="140" width="40" height="50" rx="3" fill="#bc4c00"/>
  <rect x="500" y="165" width="40" height="25" rx="3" fill="#bc4c00" opacity="0.8"/>
  <rect x="360" y="177.5" width="40" height="12.5" rx="3" fill="#bc4c00" opacity="0.6"/>
  <rect x="220" y="183.75" width="40" height="6.25" rx="2" fill="#bc4c00" opacity="0.5"/>
  <rect x="80" y="187" width="40" height="3" rx="1" fill="#bc4c00" opacity="0.4"/>
  <g font-size="13" font-weight="700" fill="#1f2328">
    <text x="690" y="170">1</text>
    <text x="550" y="182">0.5</text>
    <text x="410" y="188">0.25</text>
    <text x="270" y="190">0.125</text>
    <text x="130" y="190">0.06</text>
  </g>

  <!-- 아래: 지름길 -->
  <rect x="20" y="226" width="720" height="200" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="40" y="254" font-size="15" font-weight="700" fill="#1a7f37">지름길을 놓으면 (ResNet) — 옆길은 × 1</text>
  <text x="720" y="254" font-size="13" fill="#57606a" text-anchor="end">층 출력 F(x)에 입력 x를 그대로 더한다</text>

  <g font-size="13" text-anchor="middle">
    <rect x="45" y="330" width="110" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="100" y="357" fill="#1f2328">1층 (앞쪽)</text>
    <rect x="185" y="330" width="110" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="240" y="357" fill="#1f2328">2층</text>
    <rect x="325" y="330" width="110" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="380" y="357" fill="#1f2328">3층</text>
    <rect x="465" y="330" width="110" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="520" y="357" fill="#1f2328">4층</text>
    <rect x="605" y="330" width="110" height="44" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="660" y="357" fill="#1f2328">출력 · 오차</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5">
    <line x1="603" y1="352" x2="579" y2="352" marker-end="url(#vg-ar)"/>
    <line x1="463" y1="352" x2="439" y2="352" marker-end="url(#vg-ar)"/>
    <line x1="323" y1="352" x2="299" y2="352" marker-end="url(#vg-ar)"/>
    <line x1="183" y1="352" x2="159" y2="352" marker-end="url(#vg-ar)"/>
  </g>
  <!-- 지름길 곡선 -->
  <path d="M660,328 C660,286 520,286 520,328" fill="none" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#vg-arg)"/>
  <path d="M520,328 C520,286 380,286 380,328" fill="none" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#vg-arg)"/>
  <path d="M380,328 C380,286 240,286 240,328" fill="none" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#vg-arg)"/>
  <path d="M240,328 C240,286 100,286 100,328" fill="none" stroke="#1a7f37" stroke-width="2.5" marker-end="url(#vg-arg)"/>
  <g font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle">
    <text x="590" y="286">1</text><text x="450" y="286">1</text><text x="310" y="286">1</text><text x="170" y="286">1</text>
  </g>
  <text x="380" y="404" font-size="14" fill="#1f2328" text-anchor="middle">앞쪽 층까지 <tspan font-weight="700" fill="#1a7f37">"얼마나 고쳐라"</tspan>라는 신호가 깎이지 않고 도착한다</text>
</svg>
