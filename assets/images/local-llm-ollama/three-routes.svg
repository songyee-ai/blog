<svg viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">어디서 돌릴까 — 갈래는 셋, 따질 축도 셋</text>
  <text x="24" y="50" font-size="12" fill="#57606a">이름이 아니라 내 문장이 어느 경계를 넘는지를 본다.</text>

  <rect x="24" y="66" width="228" height="188" rx="10" fill="#ddf4ff" stroke="#0969da"/>
  <text x="138" y="92" font-size="13" font-weight="700" fill="#0969da" text-anchor="middle">공개 클라우드 API</text>
  <text x="138" y="112" font-size="11" fill="#57606a" text-anchor="middle">식당에 가서 사 먹기</text>
  <text x="40" y="140" font-size="11" fill="#1f2328">· 가장 좋은 모델을 가장 먼저</text>
  <text x="40" y="160" font-size="11" fill="#1f2328">· 쓴 만큼 돈 (토큰 요금)</text>
  <text x="40" y="180" font-size="11" fill="#1f2328">· 문장이 제공사 서버로 간다</text>
  <text x="40" y="200" font-size="11" fill="#1f2328">· 통제 수단은 약관과 정책</text>
  <text x="40" y="236" font-size="10.5" fill="#0969da">데이터 민감도가 낮을 때</text>

  <rect x="266" y="66" width="228" height="188" rx="10" fill="#fff8c5" stroke="#9a6700"/>
  <text x="380" y="92" font-size="13" font-weight="700" fill="#9a6700" text-anchor="middle">관리형 프라이빗 배포</text>
  <text x="380" y="112" font-size="11" fill="#57606a" text-anchor="middle">식당 룸을 계약해 빌리기</text>
  <text x="282" y="140" font-size="11" fill="#1f2328">· 남의 데이터센터지만 전용 칸</text>
  <text x="282" y="160" font-size="11" fill="#1f2328">· 처리 지역·보관을 계약으로</text>
  <text x="282" y="180" font-size="11" fill="#1f2328">· 요금 + 관리 비용</text>
  <text x="282" y="200" font-size="11" fill="#1f2328">· 시작까지 며칠~몇 주</text>
  <text x="282" y="236" font-size="10.5" fill="#9a6700">민감하지만 품질도 필요할 때</text>

  <rect x="508" y="66" width="228" height="188" rx="10" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="622" y="92" font-size="13" font-weight="700" fill="#1a7f37" text-anchor="middle">로컬 · 온프레미스</text>
  <text x="622" y="112" font-size="11" fill="#57606a" text-anchor="middle">집에서 도시락 싸기</text>
  <text x="524" y="140" font-size="11" fill="#1f2328">· 문장이 내 장비 밖으로 안 감</text>
  <text x="524" y="160" font-size="11" fill="#1f2328">· 장비값·전기·사람 시간</text>
  <text x="524" y="180" font-size="11" fill="#1f2328">· 버전을 내가 고정한다</text>
  <text x="524" y="200" font-size="11" fill="#1f2328">· 패치·백업·분실도 내 몫</text>
  <text x="524" y="236" font-size="10.5" fill="#1a7f37">반출 금지 · 오프라인일 때</text>

  <rect x="24" y="268" width="712" height="66" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="40" y="292" font-size="11.5" fill="#1f2328"><tspan font-weight="700" fill="#0969da">데이터</tspan> 나가도 되나, 나가면 어디에 얼마나 남나 · <tspan font-weight="700" fill="#9a6700">비용</tspan> 한 달 돌리면 어디가 싸고 가장 큰 항목은 무엇인가</text>
  <text x="40" y="314" font-size="11.5" fill="#1f2328"><tspan font-weight="700" fill="#1a7f37">통제권</tspan> 누가 바꾸고, 누가 멈추고, 누가 설명하나 — 실무에선 단계마다 나눠 담는 <tspan font-weight="700">하이브리드</tspan>가 가장 흔하다</text>
</svg>
