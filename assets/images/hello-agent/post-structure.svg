<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="포스트 6단계 구조">
  <style>
    .box { fill: #2b3a55; stroke: #5b7db1; stroke-width: 1.5; rx: 8; }
    .num { font: bold 13px sans-serif; fill: #9fc2f0; }
    .lbl { font: 13px sans-serif; fill: #e8eef8; }
    .arw { stroke: #5b7db1; stroke-width: 1.5; fill: none; }
  </style>
  <rect width="720" height="200" fill="none"/>
  <g>
    <rect class="box" x="20"  y="40" width="100" height="56" rx="8"/>
    <text class="num" x="32" y="62">1</text><text class="lbl" x="32" y="82">한 줄 요약</text>

    <rect class="box" x="140" y="40" width="100" height="56" rx="8"/>
    <text class="num" x="152" y="62">2</text><text class="lbl" x="152" y="82">배운 것</text>

    <rect class="box" x="260" y="40" width="100" height="56" rx="8"/>
    <text class="num" x="272" y="62">3</text><text class="lbl" x="272" y="82">실습 / 코드</text>

    <rect class="box" x="380" y="40" width="100" height="56" rx="8"/>
    <text class="num" x="392" y="62">4</text><text class="lbl" x="392" y="82">그림</text>

    <rect class="box" x="500" y="40" width="100" height="56" rx="8"/>
    <text class="num" x="512" y="62">5</text><text class="lbl" x="512" y="82">막힌 점</text>

    <rect class="box" x="620" y="40" width="80"  height="56" rx="8"/>
    <text class="num" x="632" y="62">6</text><text class="lbl" x="632" y="82">확인</text>
  </g>
  <g class="arw">
    <path d="M120 68 L140 68" marker-end="url(#a)"/>
    <path d="M240 68 L260 68" marker-end="url(#a)"/>
    <path d="M360 68 L380 68" marker-end="url(#a)"/>
    <path d="M480 68 L500 68" marker-end="url(#a)"/>
    <path d="M600 68 L620 68" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7db1"/>
    </marker>
  </defs>
  <text x="20" y="140" style="font:12px sans-serif; fill:#9aa7bb">모든 포스트는 이 순서를 따릅니다. 이미지가 없는 글은 4번을 생략합니다.</text>
</svg>
