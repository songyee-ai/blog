<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">이 문장, 어디에 둘까 — 블로그 작업 폴더로 해 보는 가상 분류</text>
  <text x="24" y="50" font-size="12" fill="#57606a">매 세션 실어도 안전하고, 거의 매번 필요하고, 지켰는지 확인할 수 있는 규칙만 AGENTS.md로 간다.</text>

  <g font-size="12">
    <text x="40" y="82" font-weight="700" fill="#57606a">후보 문장</text>
    <text x="478" y="82" font-weight="700" fill="#57606a" text-anchor="middle">둘 곳</text>
    <text x="556" y="82" font-weight="700" fill="#57606a">까닭</text>

    <!-- 1 -->
    <rect x="24" y="92" width="370" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="40" y="122" fill="#1f2328">"글 파일은 BOM 없는 UTF-8로 저장한다"</text>
    <line x1="398" y1="117" x2="410" y2="117" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="414" y="101" width="128" height="32" rx="16" fill="#ddf4ff" stroke="#0969da"/>
    <text x="478" y="122" font-weight="700" fill="#0969da" text-anchor="middle">AGENTS.md</text>
    <text x="556" y="113" fill="#1f2328">어느 도구든 매번 필요</text>
    <text x="556" y="130" fill="#57606a">명령으로 확인할 수 있다</text>

    <!-- 2 -->
    <rect x="24" y="150" width="370" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="40" y="180" fill="#1f2328">"Claude Code에서만 쓰는 스킬 이름과 부르는 법"</text>
    <line x1="398" y1="175" x2="410" y2="175" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="414" y="159" width="128" height="32" rx="16" fill="#fbefff" stroke="#8250df"/>
    <text x="478" y="180" font-weight="700" fill="#8250df" text-anchor="middle">CLAUDE.md</text>
    <text x="556" y="171" fill="#1f2328">한 도구에만 해당한다</text>
    <text x="556" y="188" fill="#57606a">다른 도구에선 뜻이 없다</text>

    <!-- 3 -->
    <rect x="24" y="208" width="370" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="40" y="238" fill="#1f2328">"이번 달 연재 순서와 회차별 날짜"</text>
    <line x1="398" y1="233" x2="410" y2="233" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="414" y="217" width="128" height="32" rx="16" fill="#dafbe1" stroke="#1a7f37"/>
    <text x="478" y="238" font-weight="700" fill="#1a7f37" text-anchor="middle">따로 둔 문서</text>
    <text x="556" y="229" fill="#1f2328">규칙이 아니라 사실</text>
    <text x="556" y="246" fill="#57606a">자주 바뀐다</text>

    <!-- 4 -->
    <rect x="24" y="266" width="370" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="40" y="296" fill="#1f2328">"새 글 올리는 열두 단계 절차"</text>
    <line x1="398" y1="291" x2="410" y2="291" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="414" y="275" width="128" height="32" rx="16" fill="#fff1e5" stroke="#bc4c00"/>
    <text x="478" y="296" font-weight="700" fill="#bc4c00" text-anchor="middle">스킬</text>
    <text x="556" y="287" fill="#1f2328">길고, 가끔만 필요하다</text>
    <text x="556" y="304" fill="#57606a">그때만 펼쳐 읽게 한다</text>

    <!-- 5 -->
    <rect x="24" y="324" width="370" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="40" y="354" fill="#1f2328">"GitHub 토큰 값"</text>
    <line x1="398" y1="349" x2="410" y2="349" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="414" y="333" width="128" height="32" rx="16" fill="#ffebe9" stroke="#cf222e"/>
    <text x="478" y="354" font-weight="700" fill="#cf222e" text-anchor="middle">넣지 않는다</text>
    <text x="556" y="345" fill="#1f2328">비밀값이다</text>
    <text x="556" y="362" fill="#57606a">매 세션 모델 입력에 실린다</text>

    <!-- 6 -->
    <rect x="24" y="382" width="370" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="40" y="412" fill="#1f2328">"글을 깔끔하고 보기 좋게 쓴다"</text>
    <line x1="398" y1="407" x2="410" y2="407" stroke="#57606a" stroke-width="1.5" marker-end="url(#ar)"/>
    <rect x="414" y="391" width="128" height="32" rx="16" fill="#f6f8fa" stroke="#57606a"/>
    <text x="478" y="412" font-weight="700" fill="#57606a" text-anchor="middle">고쳐 쓴다</text>
    <text x="556" y="403" fill="#1f2328">지켰는지 판정할 수 없다</text>
    <text x="556" y="420" fill="#57606a">확인 가능한 문장으로</text>
  </g>

  <rect x="24" y="446" width="712" height="42" rx="8" fill="none" stroke="#8250df" stroke-dasharray="5 4"/>
  <text x="40" y="472" font-size="12" fill="#1f2328">CLAUDE.md 첫 줄에 <tspan font-weight="700" fill="#8250df">@AGENTS.md</tspan> — 공통 규칙은 한 파일에만 쓰고, Claude Code는 그것을 가져와 읽는다 (21회차 수업 기준)</text>
</svg>
