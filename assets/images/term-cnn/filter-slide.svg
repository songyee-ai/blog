<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="작은 돋보기 필터 하나가 그림 위를 한 칸씩 옮겨 다니며 같은 무늬를 찾고, 층이 쌓일수록 선과 모서리에서 곡선과 모양, 눈과 바퀴 같은 복잡한 것으로 조합된다">
  <defs>
    <marker id="cnn-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <text x="20" y="30" font-size="16" font-weight="700" fill="#57606a">돋보기 하나로 그림 전체를 훑는다</text>

  <!-- 그림 격자 6x6 -->
  <rect x="20" y="50" width="250" height="250" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="76" font-size="14" font-weight="700" fill="#1f2328">그림 (픽셀 칸)</text>
  <g stroke="#d0d7de" stroke-width="1" fill="#ffffff">
    <rect x="45" y="92" width="32" height="32"/><rect x="77" y="92" width="32" height="32"/><rect x="109" y="92" width="32" height="32"/><rect x="141" y="92" width="32" height="32"/><rect x="173" y="92" width="32" height="32"/><rect x="205" y="92" width="32" height="32"/>
    <rect x="45" y="124" width="32" height="32"/><rect x="77" y="124" width="32" height="32"/><rect x="109" y="124" width="32" height="32"/><rect x="141" y="124" width="32" height="32"/><rect x="173" y="124" width="32" height="32"/><rect x="205" y="124" width="32" height="32"/>
    <rect x="45" y="156" width="32" height="32"/><rect x="77" y="156" width="32" height="32"/><rect x="109" y="156" width="32" height="32"/><rect x="141" y="156" width="32" height="32"/><rect x="173" y="156" width="32" height="32"/><rect x="205" y="156" width="32" height="32"/>
    <rect x="45" y="188" width="32" height="32"/><rect x="77" y="188" width="32" height="32"/><rect x="109" y="188" width="32" height="32"/><rect x="141" y="188" width="32" height="32"/><rect x="173" y="188" width="32" height="32"/><rect x="205" y="188" width="32" height="32"/>
    <rect x="45" y="220" width="32" height="32"/><rect x="77" y="220" width="32" height="32"/><rect x="109" y="220" width="32" height="32"/><rect x="141" y="220" width="32" height="32"/><rect x="173" y="220" width="32" height="32"/><rect x="205" y="220" width="32" height="32"/>
    <rect x="45" y="252" width="32" height="32"/><rect x="77" y="252" width="32" height="32"/><rect x="109" y="252" width="32" height="32"/><rect x="141" y="252" width="32" height="32"/><rect x="173" y="252" width="32" height="32"/><rect x="205" y="252" width="32" height="32"/>
  </g>
  <!-- 세로선 무늬 -->
  <rect x="109" y="92" width="32" height="192" fill="#57606a" opacity="0.55"/>
  <!-- 필터 위치 -->
  <rect x="77" y="92" width="96" height="96" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="3"/>
  <rect x="77" y="188" width="96" height="96" fill="none" stroke="#0969da" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="182" y1="140" x2="182" y2="228" stroke="#0969da" stroke-width="2" marker-end="url(#cnn-ar)"/>

  <!-- 설명 카드 -->
  <rect x="290" y="50" width="450" height="250" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="310" y="78" font-size="15" font-weight="700" fill="#0969da">파란 3×3 칸 = 필터 (돋보기)</text>
  <text x="310" y="110" font-size="14" fill="#1f2328">① 좁은 곳만 본다 — 한 번에 9칸</text>
  <text x="330" y="132" font-size="13" fill="#57606a">"여기 세로선이 있나?" 같은 작은 무늬를 찾는다</text>
  <text x="310" y="166" font-size="14" fill="#1f2328">② 한 칸씩 옮기며 그림 전체를 훑는다</text>
  <text x="330" y="188" font-size="13" fill="#57606a">점선 칸처럼 아래로, 옆으로 미끄러진다</text>
  <text x="310" y="222" font-size="14" fill="#1f2328">③ 어디서나 같은 돋보기를 쓴다</text>
  <text x="330" y="244" font-size="13" fill="#57606a">외울 숫자가 줄고, 무늬가 구석에 있어도</text>
  <text x="330" y="264" font-size="13" fill="#57606a">가운데 있어도 똑같이 알아본다</text>

  <!-- 층 사다리 -->
  <text x="20" y="334" font-size="15" font-weight="700" fill="#57606a">층을 쌓으면 작은 무늬가 큰 모양으로 조합된다</text>
  <rect x="20" y="350" width="210" height="90" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="125" y="382" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">낮은 층</text>
  <text x="125" y="410" font-size="13" fill="#57606a" text-anchor="middle">선 · 모서리 · 색</text>

  <line x1="236" y1="395" x2="270" y2="395" stroke="#57606a" stroke-width="1.5" marker-end="url(#cnn-ar)"/>

  <rect x="275" y="350" width="210" height="90" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="380" y="382" font-size="14" font-weight="700" fill="#bc4c00" text-anchor="middle">가운데 층</text>
  <text x="380" y="410" font-size="13" fill="#57606a" text-anchor="middle">곡선 · 동그라미 · 무늬</text>

  <line x1="491" y1="395" x2="525" y2="395" stroke="#57606a" stroke-width="1.5" marker-end="url(#cnn-ar)"/>

  <rect x="530" y="350" width="210" height="90" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="635" y="382" font-size="14" font-weight="700" fill="#1a7f37" text-anchor="middle">높은 층</text>
  <text x="635" y="410" font-size="13" fill="#57606a" text-anchor="middle">눈 · 바퀴 · 얼굴</text>
</svg>
