<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
  <text x="24" y="28" font-size="15" font-weight="700" fill="#1f2328">두 번의 비교, 숫자로</text>
  <text x="24" y="50" font-size="12" fill="#57606a">같은 질문 세트를 같은 모델로 돌리고, 답이 근거와 맞는지는 LLM 판정이 아니라 원문과 한 줄씩 대조해 정했다.</text>

  <g font-size="12">
    <!-- ① RAG 없이 vs RAG -->
    <text x="24" y="86" font-weight="700" fill="#1f2328">① 자료 없이 vs 자료를 찾아서 (RAG)</text>

    <text x="24" y="116" fill="#1f2328">근거와 맞는 답 (11개 중)</text>
    <rect x="250" y="104" width="400" height="14" rx="3" fill="#f6f8fa"/>
    <rect x="250" y="104" width="36" height="14" rx="3" fill="#8c959f"/>
    <text x="660" y="115" fill="#57606a">없이 1/11</text>
    <rect x="250" y="122" width="400" height="14" rx="3" fill="#f6f8fa"/>
    <rect x="250" y="122" width="291" height="14" rx="3" fill="#0969da"/>
    <text x="660" y="133" font-weight="700" fill="#0969da">RAG 8/11</text>

    <text x="24" y="170" fill="#1f2328">범위 밖 질문 거절 (4개 중)</text>
    <rect x="250" y="158" width="400" height="14" rx="3" fill="#f6f8fa"/>
    <rect x="250" y="158" width="100" height="14" rx="3" fill="#8c959f"/>
    <text x="660" y="169" fill="#57606a">없이 1/4</text>
    <rect x="250" y="176" width="400" height="14" rx="3" fill="#f6f8fa"/>
    <rect x="250" y="176" width="300" height="14" rx="3" fill="#0969da"/>
    <text x="660" y="187" font-weight="700" fill="#0969da">RAG 3/4</text>

    <!-- ② 인용 지시 -->
    <text x="24" y="232" font-weight="700" fill="#1f2328">② "자료 문장을 그대로 인용하라" 한 줄 넣기 전 vs 후</text>

    <text x="24" y="262" fill="#1f2328">근거를 왜곡하지 않은 답 (7개 중)</text>
    <rect x="250" y="250" width="400" height="14" rx="3" fill="#f6f8fa"/>
    <rect x="250" y="250" width="229" height="14" rx="3" fill="#8c959f"/>
    <text x="660" y="261" fill="#57606a">전 4/7</text>
    <rect x="250" y="268" width="400" height="14" rx="3" fill="#f6f8fa"/>
    <rect x="250" y="268" width="400" height="14" rx="3" fill="#0969da"/>
    <text x="660" y="279" font-weight="700" fill="#0969da">후 7/7</text>

    <text x="24" y="316" fill="#1f2328">범위 밖 질문 거절 (4개 중)</text>
    <rect x="250" y="304" width="400" height="14" rx="3" fill="#f6f8fa"/>
    <rect x="250" y="304" width="300" height="14" rx="3" fill="#8c959f"/>
    <text x="660" y="315" fill="#57606a">전 3/4</text>
    <rect x="250" y="322" width="400" height="14" rx="3" fill="#f6f8fa"/>
    <rect x="250" y="322" width="200" height="14" rx="3" fill="#cf222e"/>
    <text x="660" y="333" font-weight="700" fill="#cf222e">후 2/4</text>

    <rect x="24" y="356" width="712" height="34" rx="8" fill="#fff8c5" stroke="#9a6700"/>
    <text x="38" y="378" fill="#1f2328">인용 지시는 왜곡을 없앤 대신 거절을 약하게 만들었다. LLM 판정은 이 변화를 못 잡았다 (6/7 → 6/7).</text>
  </g>
</svg>
