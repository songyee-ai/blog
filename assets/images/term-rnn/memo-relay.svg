<svg viewBox="0 0 760 500" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-label="위 칸의 RNN은 단어를 하나씩 읽으며 요약 메모를 다음 단어로 넘기는데, 넘길 때마다 첫 단어 나는의 흔적이 짧아져 마지막에는 거의 남지 않는다. 아래 칸의 LSTM은 셀 상태라는 두 번째 메모장을 따로 두어 흔적이 거의 그대로 끝까지 간다. 입력, 망각, 출력 게이트가 이 메모장을 여닫는다">
  <defs>
    <marker id="rn-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="rn-arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>

  <!-- 위: RNN -->
  <rect x="20" y="20" width="720" height="210" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="1.5"/>
  <text x="40" y="48" font-size="15" font-weight="700" fill="#bc4c00">RNN — 요약 메모 한 장을 계속 고쳐 쓰며 넘긴다</text>
  <text x="720" y="48" font-size="13" fill="#57606a" text-anchor="end">주황 막대 = 메모 속 '나는'의 흔적</text>

  <g font-size="14" text-anchor="middle" fill="#1f2328">
    <rect x="45" y="66" width="110" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="100" y="88">나는</text>
    <rect x="185" y="66" width="110" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="240" y="88">어제</text>
    <rect x="325" y="66" width="110" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="380" y="88">학교에서</text>
    <rect x="465" y="66" width="110" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="520" y="88">친구와</text>
    <rect x="605" y="66" width="110" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="660" y="88">놀았다</text>
  </g>
  <g stroke="#57606a" stroke-width="1.3">
    <line x1="100" y1="102" x2="100" y2="126" marker-end="url(#rn-ar)"/>
    <line x1="240" y1="102" x2="240" y2="126" marker-end="url(#rn-ar)"/>
    <line x1="380" y1="102" x2="380" y2="126" marker-end="url(#rn-ar)"/>
    <line x1="520" y1="102" x2="520" y2="126" marker-end="url(#rn-ar)"/>
    <line x1="660" y1="102" x2="660" y2="126" marker-end="url(#rn-ar)"/>
  </g>
  <g>
    <rect x="45" y="130" width="110" height="60" rx="6" fill="#ffffff" stroke="#bc4c00"/>
    <rect x="185" y="130" width="110" height="60" rx="6" fill="#ffffff" stroke="#bc4c00"/>
    <rect x="325" y="130" width="110" height="60" rx="6" fill="#ffffff" stroke="#bc4c00"/>
    <rect x="465" y="130" width="110" height="60" rx="6" fill="#ffffff" stroke="#bc4c00"/>
    <rect x="605" y="130" width="110" height="60" rx="6" fill="#ffffff" stroke="#bc4c00"/>
  </g>
  <g font-size="13" fill="#57606a" text-anchor="middle">
    <text x="100" y="152">메모 1</text><text x="240" y="152">메모 2</text><text x="380" y="152">메모 3</text><text x="520" y="152">메모 4</text><text x="660" y="152">메모 5</text>
  </g>
  <g fill="#eaeef2">
    <rect x="60" y="164" width="80" height="12" rx="3"/><rect x="200" y="164" width="80" height="12" rx="3"/><rect x="340" y="164" width="80" height="12" rx="3"/><rect x="480" y="164" width="80" height="12" rx="3"/><rect x="620" y="164" width="80" height="12" rx="3"/>
  </g>
  <g fill="#bc4c00">
    <rect x="60" y="164" width="80" height="12" rx="3"/>
    <rect x="200" y="164" width="50" height="12" rx="3" opacity="0.85"/>
    <rect x="340" y="164" width="30" height="12" rx="3" opacity="0.7"/>
    <rect x="480" y="164" width="16" height="12" rx="3" opacity="0.55"/>
    <rect x="620" y="164" width="6" height="12" rx="2" opacity="0.45"/>
  </g>
  <g stroke="#57606a" stroke-width="1.3">
    <line x1="157" y1="160" x2="181" y2="160" marker-end="url(#rn-ar)"/>
    <line x1="297" y1="160" x2="321" y2="160" marker-end="url(#rn-ar)"/>
    <line x1="437" y1="160" x2="461" y2="160" marker-end="url(#rn-ar)"/>
    <line x1="577" y1="160" x2="601" y2="160" marker-end="url(#rn-ar)"/>
  </g>
  <text x="380" y="216" font-size="13" fill="#1f2328" text-anchor="middle">넘길 때마다 새 단어로 덮여서, 끝에 가면 '나는'이 거의 안 남는다</text>

  <!-- 아래: LSTM -->
  <rect x="20" y="246" width="720" height="238" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="40" y="274" font-size="15" font-weight="700" fill="#1a7f37">LSTM — 두 번째 메모장(셀 상태)을 따로 둔다</text>

  <g font-size="14" text-anchor="middle" fill="#1f2328">
    <rect x="45" y="290" width="110" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="100" y="312">나는</text>
    <rect x="185" y="290" width="110" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="240" y="312">어제</text>
    <rect x="325" y="290" width="110" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="380" y="312">학교에서</text>
    <rect x="465" y="290" width="110" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="520" y="312">친구와</text>
    <rect x="605" y="290" width="110" height="34" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="660" y="312">놀았다</text>
  </g>
  <g stroke="#57606a" stroke-width="1.3">
    <line x1="100" y1="326" x2="100" y2="338" marker-end="url(#rn-ar)"/>
    <line x1="240" y1="326" x2="240" y2="338" marker-end="url(#rn-ar)"/>
    <line x1="380" y1="326" x2="380" y2="338" marker-end="url(#rn-ar)"/>
    <line x1="520" y1="326" x2="520" y2="338" marker-end="url(#rn-ar)"/>
    <line x1="660" y1="326" x2="660" y2="338" marker-end="url(#rn-ar)"/>
  </g>
  <!-- 셀 상태 통로 -->
  <rect x="45" y="340" width="670" height="60" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="61" y="362" font-size="13" font-weight="700" fill="#1a7f37">셀 상태 — 곱셈으로 뒤섞지 않아 거의 그대로 흐른다</text>
  <line x1="61" y1="383" x2="705" y2="383" stroke="#1a7f37" stroke-width="2" marker-end="url(#rn-arg)"/>
  <g fill="#bc4c00">
    <rect x="80" y="376" width="40" height="14" rx="3"/>
    <rect x="220" y="376" width="38" height="14" rx="3"/>
    <rect x="360" y="376" width="36" height="14" rx="3"/>
    <rect x="500" y="376" width="35" height="14" rx="3"/>
    <rect x="640" y="376" width="34" height="14" rx="3"/>
  </g>
  <text x="380" y="428" font-size="13" fill="#1f2328" text-anchor="middle">'나는'의 흔적이 끝까지 거의 그대로 간다</text>
  <text x="380" y="458" font-size="13" fill="#57606a" text-anchor="middle">게이트 세 개가 메모장을 여닫는다 — 입력(무엇을 적을지) · 망각(무엇을 지울지) · 출력(무엇을 꺼낼지)</text>
</svg>
