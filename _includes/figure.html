{%- comment -%}
캡션이 있는 이미지를 넣습니다.
사용법:
  {% include figure.html src="/assets/images/슬러그/파일.png" alt="대체 텍스트" caption="그림 1. 설명" %}
옵션:
  width="60%"  가로 크기 제한
{%- endcomment -%}
<figure class="post-figure"{% if include.width %} style="max-width: {{ include.width }}"{% endif %}>
  <img src="{{ include.src | relative_url }}" alt="{{ include.alt | default: include.caption }}" loading="lazy">
  {%- if include.caption %}
  <figcaption>{{ include.caption }}</figcaption>
  {%- endif %}
</figure>
